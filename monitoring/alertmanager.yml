# Alertmanager routing/receiver config for the prod monitoring stack (see
# docker-compose.monitoring-prod.yml and alert-rules.yml, which is evaluated
# by Prometheus but was previously going nowhere without this).
#
# The Slack webhook URLs are intentionally NOT inlined here — Alertmanager has
# no ${ENV_VAR} substitution in its config file, and a real webhook must
# never be committed. `api_url_file` instead points at files mounted at
# runtime, written by MonitoringInstance's deploy.sh (cloudformation/hrms-deploy.yaml)
# from Secrets Manager (see docker-compose.monitoring-prod.yml's own comment
# on that). Until those files exist on the monitoring host, this config is
# otherwise complete and Alertmanager will just fail to deliver (visible in
# its own logs) rather than paging nowhere silently.

global:
  resolve_timeout: 5m

# slack-critical reads from a SEPARATE webhook file (slack_webhook_url_critical)
# so a distinct, dedicated critical channel can be wired in later purely via
# Secrets Manager + the AlertmanagerCriticalSlackWebhookSecretName CFN param —
# no change needed here. Until that secret is provisioned, deploy.sh mirrors
# the default webhook into that file, so both receivers page the same place.
# What's always been true regardless of whether the webhooks differ: a firing
# critical alert (e.g. ServiceDown) doesn't wait as long as a warning-level
# blip to re-remind, and doesn't get buried in the same 4-hour repeat cadence
# as routine noise.
route:
  receiver: slack-default
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: slack-critical
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 15m

receivers:
  - name: slack-default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: "#hrms-alerts"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

  - name: slack-critical
    slack_configs:
      # channel: is best-effort — modern Slack incoming webhooks are bound to
      # one channel at creation time in Slack's own UI and ignore this
      # override, so it only takes effect for legacy "classic" webhooks. It's
      # still worth setting distinctly: harmless when this file is a mirror
      # of the default (Slack just ignores it), correct documentation once a
      # real, separate webhook is provisioned.
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url_critical
        channel: "#hrms-alerts-critical"
        send_resolved: true
        title: ":rotating_light: {{ .CommonLabels.alertname }} (critical)"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
