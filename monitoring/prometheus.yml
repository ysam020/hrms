global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9003"]
        labels:
          service: api-gateway

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:9101"]
        labels:
          service: auth-service

  - job_name: user-service
