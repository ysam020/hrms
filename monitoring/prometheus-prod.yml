# Used by the dedicated monitoring EC2 host in prod (see MonitoringInstance in
# cloudformation/hrms-deploy.yaml). The ASG scales the app fleet to 2-4
# instances, so static targets (like prometheus.yml / prometheus-local.yml use)
# don't work here — instead each job uses EC2 service discovery to find every
# running instance tagged Name=hrms-prod and scrapes its published metrics
# port directly over the VPC (see the "ports" additions in
# docker-compose.prod.yml). Region is hardcoded to match the stack's deploy
# region (ap-south-1) — update if this stack is ever deployed elsewhere.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# See alert-rules.yml — evaluated by this Prometheus instance and forwarded
# to the alertmanager service (docker-compose.monitoring-prod.yml) for
# actual paging. See alertmanager.yml for the receiver config.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: api-gateway
    ec2_sd_configs:
      - region: ap-south-1
        port: 19003
        filters:
          - name: tag:Name
            values: ["hrms-prod"]
          - name: instance-state-name
            values: ["running"]
    relabel_configs:
      - source_labels: [__meta_ec2_private_ip]
        regex: "(.+)"
        replacement: "${1}:19003"
        target_label: __address__
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id
      - source_labels: [__meta_ec2_availability_zone]
        target_label: az
      - target_label: service
        replacement: api-gateway

  - job_name: auth-service
    ec2_sd_configs:
