# Prometheus alerting rules for the prod stack (see prometheus-prod.yml,
# which scrapes http_requests_total/grpc_requests_total/*_duration_ms from
# every service's prom-client /metrics endpoint — packages/logger/src/index.ts).
#
# Forwarded to the alertmanager service (docker-compose.monitoring-prod.yml)
# via prometheus-prod.yml's `alerting.alertmanagers` config, which pages
# #hrms-alerts on Slack (see alertmanager.yml). The monitoring host's
# deploy.sh (cloudformation/hrms-deploy.yaml) writes the real Slack webhook(s)
# to ./monitoring/secrets/ from Secrets Manager on every boot/redeploy —
# until those files exist, Alertmanager fails to deliver (visibly, in its own
# logs) rather than silently paging nowhere.
groups:
  - name: service-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} instance {{ $labels.instance_id }} is down"
          description: "Prometheus has failed to scrape {{ $labels.service }} ({{ $labels.instance }}) for 2 minutes."

  - name: http-errors
    rules:
      - alert: HighHttpErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          sum by (service) (rate(http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 5xx rate above 5%"
          description: "{{ $labels.service }} has returned 5xx for more than 5% of requests over the last 5 minutes."

      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_ms_bucket[5m]))
          ) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p95 latency above 2s"
          description: "{{ $labels.service }}'s 95th percentile HTTP request duration has exceeded 2000ms for 5 minutes."

  - name: grpc-errors
    rules:
      - alert: HighGrpcLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(grpc_request_duration_ms_bucket[5m]))
          ) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} gRPC p95 latency above 1s"
          description: "{{ $labels.service }}'s 95th percentile gRPC request duration has exceeded 1000ms for 5 minutes."
