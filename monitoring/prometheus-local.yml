# Used when running services and monitoring natively (no Docker).
# All processes run on localhost.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["localhost:9003"]
        labels:
          service: api-gateway

  - job_name: auth-service
    static_configs:
      - targets: ["localhost:9101"]
        labels:
          service: auth-service

  - job_name: user-service
    static_configs:
      - targets: ["localhost:9102"]
        labels:
          service: user-service

  - job_name: employee-service
    static_configs:
      - targets: ["localhost:9103"]
        labels:
          service: employee-service

  - job_name: attendance-service
    static_configs:
      - targets: ["localhost:9104"]
        labels:
          service: attendance-service

  - job_name: leave-service
    static_configs:
      - targets: ["localhost:9105"]
        labels:
          service: leave-service

  - job_name: recruitment-service
    static_configs:
      - targets: ["localhost:9106"]
        labels:
          service: recruitment-service

  - job_name: hrm-service
    static_configs:
      - targets: ["localhost:9107"]
        labels:
          service: hrm-service

  - job_name: salary-service
    static_configs:
      - targets: ["localhost:9108"]
        labels:
          service: salary-service

  - job_name: analytics-service
    static_configs:
      - targets: ["localhost:9109"]
        labels:
          service: analytics-service

  - job_name: notification-service
    static_configs:
      - targets: ["localhost:9110"]
        labels:
          service: notification-service

  - job_name: scheduler-service
    static_configs:
      - targets: ["localhost:9111"]
        labels:
          service: scheduler-service
