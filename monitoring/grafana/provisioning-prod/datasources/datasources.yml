apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # No Loki in prod — logs already ship to CloudWatch Logs from every service
  # (packages/logger's WinstonCloudWatch transport, log group /hrms/<service>/production).
  # authType "default" uses the monitoring instance's IAM role (see
  # MonitoringInstanceRole in cloudformation/hrms-deploy.yaml) — no keys needed.
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    editable: false
    jsonData:
      authType: default
      defaultRegion: ap-south-1
