name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the commit SHA that was built). Use this to roll back to a previous tag already in ECR."
        required: false
        type: string
  workflow_run:
    workflows:
      - Build and publish Docker images
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
            else
              IMAGE_TAG="${{ github.sha }}"
            fi
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Publish deploy config to S3
        run: |
          set -euo pipefail
          aws s3 cp docker-compose.prod.yml "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/docker-compose.prod.yml"

      - name: Point instances at the new image tag
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name /hrms/prod/image-tag \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite

      - name: Roll out to ASG instances via SSM
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ vars.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No in-service instances found in ASG ${{ vars.ASG_NAME }}"
            exit 1
          fi
          echo "Deploying $IMAGE_TAG to: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --parameters 'commands=["sudo /opt/hrms/deploy.sh"]' \
            --comment "hrms deploy $IMAGE_TAG" \
            --query 'Command.CommandId' --output text)

          # aws ssm wait command-executed gives up after ~100s (20 attempts x 5s),
          # which is shorter than a cold image pull can take (e.g. a freshly
          # replaced instance with an empty docker cache). Poll manually instead
          # with a timeout long enough to cover that.
          TIMEOUT=900
          INTERVAL=10

          FAILED=0
          for id in $INSTANCE_IDS; do
            ELAPSED=0
            while true; do
              STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")

              if [ "$STATUS" = "Success" ]; then
                echo "Deploy succeeded on instance $id"
                break
              fi

              case "$STATUS" in
                Pending|InProgress|Delayed)
                  if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                    echo "::error::Deploy on instance $id did not finish within ${TIMEOUT}s (last status: $STATUS)"
                    FAILED=1
                    break
                  fi
                  sleep "$INTERVAL"
                  ELAPSED=$((ELAPSED + INTERVAL))
                  ;;
                *)
                  echo "::error::Deploy failed on instance $id (status: $STATUS)"
                  aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id" \
                    --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' --output json || true
                  FAILED=1
                  break
                  ;;
              esac
            done
          done

          exit $FAILED
