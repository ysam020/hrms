name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the commit SHA that was built). Use this to roll back to a previous tag already in ECR."
        required: false
        type: string
  workflow_run:
    workflows:
      - Build and publish Docker images
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
            else
              IMAGE_TAG="${{ github.sha }}"
            fi
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Publish deploy config to S3
        run: |
          set -euo pipefail
          aws s3 cp docker-compose.prod.yml "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/docker-compose.prod.yml"
          aws s3 cp docker-compose.monitoring-prod.yml "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/docker-compose.monitoring-prod.yml"
          aws s3 sync monitoring/ "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/monitoring/" --delete

      - name: Roll out to ASG instances via SSM (batched, health-checked, auto-rollback)
        run: |
          set -euo pipefail

          # Captured before overwriting the SSM parameter below, so a failed
          # rollout has a known-good tag to revert already-updated instances
          # to. Empty on the very first-ever deploy (parameter doesn't exist
          # yet) — nothing to roll back to in that case, which is fine since
          # there's no previously-working fleet to protect.
          #
          # Known, accepted tradeoff: /hrms/prod/image-tag is one parameter
          # shared by the whole fleet (deploy.sh on every instance reads it),
          # so it's already pointing at the new, not-yet-verified tag for the
          # full duration of this rollout, not just the moment each instance
          # is actually touched. An instance not yet reached by this loop that
          # happens to restart on its own (host reboot, OOM) would pull the
          # new tag early via its deploy.sh systemd unit. This risk predates
          # this workflow's batching (the previous all-at-once rollout had the
          # same exposure, just compressed into one instant) and fixing it
          # would need a per-instance tag rather than one shared parameter —
          # out of scope for staging the rollout itself.
          PREVIOUS_IMAGE_TAG=$(aws ssm get-parameter --name /hrms/prod/image-tag \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ vars.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No in-service instances found in ASG ${{ vars.ASG_NAME }}"
            exit 1
          fi

          TARGET_GROUP_ARN=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ vars.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].TargetGroupARNs[0]' --output text)

          # aws ssm wait command-executed gives up after ~100s (20 attempts x 5s),
          # which is shorter than a cold image pull can take (e.g. a freshly
          # replaced instance with an empty docker cache). Poll manually instead
          # with a timeout long enough to cover that.
          wait_for_ssm_command() {
            local command_id="$1" instance_id="$2" timeout="$3"
            local elapsed=0 status
            while true; do
              status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")
              case "$status" in
                Success) return 0 ;;
                Pending|InProgress|Delayed)
                  if [ "$elapsed" -ge "$timeout" ]; then
                    echo "::error::Command on instance $instance_id did not finish within ${timeout}s (last status: $status)"
                    return 1
                  fi
                  sleep 10
                  elapsed=$((elapsed + 10))
                  ;;
                *)
                  echo "::error::Command failed on instance $instance_id (status: $status)"
                  aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
                    --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' --output json || true
                  return 1
                  ;;
              esac
            done
          }

          # ELB health checks (HealthyThresholdCount: 2, 30s interval) need up
          # to ~60s of consecutive passes after a container restart before the
          # target group reports "healthy" — this catches a container that
          # exits cleanly from deploy.sh's `up -d` but then crash-loops or
          # never opens /health, which an SSM command exit code alone can't.
          wait_for_target_healthy() {
            local instance_id="$1" timeout="$2"
            local elapsed=0 state
            while true; do
              state=$(aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
                --targets "Id=$instance_id" \
                --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text 2>/dev/null || echo "unknown")
              if [ "$state" = "healthy" ]; then
                return 0
              fi
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "::error::Instance $instance_id did not become healthy within ${timeout}s (last state: $state)"
                return 1
              fi
              sleep 10
              elapsed=$((elapsed + 10))
            done
          }

          deploy_tag_to_instances() {
            local tag="$1"
            shift
            aws ssm put-parameter --name /hrms/prod/image-tag --value "$tag" --type String --overwrite
            local ids="$*"
            local cmd_id
            cmd_id=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids $ids \
              --parameters 'commands=["sudo /opt/hrms/deploy.sh"]' \
              --comment "hrms deploy $tag" \
              --query 'Command.CommandId' --output text)
            local id ok=0
            for id in $ids; do
              wait_for_ssm_command "$cmd_id" "$id" 900 || ok=1
            done
            return $ok
          }

          rollback() {
            local updated_ids="$*"
            if [ -z "$PREVIOUS_IMAGE_TAG" ] || [ -z "$updated_ids" ]; then
              echo "::error::No previous image tag to roll back to (or no instances were updated yet) — leaving the fleet as-is."
              return
            fi
            echo "::error::Rolling back $updated_ids to previous image tag $PREVIOUS_IMAGE_TAG"
            deploy_tag_to_instances "$PREVIOUS_IMAGE_TAG" $updated_ids || \
              echo "::error::Rollback itself failed — manual intervention required for: $updated_ids"
          }

          # One instance at a time: a bad image only ever reaches a single
          # instance before the rollout halts, instead of the whole fleet
          # going bad simultaneously the way sending the SSM command to every
          # instance at once did previously.
          UPDATED_IDS=""
          for id in $INSTANCE_IDS; do
            echo "Deploying $IMAGE_TAG to instance $id"
            if ! deploy_tag_to_instances "$IMAGE_TAG" "$id"; then
              rollback $UPDATED_IDS
              exit 1
            fi
            if ! wait_for_target_healthy "$id" 180; then
              UPDATED_IDS="$UPDATED_IDS $id"
              rollback $UPDATED_IDS
              exit 1
            fi
            UPDATED_IDS="$UPDATED_IDS $id"
            echo "Instance $id is healthy on $IMAGE_TAG"
          done

          echo "Rollout complete: $IMAGE_TAG is healthy on all instances ($UPDATED_IDS)"

      - name: Redeploy monitoring host via SSM
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=hrms-monitoring" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running hrms-monitoring instance found - skipping (has the stack been deployed?)"
            exit 0
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=["sudo /opt/hrms-monitoring/deploy.sh"]' \
            --comment "hrms monitoring redeploy" \
            --query 'Command.CommandId' --output text)

          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              echo "Monitoring redeploy succeeded on instance $INSTANCE_ID"
              break
            fi

            case "$STATUS" in
              Pending|InProgress|Delayed)
                if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                  echo "::error::Monitoring redeploy did not finish within ${TIMEOUT}s (last status: $STATUS)"
                  exit 1
                fi
                sleep "$INTERVAL"
                ELAPSED=$((ELAPSED + INTERVAL))
                ;;
              *)
                echo "::error::Monitoring redeploy failed (status: $STATUS)"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' --output json || true
                exit 1
                ;;
            esac
          done
