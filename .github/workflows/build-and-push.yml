name: Build and publish Docker images

# Chained off CI (not a parallel push trigger) so a red CI run can never be
# followed by a build-and-push + auto-deploy of the same broken commit —
# mirrors the same workflow_run pattern deploy-ec2.yml already uses to gate
# on this workflow's own result.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'ap-south-1' }}.amazonaws.com
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'dev' }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: docker/base.Dockerfile
            repo: api-gateway
            app_dir: api-gateway
            project: api-gateway-service
            port: 9002
          - name: auth-service
            dockerfile: docker/base.Dockerfile
            repo: auth-service
            app_dir: auth-service
            project: auth-service
            port: 50051
          - name: user-service
            dockerfile: docker/base.Dockerfile
            repo: user-service
            app_dir: user-service
            project: user-service
            port: 50052
          - name: employee-service
            dockerfile: docker/base.Dockerfile
            repo: employee-service
            app_dir: employee-service
            project: employee-service
            port: 50053
          - name: attendance-service
            dockerfile: docker/base.Dockerfile
            repo: attendance-service
            app_dir: attendance-service
            project: attendance-service
            port: 50054
          - name: leave-service
            dockerfile: docker/base.Dockerfile
            repo: leave-service
            app_dir: leave-service
            project: leave-service
            port: 50055
          - name: recruitment-service
            dockerfile: docker/base.Dockerfile
            repo: recruitment-service
            app_dir: recruitment-service
            project: recruitment-service
            port: 50056
          - name: hrm-service
            dockerfile: docker/base.Dockerfile
            repo: hrm-service
            app_dir: hrm-service
            project: hrm-service
            port: 50057
          - name: salary-service
            dockerfile: docker/base.Dockerfile
            repo: salary-service
            app_dir: salary-service
            project: salary-service
            port: 50058
          - name: analytics-service
            dockerfile: docker/base.Dockerfile
            repo: analytics-service
            app_dir: analytics-service
            project: analytics-service
            port: 50059
          - name: notification-service
            dockerfile: docker/base.Dockerfile
            repo: notification-service
            app_dir: notification-service
            project: notification-service
            port: 50060
          - name: performance-review-service
            dockerfile: docker/base.Dockerfile
            repo: performance-review-service
            app_dir: performance-review-service
            project: performance-review-service
            port: 50061
          - name: scheduler-service
            dockerfile: docker/base.Dockerfile
            repo: scheduler-service
            app_dir: scheduler-service
            project: scheduler-service
            port: 9111

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -e
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_PREFIX}/${{ matrix.repo }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPOSITORY_PREFIX}/${{ matrix.repo }}" --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256 >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP_DIR=${{ matrix.app_dir }}
            PROJECT=${{ matrix.project }}
            PORT=${{ matrix.port }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.repo }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.repo }}:latest
          # Scoped per service so the 13 matrix jobs cache independently
          # instead of evicting each other; mode=max also caches
          # intermediate stages (pruner/builder), not just the final layer,
          # so unchanged deps/build steps are skipped on the next run.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
