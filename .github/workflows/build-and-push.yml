name: Build and publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'ap-south-1' }}.amazonaws.com
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'dev' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: docker/base.Dockerfile
            repo: api-gateway
            build_args: --build-arg APP_DIR=api-gateway --build-arg PROJECT=api-gateway-service --build-arg PORT=9002
          - name: auth-service
            dockerfile: docker/base.Dockerfile
            repo: auth-service
            build_args: --build-arg APP_DIR=auth-service --build-arg PROJECT=auth-service --build-arg PORT=50051
          - name: user-service
            dockerfile: docker/base.Dockerfile
            repo: user-service
            build_args: --build-arg APP_DIR=user-service --build-arg PROJECT=user-service --build-arg PORT=50052
          - name: employee-service
            dockerfile: docker/base.Dockerfile
            repo: employee-service
            build_args: --build-arg APP_DIR=employee-service --build-arg PROJECT=employee-service --build-arg PORT=50053
          - name: attendance-service
            dockerfile: docker/base.Dockerfile
            repo: attendance-service
            build_args: --build-arg APP_DIR=attendance-service --build-arg PROJECT=attendance-service --build-arg PORT=50054
          - name: leave-service
            dockerfile: docker/base.Dockerfile
            repo: leave-service
            build_args: --build-arg APP_DIR=leave-service --build-arg PROJECT=leave-service --build-arg PORT=50055
          - name: recruitment-service
            dockerfile: docker/base.Dockerfile
            repo: recruitment-service
            build_args: --build-arg APP_DIR=recruitment-service --build-arg PROJECT=recruitment-service --build-arg PORT=50056
          - name: hrm-service
            dockerfile: docker/base.Dockerfile
            repo: hrm-service
            build_args: --build-arg APP_DIR=hrm-service --build-arg PROJECT=hrm-service --build-arg PORT=50057
          - name: salary-service
            dockerfile: docker/base.Dockerfile
            repo: salary-service
            build_args: --build-arg APP_DIR=salary-service --build-arg PROJECT=salary-service --build-arg PORT=50058
          - name: analytics-service
            dockerfile: docker/base.Dockerfile
            repo: analytics-service
            build_args: --build-arg APP_DIR=analytics-service --build-arg PROJECT=analytics-service --build-arg PORT=50059
          - name: notification-service
            dockerfile: docker/base.Dockerfile
            repo: notification-service
            build_args: --build-arg APP_DIR=notification-service --build-arg PROJECT=notification-service --build-arg PORT=50060
          - name: scheduler-service
            dockerfile: docker/base.Dockerfile
            repo: scheduler-service
            build_args: --build-arg APP_DIR=scheduler-service --build-arg PROJECT=scheduler-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -e
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_PREFIX}/${{ matrix.repo }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPOSITORY_PREFIX}/${{ matrix.repo }}" --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256 >/dev/null

      - name: Build and push ${{ matrix.name }}
        run: |
          set -e
          IMAGE_NAME="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/${{ matrix.repo }}"
          docker build -f "${{ matrix.dockerfile }}" ${{ matrix.build_args }} \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            .
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"
