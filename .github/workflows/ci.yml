name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "8.15.6"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate proto types
        run: pnpm proto:gen

      - name: Lint
        run: pnpm lint

      - name: Typecheck (backend — tsc -b)
        run: pnpm exec turbo run build --filter=!web

      - name: Typecheck (web — noEmit)
        run: pnpm ts:check

      - name: Test
        run: pnpm test

  docker-build:
    name: Docker Compose build (docker-compose.ci.yml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # docker-compose.ci.yml references `.env` via `env_file:` on every
      # service. The values are irrelevant to `docker compose build` (only
      # `docker compose up` reads them into the container), but Compose
      # refuses to even parse the file if `.env` doesn't exist on disk.
      - name: Create placeholder .env
        run: touch .env

      - name: Build all service images
        run: docker compose -f docker-compose.ci.yml build --parallel
