    environment:
      - METRICS_PORT=9104
      - LOKI_URL=http://loki:3100
    ports:
      - "50054:50054"
      - "9104:9104"
    env_file: .env.local

  leave-service:
    container_name: leave-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      no_cache: true
      args:
        - APP_DIR=leave-service
        - PROJECT=@hrms/leave-service
        - PORT=50055
    environment:
      - METRICS_PORT=9105
      - LOKI_URL=http://loki:3100
    ports:
      - "50055:50055"
      - "9105:9105"
    env_file: .env.local

  recruitment-service:
    container_name: recruitment-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      no_cache: true
      args:
        - APP_DIR=recruitment-service
        - PROJECT=@hrms/recruitment-service
        - PORT=50056
    environment:
      - METRICS_PORT=9106
      - LOKI_URL=http://loki:3100
    ports:
      - "50056:50056"
      - "9106:9106"
    env_file: .env.local

  hrm-service:
    container_name: hrm-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      no_cache: true
      args:
        - APP_DIR=hrm-service
        - PROJECT=@hrms/hrm-service
        - PORT=50057
    environment:
      - METRICS_PORT=9107
      - LOKI_URL=http://loki:3100
    ports:
      - "50057:50057"
      - "9107:9107"
    env_file: .env.local

  salary-service:
    container_name: salary-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      no_cache: true
      args:
        - APP_DIR=salary-service
        - PROJECT=@hrms/salary-service
        - PORT=50058
    environment:
      - METRICS_PORT=9108
      - LOKI_URL=http://loki:3100
    ports:
      - "50058:50058"
      - "9108:9108"
    env_file: .env.local

  analytics-service:
    container_name: analytics-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      no_cache: true
      args:
        - APP_DIR=analytics-service
        - PROJECT=@hrms/analytics-service
        - PORT=50059
    environment:
      - METRICS_PORT=9109
      - LOKI_URL=http://loki:3100
    ports:
      - "50059:50059"
      - "9109:9109"
    env_file: .env.local

  notification-service:
    container_name: notification-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      no_cache: true
      args:
        - APP_DIR=notification-service
        - PROJECT=@hrms/notification-service
        - PORT=50060
    environment:
      - METRICS_PORT=9110
      - LOKI_URL=http://loki:3100
    ports:
      - "50060:50060"
      - "9110:9110"
    env_file: .env.local

  scheduler-service:
    container_name: scheduler-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      no_cache: true
      args:
        - APP_DIR=scheduler-service
        - PROJECT=@hrms/scheduler-service
    environment:
      - METRICS_PORT=9111
      - LOKI_URL=http://loki:3100
    ports:
      - "9111:9111"
    env_file: .env.local

  web:
    container_name: web
    build:
      context: .
      dockerfile: ./docker/web.Dockerfile
      no_cache: true
    ports:
      - "80:80"

  mongodb:
    container_name: hrms-mongodb
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hrms
    volumes:
      - mongo-data:/data/db

  redis:
    container_name: hrms-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  prometheus:
    container_name: hrms-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  loki:
    container_name: hrms-loki
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    container_name: hrms-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
