        - PORT=50053
    environment:
      - METRICS_PORT=9103
      - LOKI_URL=http://loki:3100
    ports:
      - "50053:50053"
      - "9103:9103"
    env_file: .env.local

  attendance-service:
    container_name: attendance-service
