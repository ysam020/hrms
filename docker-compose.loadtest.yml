# Isolated load-testing stack (load-testing/README.md).
#
# A separate compose project with its own network and its own Redis, so the
# benchmark never shares rate-limit counters, caches, BullMQ queues or
# sockets with the dev stack. It still uses the shared Atlas cluster
# (DEV_MONGODB_URI from local-secrets.json), and it only ever reads the
# synthetic LOADTEST_ tenants the seeder creates.
#
# Resource limits copy docker-compose.prod.yml (gateway 1 CPU / 768M, each
# service 0.5 CPU / 384M, WEB_CONCURRENCY=2 like prod's 2-vCPU host). The Mac
# hosting this has many more cores than prod, so the containers are not
# contending for one 2-vCPU host the way prod is: treat results as
# comparative, not as prod capacity.
#
# Differences from prod, all deliberate:
#   - ACCESS_JWT_TOKEN is a per-run random secret (LOADTEST_JWT_SECRET), so the
#     tokens minted for the benchmark are useless against any other stack.
#   - RATE_LIMIT_MAX_* overrides come from load-testing/.state/ratelimit.env,
#     written by the runner and emptied again when it exits (see README).
#   - CloudWatch log shipping is off (paid ingestion); logs go to the local
#     Loki with service="loadtest-<name>".
#   - The scheduler and web are not part of the stack.
#
# Usage: driven by `node load-testing/scripts/stack.js up|down|status`.
name: hrms-loadtest

x-service: &service
  volumes:
    - ./packages/certificates:/app/packages/certificates:ro
    - ./local-secrets.json:/app/local-secrets.json:ro
  env_file:
    - path: ./load-testing/.state/ratelimit.env
      required: false
  restart: "no"
  depends_on:
    redis:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 384M

x-env: &env
  LOCAL_SECRETS_FILE: /app/local-secrets.json
  REDIS_URL: redis://redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ACCESS_JWT_TOKEN: ${LOADTEST_JWT_SECRET:?run via load-testing/scripts/stack.js}
  WEB_CONCURRENCY: "2"
  CLOUDWATCH_LOGS_DISABLED: "true"
  LOKI_URL: http://host.docker.internal:3100
  SCHEDULER_ENABLED: "false"
  GRPC_SKIP_HOSTNAME_VERIFICATION: "true"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "26379:6379"

  api-gateway:
    <<: *service
    image: hrms-loadtest/api-gateway:local
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args: [APP_DIR=api-gateway, PROJECT=api-gateway-service, PORT=9002]
    environment:
      <<: *env
      SERVICE_NAME: loadtest-api-gateway
      METRICS_PORT: "9003"
      # Per-request latency breakdown lines (docs/performance/latency-root-cause-analysis.md).
      REQUEST_TIMING_LOG: ${REQUEST_TIMING_LOG:-false}
      REQUEST_TIMING_OPS: ${REQUEST_TIMING_OPS:-false}
      AUTH_SERVICE_HOST: auth-service
      USER_SERVICE_HOST: user-service
      EMPLOYEE_SERVICE_HOST: employee-service
      ATTENDANCE_SERVICE_HOST: attendance-service
      LEAVE_SERVICE_HOST: leave-service
      RECRUITMENT_SERVICE_HOST: recruitment-service
      HRM_SERVICE_HOST: hrm-service
      SALARY_SERVICE_HOST: salary-service
      ANALYTICS_SERVICE_HOST: analytics-service
      NOTIFICATION_SERVICE_HOST: notification-service
      PERFORMANCE_REVIEW_SERVICE_HOST: performance-review-service
    ports: ["29002:9002", "29003:9003"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  auth-service:
    <<: *service
    image: hrms-loadtest/auth-service:local
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args: [APP_DIR=auth-service, PROJECT=auth-service, PORT=50051]
    environment:
      { <<: *env, SERVICE_NAME: loadtest-auth-service, METRICS_PORT: "9101" }
    ports: ["29101:9101"]

  user-service:
