# Runs on the dedicated monitoring EC2 host (MonitoringInstance in
# cloudformation/hrms-deploy.yaml), not on the app ASG instances. Prometheus
# discovers the app fleet via EC2 tags (monitoring/prometheus-prod.yml) rather
# than static targets, since the ASG scales 2-4 instances. Logs already ship
# to CloudWatch Logs from every service (packages/logger), so Grafana points
# at CloudWatch for logs instead of running Loki here.
#
# The grafana service's env_file (.env, gitignored) is written by
# /opt/hrms-monitoring/deploy.sh from Secrets Manager before this is brought
# up — never commit a real .env file here.
name: hrms-monitoring

services:
  prometheus:
    container_name: hrms-monitoring-prometheus
    # Pinned like grafana below — :latest on the alerting path itself risks
    # a surprise break with no warning, exactly where you least want one.
    image: prom/prometheus:v3.11.3
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager
    restart: unless-stopped

  # Receives firing alerts from Prometheus (alert-rules.yml) and pages via
  # Slack — see alertmanager.yml for why the webhooks themselves aren't in
  # this file. `/opt/hrms-monitoring/deploy.sh` (same script that writes
  # grafana's .env) writes both ./monitoring/secrets/slack_webhook_url and
  # ./monitoring/secrets/slack_webhook_url_critical from Secrets Manager
  # before this comes up (see AlertmanagerSlackWebhookSecretName /
  # AlertmanagerCriticalSlackWebhookSecretName in cloudformation/hrms-deploy.yaml);
  # both files are gitignored and never committed.
  alertmanager:
    container_name: hrms-monitoring-alertmanager
    image: prom/alertmanager:v0.33.1
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped

  grafana:
    container_name: hrms-monitoring-grafana
    # Pinned below the 12.x "unified storage" rearchitecture (a k8s-style
    # apiserver + search-index layer for dashboards/folders) - that needs far
    # more RAM/CPU than a t3.micro has and caused constant SQLITE_BUSY/context
    # deadline exceeded errors even with Prometheus itself perfectly healthy.
    # 10.4.x is the last line before that shift and fully supports the
    # Prometheus + CloudWatch datasources and panel types this dashboard uses.
    image: grafana/grafana:10.4.5
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    env_file:
      - .env
    volumes:
      - ./monitoring/grafana/provisioning-prod:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards-prod:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
