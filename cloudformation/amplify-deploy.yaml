AWSTemplateFormatVersion: "2010-09-09"
Description: >
  HRMS web client (apps/web) on AWS Amplify Hosting, connected to the GitHub
  repo, building via the turborepo monorepo path, with a custom domain.
  Amplify provisions and renews its own ACM certificate for the domain
  automatically (no ACM resource needed here), and auto-manages the Route53
  validation/target records since the hosted zone is in this same account.

Parameters:
  DomainName:
    Type: String
    Description: Root domain, e.g. praesto.in
  ApiSubdomain:
    Type: String
    Default: api
    Description: Must match the ApiSubdomain used in hrms-deploy.yaml, used only to build the default VITE_SERVER_URL value.
  RepositoryUrl:
    Type: String
    Default: https://github.com/ysam020/hrms
  GithubAccessToken:
    Type: String
    NoEcho: true
    Description: >
      GitHub personal access token (classic, "repo" scope) used once to create
      the webhook and read-only deploy key. Not stored by Amplify after use.
      Consider sourcing this from Secrets Manager via a dynamic reference in
      the parameter value rather than passing a literal token on the CLI.
  BranchName:
    Type: String
    Default: main
  VapidKey:
    Type: String
    NoEcho: true
    Description: >
      Firebase Cloud Messaging Web Push certificate public key (Firebase
      Console -> Project Settings -> Cloud Messaging -> Web Push certificates)
      — required for apps/web/src/core/config/firebase.tsx's getToken() call
      to register a push subscription at all. Without it, FCM token
      generation fails silently for every user.
  AttachCustomDomain:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Set to "false" to skip AWS::Amplify::Domain — use when DomainName is
      still claimed by an Amplify app in a different (e.g. abandoned/locked)
      AWS account, which fails domain association with "already associated
      with another Amplify app" regardless of DNS/nameserver ownership (this
      is a separate Amplify-internal claim, not a DNS check). The app is
      still fully live on its default *.amplifyapp.com domain either way;
      re-run this stack with "true" once the domain claim is released
      (AWS Support case against the old account, or after enough time post
      account closure).

Conditions:
  ShouldAttachCustomDomain: !Equals [!Ref AttachCustomDomain, "true"]

Resources:
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: hrms-web
      Repository: !Ref RepositoryUrl
      AccessToken: !Ref GithubAccessToken
      Platform: WEB
      EnvironmentVariables:
        - Name: VITE_SERVER_URL
          Value: !Sub "https://${ApiSubdomain}.${DomainName}"
        - Name: VITE_API_STRING
          Value: !Sub "https://${ApiSubdomain}.${DomainName}/api/v1"
        - Name: VITE_VAPID_KEY
          Value: !Ref VapidKey
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: apps/web
        - Name: AMPLIFY_DIFF_DEPLOY
          Value: "false"
      BuildSpec: |
        version: 1
        applications:
          - appRoot: apps/web
            frontend:
              phases:
                preBuild:
                  commands:
                    - cd "$(git rev-parse --show-toplevel)" && corepack enable && corepack prepare pnpm@8.15.6 --activate && pnpm install --frozen-lockfile
                build:
                  commands:
                    - cd "$(git rev-parse --show-toplevel)" && pnpm turbo build --filter=web
              artifacts:
                baseDirectory: dist
                files:
                  - '**/*'
              cache:
                paths:
                  - ../../node_modules/**/*
                  - ../../.pnpm-store/**/*
      # First match wins. One host: www redirects to the apex. The public
      # pages are prerendered to <page>.html at build time
      # (apps/web/scripts/prerender.mjs) and served at their clean URLs;
      # everything else without a static file falls back to the SPA shell.
      CustomRules:
        # Host form: Amplify keeps the path and query; a "/<*>" host
        # source never matches.
        - Source: !Sub "https://www.${DomainName}"
          Target: !Sub "https://${DomainName}"
          Status: "301"
        - Source: /privacy-policy
          Target: /privacy-policy.html
          Status: "200"
        - Source: /terms-of-use
          Target: /terms-of-use.html
          Status: "200"
        - Source: /refund-policy
          Target: /refund-policy.html
          Status: "200"
        - Source: </^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|xml|svg|webp|wasm|woff|woff2|ttf|map|json)$)([^.]+$)/>
          Target: /index.html
          Status: "200"
      CustomHeaders: |
        applications:
          - appRoot: apps/web
            customHeaders:
              - pattern: '**'
                headers:
                - key: 'Strict-Transport-Security'
                  value: 'max-age=31536000; includeSubDomains; preload'
                - key: 'X-Frame-Options'
                  value: 'DENY'
                - key: 'X-Content-Type-Options'
                  value: 'nosniff'
                - key: 'Referrer-Policy'
                  value: 'strict-origin-when-cross-origin'
                - key: 'Permissions-Policy'
                  value: 'camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()'
                - key: 'Content-Security-Policy'
                  value: >-
                    default-src 'self';
                    script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://cdn.razorpay.com https://www.gstatic.com https://storage.googleapis.com;
                    style-src 'self' 'unsafe-inline';
                    img-src 'self' data: blob: https://praesto-189923011190.s3.ap-south-1.amazonaws.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com;
                    font-src 'self' data:;
                    connect-src 'self' https://api.praesto.in wss://api.praesto.in https://cdn.jsdelivr.net https://raw.githubusercontent.com https://nominatim.openstreetmap.org https://praesto-189923011190.s3.ap-south-1.amazonaws.com https://api.razorpay.com https://lumberjack.razorpay.com https://*.googleapis.com https://*.firebaseio.com;
                    frame-src https://api.razorpay.com;
                    worker-src 'self' blob:;
                    manifest-src 'self';
                    object-src 'none';
                    base-uri 'self';
                    form-action 'self';
                    frame-ancestors 'none';
                    upgrade-insecure-requests

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref BranchName
      Stage: PRODUCTION
      EnableAutoBuild: true

  AmplifyDomain:
    Type: AWS::Amplify::Domain
    Condition: ShouldAttachCustomDomain
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      DomainName: !Ref DomainName
      SubDomainSettings:
        - Prefix: ""
          BranchName: !GetAtt AmplifyBranch.BranchName
        - Prefix: www
          BranchName: !GetAtt AmplifyBranch.BranchName

Outputs:
  AmplifyAppId:
    Value: !GetAtt AmplifyApp.AppId
  AmplifyDefaultDomain:
    Description: The *.amplifyapp.com domain, usable immediately while the custom domain validates
    Value: !Sub "https://${BranchName}.${AmplifyApp.DefaultDomain}"
  CustomDomainUrl:
    Condition: ShouldAttachCustomDomain
    Value: !Sub "https://${DomainName}"
  DomainAssociationStatus:
    Condition: ShouldAttachCustomDomain
    Description: Check `aws amplify get-domain-association` if this stays PENDING_VERIFICATION for long
    Value: !GetAtt AmplifyDomain.DomainStatus
