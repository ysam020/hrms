AWSTemplateFormatVersion: "2010-09-09"
Description: >
  HRMS backend deployment: EC2 launch template + ASG + ALB fronted by ACM/Route53,
  IAM roles for the instances and for GitHub Actions (build + deploy via SSM),
  an S3 bucket for the deploy-time docker-compose.prod.yml, and the SSM parameter
  that tells instances which image tag to run. Web (apps/web) is deployed to
  Amplify separately and is not part of this stack.

Parameters:
  DomainName:
    Type: String
    Description: Root domain, e.g. example.com
  ApiSubdomain:
    Type: String
    Default: api
    Description: Subdomain the API is served on (results in <ApiSubdomain>.<DomainName>)
  GrafanaSubdomain:
    Type: String
    Default: grafana
    Description: >
      Subdomain Grafana is served on (results in <GrafanaSubdomain>.<DomainName>).
      Publicly reachable over HTTPS via the existing ALB - Grafana's own login
      is the only access control (no IP restriction).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public Route53 hosted zone ID for DomainName
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two subnets, in different AZs, with a route to an internet gateway.
      Used for both the ALB and the ASG instances (instances get a public IP for
      ECR/S3/Secrets Manager/SSM egress — no NAT gateway required).
  InstanceType:
    Type: String
    Default: m7i-flex.large
  MonitoringInstanceType:
    Type: String
    Default: t3.micro
    Description: >
      Instance type for the dedicated Prometheus/Grafana host (see
      MonitoringInstance below). t3.micro is free-tier eligible and plenty for
      scraping ~12 targets every 15s.
  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: >
      ElastiCache node type for RedisReplicationGroup — the shared Redis
      every ASG instance connects to (see RedisReplicationGroup below).
      t4g.micro comfortably covers today's usage (rate limiting, cache,
      Socket.IO pub/sub, BullMQ queues combined) at a small multiple of what
      the single 256M docker Redis container this replaces was given. Each
      of the two nodes (primary + replica) is sized independently at this
      type.
  MinSize:
    Type: Number
    Default: 1
  MaxSize:
    Type: Number
    Default: 4
  DesiredCapacity:
    Type: Number
    Default: 2
  SecretsManagerSecretName:
    Type: String
    Description: >
      Name (not ARN) of the existing Secrets Manager secret holding runtime env
      vars. Must already exist — this stack only grants read access to it.
  AlertmanagerSlackWebhookSecretName:
    Type: String
    Description: >
      Name (not ARN) of the existing Secrets Manager secret whose value is the
      Slack incoming-webhook URL Alertmanager pages on. Must already exist —
      this stack only grants read access to it. MonitoringInstance's deploy.sh
      writes it to monitoring/secrets/slack_webhook_url at boot/redeploy (see
      monitoring/alertmanager.yml).
  AlertmanagerCriticalSlackWebhookSecretName:
    Type: String
    Default: ""
    Description: >
      Optional. Name of a distinct existing Secrets Manager secret holding a
      separate Slack webhook URL that critical-severity alerts should page
      instead of AlertmanagerSlackWebhookSecretName's — e.g. a webhook bound to
      a smaller, always-on-call channel. Leave blank to route critical alerts
      through the same webhook as everything else (deploy.sh then mirrors the
      default webhook into the critical secret's file, so alertmanager.yml's
      config never has to change either way).
  EcrRepositoryPrefix:
    Type: String
    Default: dev
  GithubOrg:
    Type: String
    Description: GitHub org/user that owns the repo, e.g. ysam020
  GithubRepo:
    Type: String
    Default: hrms
  CreateGithubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Set to "false" if a GitHub Actions OIDC provider (token.actions.githubusercontent.com)
      already exists in this AWS account — an account can only have one, and stack
      creation will fail if you try to create a duplicate.
  ExistingGithubOidcProviderArn:
    Type: String
    Default: ""
    Description: Required only when CreateGithubOidcProvider is "false".

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateGithubOidcProvider, "true"]

Resources:
  # ─────────────────────────── GitHub OIDC ───────────────────────────
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ─────────────────────────── S3: deploy artifacts ───────────────────────────
  DeployArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ─────────────────────────── S3: KYC/employee document uploads ───────────────────────────
  # Bucket name and key layout are hardcoded in apps/api-gateway/src/config/s3.ts
  # (S3_BUCKET) and consumed via presigned PUT/GET URLs — objects are private,
  # never public, since this holds KYC documents/photos.
  PraestoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: praesto-423437244709
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins:
              - !Sub "https://${DomainName}"
              - "https://*.amplifyapp.com"
              - "https://localhost"
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # ─────────────────────────── ECR repositories ───────────────────────────
  # One per backend service built by .github/workflows/build-and-push.yml.
  # `web` is not included — it's deployed to Amplify, not ECR/EC2.
  ApiGatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/api-gateway"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  AuthServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/auth-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  UserServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/user-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  EmployeeServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/employee-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  AttendanceServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/attendance-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  LeaveServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/leave-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  RecruitmentServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/recruitment-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  HrmServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/hrm-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  SalaryServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/salary-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  AnalyticsServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/analytics-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  NotificationServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/notification-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  PerformanceReviewServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/performance-review-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  SchedulerServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/scheduler-service"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  # ─────────────────────────── SSM: current image tag ───────────────────────────
  # Deployed to by .github/workflows/deploy-ec2.yml on every deploy — the Value
  # here is only the bootstrap default for the very first `create-stack`.
  ImageTagParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /hrms/prod/image-tag
      Type: String
      Value: latest

  # ─────────────────────────── Secrets: Grafana admin login ───────────────────────────
  # Generated once at stack creation; MonitoringInstance's deploy.sh reads this
  # at boot/redeploy and writes it to /opt/hrms-monitoring/.env (loaded by
  # docker-compose.monitoring-prod.yml's grafana service). Rotate via
  # `aws secretsmanager put-secret-value` + re-running deploy.sh over SSM.
  GrafanaAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /hrms/prod/grafana-admin-password
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true

  # ─────────────────────────── IAM: EC2 instance role ───────────────────────────
  HrmsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: HrmsInstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryPrefix}/*"
              - Sid: SecretsRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsManagerSecretName}-*"
              - Sid: ImageTagParamRead
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ImageTagParameter}"
              - Sid: DeployArtifactsRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DeployArtifactsBucket.Arn}/*"
              - Sid: PraestoObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${PraestoBucket.Arn}/*"

  HrmsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HrmsInstanceRole

  # ─────────────────────────── IAM: monitoring EC2 host ───────────────────────────
  MonitoringInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: MonitoringInstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Ec2ServiceDiscovery
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Sid: DeployArtifactsRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DeployArtifactsBucket.Arn}/*"
              - Sid: DeployArtifactsList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DeployArtifactsBucket.Arn
              - Sid: GrafanaPasswordRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GrafanaAdminSecret
              # The critical-webhook ARN resolves to a harmless, no-such-secret
              # pattern (".../secret:-*") when AlertmanagerCriticalSlackWebhookSecretName
              # is left blank — granting read on it is a no-op in that case.
              - Sid: AlertmanagerSlackWebhookRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AlertmanagerSlackWebhookSecretName}-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AlertmanagerCriticalSlackWebhookSecretName}-*"
              # Backs the Grafana CloudWatch datasource (monitoring/grafana/provisioning-prod)
              # used for logs, since every service already ships logs to
              # CloudWatch (packages/logger) rather than to Loki in prod.
              - Sid: CloudWatchLogsRead
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:GetLogGroupFields
                  - logs:StartQuery
                  - logs:StopQuery
                  - logs:GetQueryResults
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/hrms/*"
              - Sid: CloudWatchMetricsRead
                Effect: Allow
                Action:
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricData
                  - cloudwatch:DescribeAlarmsForMetric
                Resource: "*"

  MonitoringInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MonitoringInstanceRole

  # ─────────────────────────── IAM: GitHub Actions roles ───────────────────────────
  HrmsBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                !If [
                  ShouldCreateOidcProvider,
                  !Ref GithubOidcProvider,
                  !Ref ExistingGithubOidcProviderArn,
                ]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GithubOrg}/${GithubRepo}:*"
      Policies:
        - PolicyName: HrmsBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeRepositories
                  - ecr:CreateRepository
                  - ecr:PutImageScanningConfiguration
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryPrefix}/*"

  HrmsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                !If [
                  ShouldCreateOidcProvider,
                  !Ref GithubOidcProvider,
                  !Ref ExistingGithubOidcProviderArn,
                ]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GithubOrg}/${GithubRepo}:*"
      Policies:
        - PolicyName: HrmsDeployPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishDeployConfig
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${DeployArtifactsBucket.Arn}/*"
              - Sid: PublishDeployConfigList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DeployArtifactsBucket.Arn
              - Sid: SetImageTag
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ImageTagParameter}"
              - Sid: DescribeAsg
                Effect: Allow
                Action: autoscaling:DescribeAutoScalingGroups
                Resource: "*"
              - Sid: FindMonitoringInstance
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Sid: RunDeployScript
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

  # ─────────────────────────── Networking ───────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HRMS ALB - public HTTP/HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HRMS EC2 instances - api-gateway reachable only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 19002
          ToPort: 19002
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        # api-gateway metrics (published as host port 19003, see docker-compose.prod.yml)
        - IpProtocol: tcp
          FromPort: 19003
          ToPort: 19003
          SourceSecurityGroupId: !Ref MonitoringSecurityGroup
        # auth-service..scheduler-service metrics (9101-9111), scraped by
        # monitoring/prometheus-prod.yml via EC2 service discovery
        - IpProtocol: tcp
          FromPort: 9101
          ToPort: 9111
          SourceSecurityGroupId: !Ref MonitoringSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  MonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "HRMS monitoring host (Prometheus + Grafana) - Grafana reachable from the ALB only, Prometheus via SSM port-forwarding only."
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ─────────────────────────── ElastiCache ───────────────────────────
  # One Redis every ASG instance shares, replacing each instance's own local
  # docker-compose.prod.yml `redis` container. That per-instance setup meant
  # cached reads, Redis-backed rate-limit counters, the Socket.IO Redis
  # adapter (cross-instance WebSocket broadcast), and BullMQ queues were all
  # only consistent *within* one instance — invisible with DesiredCapacity=1,
  # but this stack's own default is 2. TargetGroup's ALB stickiness
  # (see its own comment) was a partial workaround for one symptom of this
  # (multi-step flows like WebAuthn breaking if the ALB round-robined
  # requests) — it didn't address the others, and doesn't need to be removed
  # now that the underlying cause is fixed, since pinning a session to one
  # instance for its cookie's lifetime is still reasonable on its own merits.
  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HRMS shared Redis - reachable only from the app instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnets RedisReplicationGroup may be placed in
      SubnetIds: !Ref PublicSubnetIds

  # Was a single-node AWS::ElastiCache::CacheCluster (NumCacheNodes: 1) —
  # one shared point of failure for cache, rate limiting, the Socket.IO
  # pub/sub adapter, and BullMQ queues all at once, with no failover if that
  # one node had a bad restart/AZ event. AWS::ElastiCache::ReplicationGroup
  # with AutomaticFailoverEnabled promotes the replica automatically (Multi-AZ)
  # if the primary becomes unreachable, instead of every one of those
  # subsystems going down together until someone notices and replaces the node.
  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: HRMS shared Redis - cache, rate limiting, Socket.IO pub/sub, BullMQ queues
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref RedisNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup

  # ─────────────────────────── ACM ───────────────────────────
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "${ApiSubdomain}.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "${ApiSubdomain}.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  # Separate cert (not a SAN on ApiCertificate) so issuing/renewing it can
  # never touch the already-validated production api.praesto.cloud cert -
  # attached to HttpsListener via SNI (GrafanaListenerCertificate below).
  GrafanaCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "${GrafanaSubdomain}.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "${GrafanaSubdomain}.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  # ─────────────────────────── ALB ───────────────────────────
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref PublicSubnetIds

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTPS
      Port: 19002
      TargetType: instance
      HealthCheckProtocol: HTTPS
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      # Originally worked around each ASG instance running its own local
      # Redis (pinning a session to one instance so multi-step flows like
      # the WebAuthn login challenge, which stash state server-side, didn't
      # break when the ALB round-robined the two requests to different
      # instances). Now that RedisReplicationGroup is shared across every
      # instance that workaround isn't strictly load-bearing anymore, but stickiness
      # is still reasonable to keep on its own merits (steadier per-instance
      # connection pools, marginally better cache locality), so it stays.
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: "3600"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ApiCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # SNI: lets HttpsListener serve grafana.praesto.cloud on the same ALB/port
  # as api.praesto.cloud, each with its own cert, routed by ListenerRule below.
  GrafanaListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Properties:
      ListenerArn: !Ref HttpsListener
      Certificates:
        - CertificateArn: !Ref GrafanaCertificate

  # Grafana (docker-compose.monitoring-prod.yml) serves plain HTTP on :3000 -
  # TLS is terminated at the ALB, matching the HttpListener/HttpsListener
  # split above. Traffic ALB->instance stays inside the VPC.
  GrafanaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      Targets:
        - Id: !Ref MonitoringInstance
          Port: 3000
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  GrafanaListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub "${GrafanaSubdomain}.${DomainName}"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrafanaTargetGroup

  # ─────────────────────────── Launch template / ASG ───────────────────────────
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt HrmsInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: hrms-prod
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail

            dnf install -y docker
            systemctl enable --now docker

            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

            mkdir -p /opt/hrms

            cat > /opt/hrms/deploy.sh <<'DEPLOY_EOF'
            #!/bin/bash
            set -euo pipefail

            AWS_REGION="${AWS::Region}"
            ECR_REGISTRY="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
            ECR_REPOSITORY_PREFIX="${EcrRepositoryPrefix}"

            TAG_NAME=$(aws ssm get-parameter --name /hrms/prod/image-tag --region "$AWS_REGION" --query 'Parameter.Value' --output text)
            export ECR_REGISTRY ECR_REPOSITORY_PREFIX TAG_NAME

            aws s3 cp "s3://${DeployArtifactsBucket}/docker-compose.prod.yml" /opt/hrms/docker-compose.prod.yml --region "$AWS_REGION"

            mkdir -p /opt/hrms/packages/certificates
            if [ ! -f /opt/hrms/packages/certificates/cert.pem ]; then
              openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
                -keyout /opt/hrms/packages/certificates/key.pem \
                -out /opt/hrms/packages/certificates/cert.pem \
                -subj "/CN=localhost" \
                -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
              # mTLS: gRPC clients (api-gateway) must present a distinct
              # identity from the servers' own cert.pem/key.pem - grpc-js
              # resets the connection if client and server present identical
              # certs (see the comment in apps/api-gateway/src/grpc/clients.ts).
              # Mirrors scripts/generate-certs.mjs's self-signed fallback:
              # two independent self-signed leaf certs, neither a real CA,
              # bundled together into rootCA.pem as mutually-trusted roots.
              openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
                -keyout /opt/hrms/packages/certificates/client-key.pem \
                -out /opt/hrms/packages/certificates/client-cert.pem \
                -subj "/CN=grpc-internal-client"
              cat /opt/hrms/packages/certificates/cert.pem /opt/hrms/packages/certificates/client-cert.pem \
                > /opt/hrms/packages/certificates/rootCA.pem
              chmod 644 /opt/hrms/packages/certificates/*.pem
            fi
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd /opt/hrms
            docker compose -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -af
            DEPLOY_EOF
            chmod +x /opt/hrms/deploy.sh

            cat > /etc/systemd/system/hrms.service <<'UNIT_EOF'
            [Unit]
            Description=HRMS docker compose stack
            After=docker.service network-online.target
            Requires=docker.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/opt/hrms/deploy.sh

            [Install]
            WantedBy=multi-user.target
            UNIT_EOF

            systemctl daemon-reload
            systemctl enable --now hrms.service

  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: HttpsListener
    # Separate concern from the batched/health-checked/auto-rollback rollout
    # in .github/workflows/deploy-ec2.yml: that workflow deploys new app image
    # tags to already-running instances in place (via SSM + docker compose)
    # and never touches this template. This UpdatePolicy instead governs the
    # rarer case of a stack update that changes the LaunchTemplate itself
    # (AMI, instance type, UserData) — without it, CloudFormation leaves
    # existing instances on the old launch config indefinitely, requiring a
    # manual, unstaged instance-by-instance replacement. Reuses the same
    # TargetGroup ELB health check the ASG already has (HealthCheckType: ELB,
    # HealthCheckGracePeriod: 180 below) to replace one instance at a time and
    # confirm it's healthy before moving to the next — PauseTime matches that
    # same 180s grace period.
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT3M
        WaitOnResourceSignals: false
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: !Ref PublicSubnetIds
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      Tags:
        - Key: Name
          Value: hrms-prod
          PropagateAtLaunch: true

  # ─────────────────────────── Monitoring host ───────────────────────────
  # Single dedicated instance (not in the ASG) running Prometheus + Grafana.
  # It scrapes every hrms-prod ASG instance via EC2 service discovery (see
  # monitoring/prometheus-prod.yml), so it has to live outside the fleet it's
  # watching. Grafana (:3000) is public at GrafanaUrl, via the ALB
  # (GrafanaListenerRule/GrafanaTargetGroup) - login is the only gate, no IP
  # restriction. Prometheus (:9090) has no public route; reach it via SSM
  # port-forwarding:
  #   aws ssm start-session --target <instance-id> \
  #     --document-name AWS-StartPortForwardingSession \
  #     --parameters '{"portNumber":["9090"],"localPortNumber":["9090"]}'
  # Config updates (prometheus-prod.yml, dashboards, etc.) are picked up by
  # re-running /opt/hrms-monitoring/deploy.sh over SSM after syncing to S3 —
  # see .github/workflows/deploy-ec2.yml — not by replacing this instance.
  MonitoringInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref MonitoringInstanceType
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      SecurityGroupIds:
        - !Ref MonitoringSecurityGroup
      IamInstanceProfile: !Ref MonitoringInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: hrms-monitoring
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          dnf install -y docker
          systemctl enable --now docker

          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          mkdir -p /opt/hrms-monitoring

          cat > /opt/hrms-monitoring/deploy.sh <<'DEPLOY_EOF'
          #!/bin/bash
          set -euo pipefail

          AWS_REGION="${AWS::Region}"

          aws s3 cp "s3://${DeployArtifactsBucket}/docker-compose.monitoring-prod.yml" \
            /opt/hrms-monitoring/docker-compose.monitoring-prod.yml --region "$AWS_REGION"
          aws s3 sync "s3://${DeployArtifactsBucket}/monitoring/" /opt/hrms-monitoring/monitoring/ \
            --region "$AWS_REGION" --delete

          GF_ADMIN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${GrafanaAdminSecret}" --region "$AWS_REGION" \
            --query 'SecretString' --output text)
          printf 'GF_SECURITY_ADMIN_PASSWORD=%s\n' "$GF_ADMIN_SECRET" > /opt/hrms-monitoring/.env

          # Written here (after the s3 sync --delete above, not before) since
          # --delete removes local files under monitoring/ that aren't present
          # in S3 — writing these first would just have them wiped on every
          # redeploy. slack_webhook_url_critical always exists so alertmanager.yml
          # never fails to load a receiver: it holds its own dedicated webhook
          # when AlertmanagerCriticalSlackWebhookSecretName is set, otherwise it's
          # a mirror of the default webhook (same channel/webhook, no config change
          # needed either way).
          mkdir -p /opt/hrms-monitoring/monitoring/secrets
          aws secretsmanager get-secret-value \
            --secret-id "${AlertmanagerSlackWebhookSecretName}" --region "$AWS_REGION" \
            --query 'SecretString' --output text \
            > /opt/hrms-monitoring/monitoring/secrets/slack_webhook_url

          CRITICAL_SECRET_NAME="${AlertmanagerCriticalSlackWebhookSecretName}"
          if [ -n "$CRITICAL_SECRET_NAME" ]; then
            aws secretsmanager get-secret-value \
              --secret-id "$CRITICAL_SECRET_NAME" --region "$AWS_REGION" \
              --query 'SecretString' --output text \
              > /opt/hrms-monitoring/monitoring/secrets/slack_webhook_url_critical
          else
            cp /opt/hrms-monitoring/monitoring/secrets/slack_webhook_url \
              /opt/hrms-monitoring/monitoring/secrets/slack_webhook_url_critical
          fi
          chmod 600 /opt/hrms-monitoring/monitoring/secrets/slack_webhook_url \
            /opt/hrms-monitoring/monitoring/secrets/slack_webhook_url_critical

          cd /opt/hrms-monitoring
          docker compose -f docker-compose.monitoring-prod.yml pull --quiet
          docker compose -f docker-compose.monitoring-prod.yml up -d --remove-orphans

          docker image prune -af
          DEPLOY_EOF
          chmod +x /opt/hrms-monitoring/deploy.sh

          cat > /etc/systemd/system/hrms-monitoring.service <<'UNIT_EOF'
          [Unit]
          Description=HRMS monitoring (Prometheus + Grafana) docker compose stack
          After=docker.service network-online.target
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/opt/hrms-monitoring/deploy.sh

          [Install]
          WantedBy=multi-user.target
          UNIT_EOF

          systemctl daemon-reload
          systemctl enable --now hrms-monitoring.service

  # MonitoringInstance is a known single point of failure (see its comment
  # above) — a real fix is either a warm-standby instance behind DNS
  # failover or migrating to a managed/clustered observability backend
  # (e.g. Thanos/Mimir, or Grafana Cloud), both real architecture decisions
  # with meaningful cost and operational tradeoffs that this stack
  # deliberately doesn't make unilaterally. What follows are two safe,
  # additive mitigations that reduce (not eliminate) the blast radius of
  # that SPOF without changing the architecture:
  #  1. auto-recovery on the underlying hardware failing its status check
  #     (turns "someone notices Grafana is down and manually intervenes"
  #     into an automatic few-minutes self-heal, for that failure class only
  #     — it can't help with an AZ-wide outage, since the instance and its
  #     EBS volume stay pinned to their current AZ)
  #  2. daily EBS snapshots of its root volume, so a lost/corrupted
  #     instance doesn't also mean losing 90 days of Prometheus history and
  #     every Grafana dashboard — there was previously no backup path for
  #     this data at all.
  MonitoringInstanceRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Auto-recovers MonitoringInstance (stop/start on the same host) after
        5 consecutive minutes of failing its EC2 system status check.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - Name: InstanceId
          Value: !Ref MonitoringInstance
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Sub "arn:aws:automate:${AWS::Region}:ec2:recover"

  MonitoringBackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: dlm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  MonitoringBackupPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily EBS snapshots of the monitoring host Prometheus TSDB and Grafana state - see comment above MonitoringInstanceRecoveryAlarm
      State: ENABLED
      ExecutionRoleArn: !GetAtt MonitoringBackupRole.Arn
      PolicyDetails:
        ResourceTypes:
          - INSTANCE
        TargetTags:
          - Key: Name
            Value: hrms-monitoring
        Schedules:
          - Name: DailySnapshot
            TagsToAdd:
              - Key: SnapshotType
                Value: hrms-monitoring-daily
            CreateRule:
              CronExpression: "cron(0 3 * * ? *)"
            RetainRule:
              Count: 14
            CopyTags: true

  # ─────────────────────────── DNS ───────────────────────────
  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${ApiSubdomain}.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  GrafanaDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${GrafanaSubdomain}.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  ApiUrl:
    Value: !Sub "https://${ApiSubdomain}.${DomainName}"
  GrafanaUrl:
    Description: Login with admin / the password in GrafanaAdminSecret (/hrms/prod/grafana-admin-password)
    Value: !Sub "https://${GrafanaSubdomain}.${DomainName}"
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AsgName:
    Value: !Ref Asg
  RedisEndpoint:
    Description: >
      Primary (writer) endpoint. Set REDIS_URL in the SecretsManagerSecretName
      secret to redis://<this>:6379 after this stack finishes creating/updating
      — CloudFormation can't populate another secret's value from a resource
      this same stack just created. ioredis/BullMQ/Socket.IO adapter clients
      all connect to this single address; AutomaticFailoverEnabled means it
      keeps resolving to whichever node is currently primary if the original
      primary fails over, so nothing downstream needs to change on failover.
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
  MonitoringInstanceId:
    Description: >
      Target for SSM port-forwarding to reach Prometheus (:9090) directly -
      see the comment on MonitoringInstance for the aws ssm command. Grafana
      itself is public at GrafanaUrl.
    Value: !Ref MonitoringInstance
  DeployArtifactsBucketName:
    Value: !Ref DeployArtifactsBucket
  HrmsBuildRoleArn:
    Description: Set as the AWS_ROLE_TO_ASSUME repo variable for build-and-push.yml
    Value: !GetAtt HrmsBuildRole.Arn
  HrmsDeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_TO_ASSUME repo variable for deploy-ec2.yml
    Value: !GetAtt HrmsDeployRole.Arn
  HrmsInstanceRoleArn:
    Value: !GetAtt HrmsInstanceRole.Arn
