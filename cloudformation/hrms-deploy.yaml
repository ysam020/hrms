  # ─────────────────────────── SSM: current image tag ───────────────────────────
  # Deployed to by .github/workflows/deploy-ec2.yml on every deploy — the Value
  # here is only the bootstrap default for the very first `create-stack`.
  ImageTagParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /hrms/prod/image-tag
      Type: String
      Value: latest

  # ─────────────────────────── IAM: EC2 instance role ───────────────────────────
  HrmsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: HrmsInstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryPrefix}/*"
              - Sid: SecretsRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsManagerSecretName}-*"
              - Sid: ImageTagParamRead
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ImageTagParameter}"
              - Sid: DeployArtifactsRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DeployArtifactsBucket.Arn}/*"
              - Sid: PraestoObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${PraestoBucket.Arn}/*"
              # Self-associates ElasticIp at boot (see LaunchTemplate UserData)
              # since there's no ALB anymore to give api.praesto.in a stable
              # address — the instance has to carry its own. AssociateAddress
              # can't be scoped to a specific EIP allocation via resource ARN
              # (EC2 address actions don't support resource-level permissions),
              # so this is "*"; DescribeAddresses never supports resource ARNs
              # at all.
              - Sid: SelfAssociateElasticIp
                Effect: Allow
                Action:
                  - ec2:AssociateAddress
                  - ec2:DescribeAddresses
                Resource: "*"

  HrmsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HrmsInstanceRole

  # ─────────────────────────── IAM: GitHub Actions roles ───────────────────────────
  HrmsBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                !If [
                  ShouldCreateOidcProvider,
                  !Ref GithubOidcProvider,
                  !Ref ExistingGithubOidcProviderArn,
                ]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GithubOrg}/${GithubRepo}:*"
      Policies:
        - PolicyName: HrmsBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeRepositories
                  - ecr:CreateRepository
                  - ecr:PutImageScanningConfiguration
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryPrefix}/*"

  HrmsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                !If [
                  ShouldCreateOidcProvider,
                  !Ref GithubOidcProvider,
                  !Ref ExistingGithubOidcProviderArn,
                ]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GithubOrg}/${GithubRepo}:*"
      Policies:
        - PolicyName: HrmsDeployPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishDeployConfig
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${DeployArtifactsBucket.Arn}/*"
              - Sid: PublishDeployConfigList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DeployArtifactsBucket.Arn
              - Sid: SetImageTag
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ImageTagParameter}"
              - Sid: DescribeAsg
                Effect: Allow
                Action: autoscaling:DescribeAutoScalingGroups
                Resource: "*"
              - Sid: RunDeployScript
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

  # ─────────────────────────── Networking ───────────────────────────
  # No ALB in front anymore (see ElasticIp below) — the instance is
  # reachable directly on 80/443, same public exposure the ALB used to have,
  # just one hop closer. 80 stays open (not just a redirect target) because
  # Caddy needs it for the Let's Encrypt HTTP-01 challenge, in addition to
  # redirecting plain HTTP to HTTPS itself (see the Caddyfile in
  # LaunchTemplate UserData).
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HRMS EC2 instance - public HTTP/HTTPS direct (no ALB)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ─────────────────────────── Networking: static public address ───────────────────────────
  # Without an ALB, something has to give api.praesto.in a stable address
  # across instance replacement (Spot interruption, AMI/launch-template
  # updates). A plain auto-assigned public IP changes every time the
  # instance is replaced; this EIP doesn't move, so DNS (ApiDnsRecord below)
  # only ever has to be set once. LaunchTemplate UserData associates it to
  # whichever instance boots, using the SelfAssociateElasticIp permission on
  # HrmsInstanceRole.
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # ─────────────────────────── Launch template / ASG ───────────────────────────
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt HrmsInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: hrms-prod
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail

            # No ALB anymore — this instance needs its own stable public
            # address for api.praesto.in to keep pointing at (see
            # ElasticIp's comment). --allow-reassociation because the EIP is
            # still attached to whatever instance this one is replacing.
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            aws ec2 associate-address --instance-id "$INSTANCE_ID" --allocation-id ${ElasticIp.AllocationId} --region ${AWS::Region} --allow-reassociation

            dnf install -y docker
            systemctl enable --now docker

            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

            mkdir -p /opt/hrms

            # Public-facing TLS termination (was the ALB's job) — Caddy gets
            # a real, trusted cert from Let's Encrypt automatically (HTTP-01,
            # needs port 80 open, see InstanceSecurityGroup) and keeps it
            # renewed. Re-encrypts to api-gateway's own self-signed HTTPS
            # (packages/certificates/cert.pem) same as the ALB's HTTPS target
            # group used to — tls_insecure_skip_verify because that cert
            # isn't from a public CA and was never meant to be verified
            # against one, only to encrypt the hop inside the VPC.
            cat > /opt/hrms/Caddyfile <<'CADDY_EOF'
            ${ApiSubdomain}.${DomainName} {
            	reverse_proxy https://api-gateway:9002 {
            		transport http {
            			tls_insecure_skip_verify
            		}
            	}
            }
            CADDY_EOF

            cat > /opt/hrms/deploy.sh <<'DEPLOY_EOF'
            #!/bin/bash
            set -euo pipefail

            AWS_REGION="${AWS::Region}"
            ECR_REGISTRY="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
            ECR_REPOSITORY_PREFIX="${EcrRepositoryPrefix}"

            TAG_NAME=$(aws ssm get-parameter --name /hrms/prod/image-tag --region "$AWS_REGION" --query 'Parameter.Value' --output text)
            export ECR_REGISTRY ECR_REPOSITORY_PREFIX TAG_NAME

            aws s3 cp "s3://${DeployArtifactsBucket}/docker-compose.prod.yml" /opt/hrms/docker-compose.prod.yml --region "$AWS_REGION"

            mkdir -p /opt/hrms/packages/certificates
            if [ ! -f /opt/hrms/packages/certificates/cert.pem ]; then
              openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
                -keyout /opt/hrms/packages/certificates/key.pem \
                -out /opt/hrms/packages/certificates/cert.pem \
                -subj "/CN=localhost" \
                -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
              # mTLS: gRPC clients (api-gateway) must present a distinct
              # identity from the servers' own cert.pem/key.pem - grpc-js
              # resets the connection if client and server present identical
              # certs (see the comment in apps/api-gateway/src/grpc/clients.ts).
              # Mirrors scripts/generate-certs.mjs's self-signed fallback:
              # two independent self-signed leaf certs, neither a real CA,
              # bundled together into rootCA.pem as mutually-trusted roots.
              openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
                -keyout /opt/hrms/packages/certificates/client-key.pem \
                -out /opt/hrms/packages/certificates/client-cert.pem \
                -subj "/CN=grpc-internal-client"
              cat /opt/hrms/packages/certificates/cert.pem /opt/hrms/packages/certificates/client-cert.pem \
                > /opt/hrms/packages/certificates/rootCA.pem
              chmod 644 /opt/hrms/packages/certificates/*.pem
            fi
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd /opt/hrms
            docker compose -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -af
            DEPLOY_EOF
            chmod +x /opt/hrms/deploy.sh

            cat > /etc/systemd/system/hrms.service <<'UNIT_EOF'
            [Unit]
            Description=HRMS docker compose stack
            After=docker.service network-online.target
            Requires=docker.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/opt/hrms/deploy.sh

            [Install]
            WantedBy=multi-user.target
            UNIT_EOF

            systemctl daemon-reload
            systemctl enable --now hrms.service

  Asg:
  Type: AWS::AutoScaling::AutoScalingGroup

  UpdatePolicy:
    AutoScalingRollingUpdate:
      MinInstancesInService: 0
      MaxBatchSize: 1
      PauseTime: PT3M
      WaitOnResourceSignals: false

  Properties:
    LaunchTemplate:
      LaunchTemplateSpecification:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

    MinSize: !Ref MinSize
    MaxSize: !Ref MaxSize
    DesiredCapacity: !Ref DesiredCapacity
    VPCZoneIdentifier: !Ref PublicSubnetIds

    HealthCheckType: EC2
    HealthCheckGracePeriod: 180

    Tags:
      - Key: Name
        Value: hrms-prod
        PropagateAtLaunch: true
  # ─────────────────────────── DNS ───────────────────────────
  # Plain A record to the EIP (not an ALB alias anymore) — this only ever
  # needs to be set once, since ElasticIp's address doesn't change across
  # instance replacement.
  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${ApiSubdomain}.${DomainName}"
      Type: A
      TTL: "60"
      ResourceRecords:
        - !Ref ElasticIp

Outputs:
  ApiUrl:
    Value: !Sub "https://${ApiSubdomain}.${DomainName}"
  ElasticIp:
    Description: Stable public IP the instance self-associates at boot (see LaunchTemplate UserData)
    Value: !Ref ElasticIp
  AsgName:
    Value: !Ref Asg
  DeployArtifactsBucketName:
    Value: !Ref DeployArtifactsBucket
  HrmsBuildRoleArn:
    Description: Set as the AWS_ROLE_TO_ASSUME repo variable for build-and-push.yml
    Value: !GetAtt HrmsBuildRole.Arn
  HrmsDeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_TO_ASSUME repo variable for deploy-ec2.yml
    Value: !GetAtt HrmsDeployRole.Arn
  HrmsInstanceRoleArn:
    Value: !GetAtt HrmsInstanceRole.Arn
