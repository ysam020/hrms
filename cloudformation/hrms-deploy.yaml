AWSTemplateFormatVersion: "2010-09-09"
Description: >
  HRMS backend deployment: EC2 launch template + ASG behind a stable Elastic
  IP, with Caddy on the instance terminating public HTTPS via Let's Encrypt
  (no ALB), IAM roles for the instances and for GitHub Actions (build +
  deploy via SSM), an S3 bucket for the deploy-time docker-compose.prod.yml,
  and the SSM parameter that tells instances which image tag to run. Web
  (apps/web) is deployed to Amplify separately and is not part of this stack.

Parameters:
  DomainName:
    Type: String
    Description: Root domain, e.g. example.com
  ApiSubdomain:
    Type: String
    Default: api
    Description: Subdomain the API is served on (results in <ApiSubdomain>.<DomainName>)
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public Route53 hosted zone ID for DomainName
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two subnets, in different AZs, with a route to an internet gateway.
      Used for both the ALB and the ASG instances (instances get a public IP for
      ECR/S3/Secrets Manager/SSM egress — no NAT gateway required).
  InstanceType:
    Type: String
    Default: m7i-flex.large
  MinSize:
    Type: Number
    Default: 1
  MaxSize:
    Type: Number
    Default: 1
    Description: >
      Kept at 1 for this demo deployment — no real traffic to load-balance
      across multiple instances. Raise this (and DesiredCapacity) if that
      changes.
  DesiredCapacity:
    Type: Number
    Default: 1
  SecretsManagerSecretName:
    Type: String
    Description: >
      Name (not ARN) of the existing Secrets Manager secret holding runtime env
      vars. Must already exist — this stack only grants read access to it.
  EcrRepositoryPrefix:
    Type: String
    Default: dev
  GithubOrg:
    Type: String
    Description: GitHub org/user that owns the repo, e.g. ysam020
  GithubRepo:
    Type: String
    Default: hrms
  CreateGithubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Set to "false" if a GitHub Actions OIDC provider (token.actions.githubusercontent.com)
      already exists in this AWS account — an account can only have one, and stack
      creation will fail if you try to create a duplicate.
  ExistingGithubOidcProviderArn:
    Type: String
    Default: ""
    Description: Required only when CreateGithubOidcProvider is "false".

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateGithubOidcProvider, "true"]

Resources:
  # ─────────────────────────── GitHub OIDC ───────────────────────────
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ─────────────────────────── S3: deploy artifacts ───────────────────────────
  DeployArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      # Every deploy overwrites docker-compose.prod.yml etc. in place -
      # versioning keeps every prior copy forever with nothing to expire them.
      # 30 days is far more history than the rollback flow ever needs (it
      # only ever re-reads the current object, not an old version).
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # ─────────────────────────── S3: KYC/employee document uploads ───────────────────────────
  # Bucket name and key layout are hardcoded in apps/api-gateway/src/config/s3.ts
  # (S3_BUCKET) and consumed via presigned PUT/GET URLs — objects are private,
  # never public, since this holds KYC documents/photos.
  PraestoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "praesto-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins:
              - !Sub "https://${DomainName}"
              - "https://*.amplifyapp.com"
              - "https://localhost"
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # ─────────────────────────── ECR repositories ───────────────────────────
  # One per backend service built by .github/workflows/build-and-push.yml.
  # `web` is not included — it's deployed to Amplify, not ECR/EC2.
  ApiGatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EcrRepositoryPrefix}/api-gateway"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Every merge to main pushes a new SHA-tagged image (see
      # .github/workflows/build-and-push.yml) and nothing ever expired the
      # old ones — unbounded storage growth. Keeps the last 10 tagged images
      # (deploy-ec2.yml's rollback only ever needs the previous tag, so this
      # is generous headroom) and expires untagged images after 1 day.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last 10 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPatternList": ["*"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  AuthServiceRepository:
