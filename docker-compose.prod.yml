  scheduler-service:
    container_name: scheduler-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/scheduler-service:${TAG_NAME:-latest}
    env_file: .env

  web:
    container_name: web
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/web:${TAG_NAME:-latest}
