                },
                "queryMode": "Logs",
                "region": "default",
                "id": "",
                "expression": "fields @timestamp, @log, level, message, @message | filter requestId = \"$${requestId}\" | sort @timestamp asc | limit 500",
                "logGroupNames": [
                  "$$service"
                ]
              }
            ],
            "options": {
              "showTime": true,
              "wrapLogMessage": true,
              "sortOrder": "Ascending",
              "enableLogDetails": true
            },
            "id": 9,
            "gridPos": {
              "x": 0,
              "y": 35,
              "w": 24,
              "h": 10
            },
            "datasource": {
              "type": "cloudwatch",
              "uid": "cloudwatch"
            }
          }
        ]
      }

  grafana-dashboard-hrms:
    content: |
      {
        "id": null,
        "uid": "hrms-nodejs",
        "title": "HRMS Node.js Application",
        "tags": [
          "hrms",
          "nodejs"
        ],
        "timezone": "browser",
        "schemaVersion": 38,
        "version": 2,
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "service",
              "type": "query",
              "label": "Service",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "query": "label_values(process_resident_memory_bytes, service)",
              "refresh": 2,
              "includeAll": true,
              "allValue": ".+",
              "multi": false,
              "current": {}
            },
            {
              "name": "interval",
              "type": "interval",
              "label": "Interval",
              "options": [
                {
                  "selected": false,
                  "text": "1m",
                  "value": "1m"
                },
                {
                  "selected": true,
                  "text": "5m",
                  "value": "5m"
                },
                {
                  "selected": false,
                  "text": "10m",
                  "value": "10m"
                },
                {
                  "selected": false,
                  "text": "30m",
                  "value": "30m"
                }
              ],
              "current": {
                "text": "5m",
                "value": "5m"
              },
              "query": "1m,5m,10m,30m",
              "auto": false
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "title": "HTTP Request Rate",
            "type": "stat",
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "value": null,
                      "color": "green"
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "orientation": "auto",
              "textMode": "auto",
              "colorMode": "background"
            },
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{service=~\"$$service\"}[$$interval]))",
                "legendFormat": "req/s",
                "refId": "A"
              }
            ]
          },
          {
            "id": 2,
            "title": "Error Rate",
            "type": "stat",
            "gridPos": {
              "x": 6,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "value": null,
                      "color": "green"
                    },
                    {
                      "value": 1,
                      "color": "yellow"
                    },
                    {
                      "value": 5,
                      "color": "red"
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "colorMode": "background"
            },
            "targets": [
              {
                "expr": "100 * sum(rate(http_requests_total{service=~\"$$service\",status=~\"5..\"}[$$interval])) / sum(rate(http_requests_total{service=~\"$$service\"}[$$interval]))",
                "legendFormat": "error %",
                "refId": "A"
              }
            ]
          },
          {
            "id": 3,
            "title": "p95 HTTP Latency",
            "type": "stat",
            "gridPos": {
              "x": 12,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ms",
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "value": null,
                      "color": "green"
                    },
                    {
                      "value": 200,
                      "color": "yellow"
                    },
                    {
                      "value": 1000,
                      "color": "red"
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "colorMode": "background"
            },
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_ms_bucket{service=~\"$$service\"}[$$interval])))",
                "legendFormat": "p95",
                "refId": "A"
              }
            ]
          },
          {
            "id": 4,
            "title": "Heap Used (avg across services)",
