# Deployed on EC2 via SSM (see .github/workflows/deploy-ec2.yml). Requires
# ECR_REGISTRY, ECR_REPOSITORY_PREFIX and TAG_NAME to be exported before
# `docker compose -f docker-compose.prod.yml pull/up` — deploy.sh (embedded in
# the launch template UserData, see cloudformation/hrms-deploy.yaml) sets these.
# `web` is excluded from the default `up -d` via its profile — it's hosted on
# Amplify, not on this stack.
name: hrms-prod

# Docker's default json-file driver never rotates, so container logs grew
# until they filled the instance's root volume (SSM run-command and deploys
# then fail with "No space left on device"). Caps each container at ~30 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-service: &backend-service
  logging: *default-logging
  volumes:
    - ./packages/certificates:/app/packages/certificates:ro
  restart: on-failure
  # Every service already exposes /health on METRICS_PORT (see
  # packages/logger/src/index.ts's metrics HTTP server) — this just wires it
  # in. Uses `node` directly (no curl/wget baked into the slim runner image)
  # and reads METRICS_PORT from the container's own env rather than baking a
  # port number into the shared anchor, since each service sets a different
  # one. Without this, `depends_on: condition: service_healthy` was never
  # usable between app services, and a bad image could go live before
  # anyone/anything noticed.
  healthcheck:
    test:
      - "CMD"
      - "node"
      - "-e"
      - "require('http').get('http://localhost:'+process.env.METRICS_PORT+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s
  # Unbounded containers let one runaway service (e.g. a payroll disbursement
  # batch) starve every other service sharing the host. Sized generously for
  # a Node gRPC microservice at today's scale — tune per-service if profiling
  # shows a service running close to these under normal load.
  #
  # Memory budget (this host is m7i-flex.large: 8 GiB total, per
  # cloudformation/hrms-deploy.yaml): api-gateway (768M) + 12 backend
  # services x 384M = 5,376M + redis (256M) + caddy (128M) = 5,760M, leaving
  # ~2,432M (~30%) of headroom for the OS, dockerd, and the CloudWatch/SSM
  # agents. Redis runs on this same host again (see the `redis` service
  # below) — this single-instance deployment has no other instance to share
  # a cache with, so the ElastiCache cluster that used to serve that role
  # was pure cost with no benefit here. Caddy (see the `caddy` service
  # below) replaces the ALB for public TLS termination.
  # `web` runs under a separate compose profile and isn't part of this
  # host's default `up -d`, so it's excluded from this budget. Unlike
  # memory, cpus limits are deliberately left oversubscribed (0.5 x 12 + 1.0
  # = 7.0 against 2 vCPUs) — CFS quota throttling degrades a container
  # gracefully under contention, it doesn't OOM-kill it, so bursting past
  # the host's core count when siblings are idle is the intended behavior,
  # not a bug.
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 384M

services:
  api-gateway:
    container_name: hrms-prod-api-gateway
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/api-gateway:${TAG_NAME:-latest}
    environment:
      - AUTH_SERVICE_HOST=auth-service
      - USER_SERVICE_HOST=user-service
      - EMPLOYEE_SERVICE_HOST=employee-service
      - ATTENDANCE_SERVICE_HOST=attendance-service
      - LEAVE_SERVICE_HOST=leave-service
      - RECRUITMENT_SERVICE_HOST=recruitment-service
      - HRM_SERVICE_HOST=hrm-service
      - SALARY_SERVICE_HOST=salary-service
      - ANALYTICS_SERVICE_HOST=analytics-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      - PERFORMANCE_REVIEW_SERVICE_HOST=performance-review-service
      - GRPC_SKIP_HOSTNAME_VERIFICATION=true
      - SERVICE_NAME=api-gateway
      - METRICS_PORT=9003
    ports:
      - "19002:9002"
      - "19003:9003"
    <<: *backend-service
    # Overrides the shared anchor's limits — api-gateway fronts every HTTP/WS
    # client directly and now also runs the payroll disbursement BullMQ
    # worker in-process (see payrollDisbursementWorker.ts), so it carries
    # more load than a pure gRPC microservice. Still 2x the backend default
    # (768M vs 384M), not 2x the OLD default (1024M vs 512M) — see the memory
    # budget note on x-backend-service above for the host-wide math.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # Metrics ports below are published on the host (not just the compose
  # network) so the monitoring EC2 host can scrape them over the VPC — see
  # monitoring/prometheus-prod.yml. InstanceSecurityGroup only allows that
  # range in from MonitoringSecurityGroup, so they aren't publicly reachable.
  auth-service:
    container_name: hrms-prod-auth-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/auth-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=auth-service
      - METRICS_PORT=9101
    ports:
      - "9101:9101"
    <<: *backend-service

  user-service:
    container_name: hrms-prod-user-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/user-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=user-service
      - METRICS_PORT=9102
    ports:
      - "9102:9102"
    <<: *backend-service

  employee-service:
    container_name: hrms-prod-employee-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/employee-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=employee-service
      - METRICS_PORT=9103
    ports:
      - "9103:9103"
    <<: *backend-service

  attendance-service:
    container_name: hrms-prod-attendance-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/attendance-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=attendance-service
      - METRICS_PORT=9104
    ports:
      - "9104:9104"
    <<: *backend-service

  leave-service:
    container_name: hrms-prod-leave-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/leave-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=leave-service
      - METRICS_PORT=9105
    ports:
      - "9105:9105"
    <<: *backend-service

  recruitment-service:
    container_name: hrms-prod-recruitment-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/recruitment-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=recruitment-service
      - METRICS_PORT=9106
    ports:
      - "9106:9106"
    <<: *backend-service

  hrm-service:
    container_name: hrms-prod-hrm-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/hrm-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=hrm-service
      - METRICS_PORT=9107
    ports:
      - "9107:9107"
    <<: *backend-service

  salary-service:
    container_name: hrms-prod-salary-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/salary-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=salary-service
      - METRICS_PORT=9108
    ports:
      - "9108:9108"
    <<: *backend-service

  analytics-service:
    container_name: hrms-prod-analytics-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/analytics-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=analytics-service
      - METRICS_PORT=9109
    ports:
      - "9109:9109"
    <<: *backend-service

  notification-service:
    container_name: hrms-prod-notification-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/notification-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=notification-service
      - METRICS_PORT=9110
    ports:
      - "9110:9110"
    <<: *backend-service

  performance-review-service:
    container_name: hrms-prod-performance-review-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/performance-review-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=performance-review-service
      - METRICS_PORT=9112
    ports:
      - "9112:9112"
    <<: *backend-service

  scheduler-service:
    container_name: hrms-prod-scheduler-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/scheduler-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=scheduler-service
      - METRICS_PORT=9111
    ports:
      - "9111:9111"
    <<: *backend-service

  # Back to a per-instance container (was ElastiCache — see the CloudFormation
  # template's comment history). This account runs a single ASG instance with
  # no failover need, so the shared/replicated cache this replaced isn't
  # buying anything here, and it was the largest recurring cost line after
  # EC2. Not published to the host port: nothing outside this compose
  # network needs to reach it, only api-gateway/backend containers via the
  # `redis` service name (REDIS_URL in the hrms/config secret points here).
  redis:
    container_name: hrms-prod-redis
    logging: *default-logging
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # Public TLS termination (was the ALB's job — see the CloudFormation
  # template's comment history). Caddyfile is written once at boot by
  # LaunchTemplate UserData, not synced per-deploy like docker-compose.prod.yml,
  # since its content (the domain name) doesn't change between deploys.
  # caddy-data persists the Let's Encrypt account/certificate across
  # container restarts so it isn't re-issued every time.
  caddy:
    container_name: hrms-prod-caddy
    logging: *default-logging
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  web:
    container_name: hrms-prod-web
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/web:${TAG_NAME:-latest}
    profiles: ["web"]
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./packages/certificates:/app/packages/certificates:ro
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  redis-data:
  caddy-data:
  caddy-config:
