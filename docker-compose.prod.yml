services:
  api-gateway:
    container_name: api-gateway
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/api-gateway:${TAG_NAME:-latest}
    environment:
      - AUTH_SERVICE_HOST=auth-service
      - USER_SERVICE_HOST=user-service
      - EMPLOYEE_SERVICE_HOST=employee-service
      - ATTENDANCE_SERVICE_HOST=attendance-service
      - LEAVE_SERVICE_HOST=leave-service
      - RECRUITMENT_SERVICE_HOST=recruitment-service
      - HRM_SERVICE_HOST=hrm-service
      - SALARY_SERVICE_HOST=salary-service
      - ANALYTICS_SERVICE_HOST=analytics-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      - GRPC_SKIP_HOSTNAME_VERIFICATION=true
    ports:
      - "9002:9002"
    env_file: .env

  auth-service:
    container_name: auth-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/auth-service:${TAG_NAME:-latest}
    env_file: .env

  user-service:
    container_name: user-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/user-service:${TAG_NAME:-latest}
    env_file: .env

  employee-service:
    container_name: employee-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/employee-service:${TAG_NAME:-latest}
