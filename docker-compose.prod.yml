            "gridPos": {
              "x": 0,
              "y": 5,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "lineWidth": 2,
                  "fillOpacity": 10
                }
              }
            },
            "options": {
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              },
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": [
                  "lastNotNull",
                  "max"
                ]
              }
            },
            "targets": [
              {
                "expr": "sum by (service) (rate(http_requests_total{service=~\"$$service\"}[$$interval]))",
                "legendFormat": "{{service}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 6,
            "title": "HTTP Error Rate by Service",
            "type": "timeseries",
            "gridPos": {
              "x": 12,
              "y": 5,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": 0,
                "custom": {
                  "lineWidth": 2,
                  "fillOpacity": 10
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "value": null,
                      "color": "green"
                    },
                    {
                      "value": 1,
                      "color": "yellow"
                    },
                    {
                      "value": 5,
                      "color": "red"
                    }
                  ]
                }
              }
            },
            "options": {
              "tooltip": {
                "mode": "multi"
              },
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": [
                  "lastNotNull",
                  "max"
                ]
              }
            },
            "targets": [
              {
                "expr": "100 * sum by (service) (rate(http_requests_total{service=~\"$$service\",status=~\"5..\"}[$$interval])) / sum by (service) (rate(http_requests_total{service=~\"$$service\"}[$$interval]))",
                "legendFormat": "{{service}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 7,
            "title": "HTTP Latency Percentiles",
            "type": "timeseries",
            "gridPos": {
              "x": 0,
              "y": 13,
              "w": 12,
              "h": 8
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ms",
                "custom": {
                  "lineWidth": 2
                }
              }
            },
            "options": {
              "tooltip": {
                "mode": "multi"
              },
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": [
                  "lastNotNull",
                  "max"
                ]
              }
