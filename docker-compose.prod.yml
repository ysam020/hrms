  leave-service:
    container_name: leave-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/leave-service:${TAG_NAME:-latest}
    env_file: .env

  recruitment-service:
    container_name: recruitment-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/recruitment-service:${TAG_NAME:-latest}
    env_file: .env

  hrm-service:
    container_name: hrm-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/hrm-service:${TAG_NAME:-latest}
    env_file: .env

  salary-service:
    container_name: salary-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/salary-service:${TAG_NAME:-latest}
