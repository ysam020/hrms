            "gridPos": {
              "x": 18,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "decmbytes",
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "value": null,
                      "color": "green"
                    },
                    {
                      "value": 256,
                      "color": "yellow"
                    },
                    {
                      "value": 512,
                      "color": "red"
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "colorMode": "background"
            },
            "targets": [
              {
                "expr": "avg(nodejs_heap_used_bytes{service=~\"$$service\"}) / 1024 / 1024",
                "legendFormat": "heap",
                "refId": "A"
              }
            ]
          },
          {
            "id": 10,
            "title": "HTTP Metrics",
            "type": "row",
            "gridPos": {
              "x": 0,
              "y": 4,
              "w": 24,
              "h": 1
            },
            "collapsed": false
          },
          {
            "id": 5,
            "title": "HTTP Request Rate by Service",
