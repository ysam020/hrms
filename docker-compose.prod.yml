                "datasource": {
                  "type": "cloudwatch",
                  "uid": "cloudwatch"
                },
                "queryMode": "Logs",
                "region": "default",
                "id": "",
                "expression": "fields @timestamp, @log, level, message, requestId, @message | filter level in [$${level:doublequote}] and @message like /(?i)$${search:regex}/ | sort @timestamp desc | limit 500",
                "logGroupNames": [
                  "$$service"
                ]
              }
            ],
            "options": {
              "showTime": true,
              "wrapLogMessage": true,
              "sortOrder": "Descending",
              "enableLogDetails": true,
              "prettifyLogMessage": false,
              "dedupStrategy": "none"
            },
            "id": 8,
            "gridPos": {
              "x": 0,
              "y": 21,
              "w": 24,
              "h": 14
            },
            "datasource": {
              "type": "cloudwatch",
              "uid": "cloudwatch"
            }
          },
