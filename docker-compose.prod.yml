# Deployed on EC2 via SSM (see .github/workflows/deploy-ec2.yml). Requires
# ECR_REGISTRY, ECR_REPOSITORY_PREFIX and TAG_NAME to be exported before
# `docker compose -f docker-compose.prod.yml pull/up` — deploy.sh (embedded in
# the launch template UserData, see cloudformation/hrms-deploy.yaml) sets these.
# `web` is excluded from the default `up -d` via its profile — it's hosted on
# Amplify, not on this stack.
name: hrms-prod

# Docker's default json-file driver never rotates, so container logs grew
# until they filled the instance's root volume (SSM run-command and deploys
# then fail with "No space left on device"). Caps each container at ~30 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-service: &backend-service
  logging: *default-logging
  volumes:
    - ./packages/certificates:/app/packages/certificates:ro
  restart: on-failure
  # Time between SIGTERM and SIGKILL on `docker compose stop`/redeploy.
  # Must exceed each service's own shutdown budget so it exits on its own
  # after draining: gRPC services and queue workers 8 s, their cluster
  # primary 9 s (SHUTDOWN_GRACE_MS, packages/common/src/shutdown.ts); the API
  # gateway 15 s, its primary 16 s (apps/api-gateway/src/config/
  # shutdownBudget.ts). Docker's default 10 s was below the gateway's.
  stop_grace_period: 20s
  # Every service already exposes /health on METRICS_PORT (see
  # packages/logger/src/index.ts's metrics HTTP server) — this just wires it
  # in. Uses `node` directly (no curl/wget baked into the slim runner image)
  # and reads METRICS_PORT from the container's own env rather than baking a
  # port number into the shared anchor, since each service sets a different
  # one. Without this, `depends_on: condition: service_healthy` was never
  # usable between app services, and a bad image could go live before
  # anyone/anything noticed.
  healthcheck:
    test:
      - "CMD"
      - "node"
      - "-e"
      - "require('http').get('http://localhost:'+process.env.METRICS_PORT+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s
  # Unbounded containers let one runaway service (e.g. a payroll disbursement
  # batch) starve every other service sharing the host. Sized generously for
  # a Node gRPC microservice at today's scale — tune per-service if profiling
  # shows a service running close to these under normal load.
  #
  # Memory budget (this host is m7i-flex.large: 8 GiB total, per
  # cloudformation/hrms-deploy.yaml): api-gateway (768M) + 12 backend
  # services x 384M = 5,376M + redis (256M) + caddy (128M) + grafana (384M)
  # + prometheus (384M) = 6,528M, leaving ~1,664M (~20%) of headroom for the
  # OS, dockerd, and the CloudWatch/SSM
  # agents. Redis runs on this same host again (see the `redis` service
  # below) — this single-instance deployment has no other instance to share
  # a cache with, so the ElastiCache cluster that used to serve that role
  # was pure cost with no benefit here. Caddy (see the `caddy` service
  # below) replaces the ALB for public TLS termination.
  # `web` runs under a separate compose profile and isn't part of this
  # host's default `up -d`, so it's excluded from this budget. Unlike
  # memory, cpus limits are deliberately left oversubscribed (0.5 x 12 + 1.0
  # = 7.0 against 2 vCPUs) — CFS quota throttling degrades a container
  # gracefully under contention, it doesn't OOM-kill it, so bursting past
  # the host's core count when siblings are idle is the intended behavior,
  # not a bug.
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 384M

services:
  api-gateway:
    container_name: hrms-prod-api-gateway
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/api-gateway:${TAG_NAME:-latest}
    environment:
      - AUTH_SERVICE_HOST=auth-service
      - USER_SERVICE_HOST=user-service
      - EMPLOYEE_SERVICE_HOST=employee-service
      - ATTENDANCE_SERVICE_HOST=attendance-service
      - LEAVE_SERVICE_HOST=leave-service
      - RECRUITMENT_SERVICE_HOST=recruitment-service
      - HRM_SERVICE_HOST=hrm-service
      - SALARY_SERVICE_HOST=salary-service
      - ANALYTICS_SERVICE_HOST=analytics-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      - PERFORMANCE_REVIEW_SERVICE_HOST=performance-review-service
      - GRPC_SKIP_HOSTNAME_VERIFICATION=true
      - SERVICE_NAME=api-gateway
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - FIELD_VALIDATION_LEVEL=moderate
      - METRICS_PORT=9003
    ports:
      - "19002:9002"
      - "19003:9003"
    <<: *backend-service
    # Overrides the shared anchor's limits — api-gateway fronts every HTTP/WS
    # client directly and now also runs the payroll disbursement BullMQ
    # worker in-process (see payrollDisbursementWorker.ts), so it carries
    # more load than a pure gRPC microservice. Still 2x the backend default
    # (768M vs 384M), not 2x the OLD default (1024M vs 512M) — see the memory
    # budget note on x-backend-service above for the host-wide math.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # Metrics ports below are published on the host (not just the compose
  # network) so the monitoring EC2 host can scrape them over the VPC — see
  # monitoring/prometheus-prod.yml. InstanceSecurityGroup only allows that
  # range in from MonitoringSecurityGroup, so they aren't publicly reachable.
  auth-service:
    container_name: hrms-prod-auth-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/auth-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=auth-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9101
    <<: *backend-service

  user-service:
    container_name: hrms-prod-user-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/user-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=user-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9102
    <<: *backend-service

  employee-service:
    container_name: hrms-prod-employee-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/employee-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=employee-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9103
    <<: *backend-service

  attendance-service:
    container_name: hrms-prod-attendance-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/attendance-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=attendance-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9104
    <<: *backend-service

  leave-service:
    container_name: hrms-prod-leave-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/leave-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=leave-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9105
    <<: *backend-service

  recruitment-service:
    container_name: hrms-prod-recruitment-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/recruitment-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=recruitment-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9106
    <<: *backend-service

  hrm-service:
    container_name: hrms-prod-hrm-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/hrm-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=hrm-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9107
    <<: *backend-service

  salary-service:
    container_name: hrms-prod-salary-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/salary-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=salary-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9108
    <<: *backend-service

  analytics-service:
    container_name: hrms-prod-analytics-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/analytics-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=analytics-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9109
    <<: *backend-service

  notification-service:
    container_name: hrms-prod-notification-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/notification-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=notification-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9110
    <<: *backend-service

  performance-review-service:
    container_name: hrms-prod-performance-review-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/performance-review-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=performance-review-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      - METRICS_PORT=9112
    <<: *backend-service

  scheduler-service:
    container_name: hrms-prod-scheduler-service
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/scheduler-service:${TAG_NAME:-latest}
    environment:
      - SERVICE_NAME=scheduler-service
      - NODE_ENV=production
      - FIELD_KMS_KEY_ID=alias/praesto-field-encryption
      - FIELD_LEGACY_PLAINTEXT_MATCH=true
      # Crons run only where this is "true" — see apps/scheduler-service/src/scheduler.ts
      - SCHEDULER_ENABLED=true
      - METRICS_PORT=9111
    <<: *backend-service

  # Back to a per-instance container (was ElastiCache — see the CloudFormation
  # template's comment history). This account runs a single ASG instance with
  # no failover need, so the shared/replicated cache this replaced isn't
  # buying anything here, and it was the largest recurring cost line after
  # EC2. Not published to the host port: nothing outside this compose
  # network needs to reach it, only api-gateway/backend containers via the
  # `redis` service name (REDIS_URL in the hrms/config secret points here).
  redis:
    container_name: hrms-prod-redis
    logging: *default-logging
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # Writes the grafana.praesto.in basic-auth credential for Caddy from
  # Secrets Manager (secret `hrms/config-grafana-basic-auth`: the base64 of a
  # `caddy hash-password` bcrypt hash) into a volume only Caddy reads, so the
  # hash is never in this file or in git. Reads with the instance role, like
  # the services' hrms/config; the role's existing hrms/config-* grant covers
  # the name. Always exits 0: if the secret is missing or malformed it writes
  # the hash of a random password nobody has, so Grafana stays locked but
  # Caddy, and api.praesto.in behind it, still start.
  # After changing the secret: re-run deploy.sh, then restart hrms-prod-caddy.
  grafana-auth:
    container_name: hrms-prod-grafana-auth
    logging: *default-logging
    image: amazon/aws-cli:2.27.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        hash=$$(aws secretsmanager get-secret-value --region ap-south-1 --secret-id hrms/config-grafana-basic-auth --query SecretString --output text 2>/dev/null) || hash=""
        case "$$hash" in
          "" | *[!A-Za-z0-9+/=]*)
            echo "grafana-auth: secret unavailable or malformed; Grafana stays locked" >&2
            hash="JDJhJDE0JFdBZ3ZPVlQ0TS95V0dNRHRrMHBmcy56b2czZ0JZblJBSHAwN3VYWlJSWG1UVS4vZ2F6Z0Np" ;;
        esac
        printf 'admin %s\n' "$$hash" > /run/grafana-auth/credentials
    volumes:
      - grafana-auth:/run/grafana-auth
    restart: "no"

  # Public TLS termination (was the ALB's job — see the CloudFormation
  # template's comment history). The Caddyfile comes from the `caddyfile`
  # config at the bottom of this file, so it's synced on every deploy like
  # the rest of this file. (/opt/hrms/Caddyfile, written at boot by
  # LaunchTemplate UserData, is no longer read.)
  # caddy-data persists the Let's Encrypt account/certificate across
  # container restarts so it isn't re-issued every time.
  caddy:
    container_name: hrms-prod-caddy
    logging: *default-logging
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      grafana-auth:
        condition: service_completed_successfully
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - grafana-auth:/run/grafana-auth:ro
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Logs UI at https://grafana.praesto.in, reading CloudWatch Logs
  # (/hrms/<service>/production) with this instance's role — no AWS keys.
  # Not published on a host port: only Caddy reaches it, and Caddy's
  # basic_auth is the only way in. Grafana's own login form and basic auth
  # are off; Caddy passes the authenticated user in X-WEBAUTH-USER
  # (auth.proxy), and "admin" maps to Grafana's built-in admin account.
  grafana:
    container_name: hrms-prod-grafana
    logging: *default-logging
    image: grafana/grafana:12.1.1
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.praesto.in
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_DISABLE_SIGNOUT_MENU=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/hrms.yml
      - source: grafana-dashboard-hrms
        target: /var/lib/grafana/dashboards/hrms.json
      - source: grafana-dashboard-hrms-logs
        target: /var/lib/grafana/dashboards/hrms-logs.json
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  # Metrics for the "HRMS Node.js Application" dashboard. Scrapes every
  # service's /metrics (METRICS_PORT) over the compose network; not
  # published on a host port, only grafana reads it.
  prometheus:
    container_name: hrms-prod-prometheus
    logging: *default-logging
    image: prom/prometheus:v3.11.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  web:
    container_name: hrms-prod-web
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX:-dev}/web:${TAG_NAME:-latest}
    profiles: ["web"]
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./packages/certificates:/app/packages/certificates:ro
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  grafana-data:
  grafana-auth:
  prometheus-data:

configs:
  # header_up overwrites any X-WEBAUTH-USER a client sends, so Grafana only
  # ever sees the user Caddy authenticated. The basic_auth credential is not
  # in this file (the repo is public): grafana-auth writes it from Secrets
  # Manager into /run/grafana-auth/credentials before Caddy starts.
  caddyfile:
    content: |
      api.praesto.in {
      	reverse_proxy https://api-gateway:9002 {
      		transport http {
      			tls_insecure_skip_verify
      		}
      	}
      }

      grafana.praesto.in {
      	basic_auth {
      		import /run/grafana-auth/credentials
      	}
      	reverse_proxy grafana:3000 {
      		header_up X-WEBAUTH-USER {http.auth.user.id}
      		header_up -Authorization
      	}
      }

  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
        - name: CloudWatch
          type: cloudwatch
          uid: cloudwatch
          access: proxy
          editable: false
          jsonData:
            authType: default
            defaultRegion: ap-south-1

  grafana-dashboard-provider:
    content: |
      apiVersion: 1
      providers:
        - name: hrms
          type: file
          allowUiUpdates: false
          options:
            path: /var/lib/grafana/dashboards

  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: api-gateway
          static_configs:
            - targets: ["api-gateway:9003"]
              labels:
                service: api-gateway
        - job_name: auth-service
          static_configs:
            - targets: ["auth-service:9101"]
              labels:
                service: auth-service
        - job_name: user-service
          static_configs:
            - targets: ["user-service:9102"]
              labels:
                service: user-service
        - job_name: employee-service
          static_configs:
            - targets: ["employee-service:9103"]
              labels:
                service: employee-service
        - job_name: attendance-service
          static_configs:
            - targets: ["attendance-service:9104"]
              labels:
                service: attendance-service
        - job_name: leave-service
          static_configs:
            - targets: ["leave-service:9105"]
              labels:
                service: leave-service
        - job_name: recruitment-service
          static_configs:
            - targets: ["recruitment-service:9106"]
              labels:
                service: recruitment-service
        - job_name: hrm-service
          static_configs:
            - targets: ["hrm-service:9107"]
              labels:
                service: hrm-service
        - job_name: salary-service
          static_configs:
            - targets: ["salary-service:9108"]
              labels:
                service: salary-service
        - job_name: analytics-service
          static_configs:
            - targets: ["analytics-service:9109"]
              labels:
                service: analytics-service
        - job_name: notification-service
          static_configs:
            - targets: ["notification-service:9110"]
              labels:
                service: notification-service
        - job_name: performance-review-service
          static_configs:
            - targets: ["performance-review-service:9112"]
              labels:
                service: performance-review-service
        - job_name: scheduler-service
          static_configs:
            - targets: ["scheduler-service:9111"]
              labels:
                service: scheduler-service

  # BEGIN generated dashboards — `node scripts/embed-grafana-dashboards.mjs`
  # copies monitoring/grafana/dashboards-prod/*.json here. Edit those files,
  # not this block.
  grafana-dashboard-hrms-logs:
    content: |
      {
        "uid": "hrms-logs",
        "title": "HRMS Logs (production)",
        "tags": [
          "logs",
          "production"
        ],
        "timezone": "browser",
        "refresh": "",
        "schemaVersion": 41,
        "editable": true,
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "service",
              "label": "Log groups",
              "type": "custom",
              "multi": true,
              "includeAll": false,
              "query": "/hrms/api-gateway/production,/hrms/auth-service/production,/hrms/user-service/production,/hrms/employee-service/production,/hrms/attendance-service/production,/hrms/leave-service/production,/hrms/recruitment-service/production,/hrms/hrm-service/production,/hrms/salary-service/production,/hrms/analytics-service/production,/hrms/notification-service/production,/hrms/performance-review-service/production,/hrms/scheduler-service/production",
              "current": {
                "text": [
                  "/hrms/api-gateway/production",
                  "/hrms/auth-service/production",
                  "/hrms/user-service/production",
                  "/hrms/employee-service/production",
                  "/hrms/attendance-service/production",
                  "/hrms/leave-service/production",
                  "/hrms/recruitment-service/production",
                  "/hrms/hrm-service/production",
                  "/hrms/salary-service/production",
                  "/hrms/analytics-service/production",
                  "/hrms/notification-service/production",
                  "/hrms/performance-review-service/production",
                  "/hrms/scheduler-service/production"
                ],
                "value": [
                  "/hrms/api-gateway/production",
                  "/hrms/auth-service/production",
                  "/hrms/user-service/production",
                  "/hrms/employee-service/production",
                  "/hrms/attendance-service/production",
                  "/hrms/leave-service/production",
                  "/hrms/recruitment-service/production",
                  "/hrms/hrm-service/production",
                  "/hrms/salary-service/production",
                  "/hrms/analytics-service/production",
                  "/hrms/notification-service/production",
                  "/hrms/performance-review-service/production",
                  "/hrms/scheduler-service/production"
                ]
              },
              "options": [
                {
                  "text": "/hrms/api-gateway/production",
                  "value": "/hrms/api-gateway/production",
                  "selected": true
                },
                {
                  "text": "/hrms/auth-service/production",
                  "value": "/hrms/auth-service/production",
                  "selected": true
                },
