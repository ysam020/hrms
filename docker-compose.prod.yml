services:
  api-gateway:
    container_name: api-gateway
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/api-gateway:${TAG_NAME}
    environment:
      - AUTH_SERVICE_HOST=auth-service
      - USER_SERVICE_HOST=user-service
      - EMPLOYEE_SERVICE_HOST=employee-service
      - ATTENDANCE_SERVICE_HOST=attendance-service
      - LEAVE_SERVICE_HOST=leave-service
      - RECRUITMENT_SERVICE_HOST=recruitment-service
      - HRM_SERVICE_HOST=hrm-service
      - SALARY_SERVICE_HOST=salary-service
      - ANALYTICS_SERVICE_HOST=analytics-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      - GRPC_SKIP_HOSTNAME_VERIFICATION=true
    ports:
      - "9002:9002"
    env_file: .env

  auth-service:
    container_name: auth-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/auth-service:${TAG_NAME}
    env_file: .env

  user-service:
    container_name: user-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/user-service:${TAG_NAME}
    env_file: .env

  employee-service:
    container_name: employee-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/employee-service:${TAG_NAME}
    env_file: .env

  attendance-service:
    container_name: attendance-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/attendance-service:${TAG_NAME}
    env_file: .env

  leave-service:
    container_name: leave-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/leave-service:${TAG_NAME}
    env_file: .env

  recruitment-service:
    container_name: recruitment-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/recruitment-service:${TAG_NAME}
    env_file: .env

  hrm-service:
    container_name: hrm-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/hrm-service:${TAG_NAME}
    env_file: .env

  salary-service:
    container_name: salary-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/salary-service:${TAG_NAME}
    env_file: .env

  analytics-service:
    container_name: analytics-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/analytics-service:${TAG_NAME}
    env_file: .env

  notification-service:
    container_name: notification-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/notification-service:${TAG_NAME}
    env_file: .env

  scheduler-service:
    container_name: scheduler-service
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/scheduler-service:${TAG_NAME}
    env_file: .env

  web:
    container_name: web
    image: 061039808638.dkr.ecr.ap-south-1.amazonaws.com/dev/web:${TAG_NAME}
    ports:
      - "80:80"
