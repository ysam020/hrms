  attendance-service:
    container_name: attendance-service
    image: ${ECR_REGISTRY:-061039808638.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY_PREFIX:-dev}/attendance-service:${TAG_NAME:-latest}
