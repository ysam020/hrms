server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # HTTP/2: the app is dozens of small hashed chunks; over HTTP/1.1 the
    # browser fetches them six at a time. (WebSockets still upgrade over a
    # separate HTTP/1.1 connection, so /socket.io is unaffected.)
    http2 on;
    server_name localhost;

    ssl_certificate /app/packages/certificates/cert.pem;
    ssl_certificate_key /app/packages/certificates/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so upstream hostnames resolve at request time,
    # not at nginx startup (prevents crash when api-gateway isn't up yet)
    resolver 127.0.0.11 valid=10s;

    # Security headers — nginx serves the SPA's HTML/JS/CSS directly (not
    # proxied through api-gateway's Express process, so its helmet()
    # middleware never touches these responses). `always` emits the header
    # on error responses too, not just 2xx. NOTE: nginx does not merge
    # add_header across nesting levels — any location block that sets its
    # own add_header (the cache-control blocks below) must repeat these or
    # they're silently dropped for that block, not just left as inherited.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https://praesto-189923011190.s3.ap-south-1.amazonaws.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tiles.openfreemap.org https://photon.komoot.io https://api.razorpay.com https://lumberjack.razorpay.com; worker-src 'self' blob:; object-src 'none'; frame-src https://api.razorpay.com; base-uri 'self'; upgrade-insecure-requests" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        text/xml
        image/svg+xml
        image/x-icon;

    # API proxy → api-gateway (HTTP/1.1 to TLS backend, cert verify off for self-signed)
    location /api/ {
        set $upstream https://api-gateway:9002;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO WebSocket proxy
    location /socket.io/ {
        set $upstream https://api-gateway:9002;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Health check
    location /health {
        set $upstream https://api-gateway:9002;
        proxy_pass $upstream;
        proxy_ssl_verify off;
    }

    # Hashed build assets — cache forever (immutable). Matched by file
    # extension (not just the /assets/ prefix) because the SPA also has its
    # own client-side route at /assets/* (the Assets module) — a prefix-only
    # match would swallow that route on a hard refresh (a real request nginx
    # sees, unlike client-side navigation) and 404 since no such file exists.
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated here because this block already sets add_header — nginx
        # does not merge add_header across nesting levels, so the
        # server-level security headers above would otherwise be dropped
        # for every response matched by this block.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https://praesto-189923011190.s3.ap-south-1.amazonaws.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tiles.openfreemap.org https://photon.komoot.io https://api.razorpay.com https://lumberjack.razorpay.com; worker-src 'self' blob:; object-src 'none'; frame-src https://api.razorpay.com; base-uri 'self'; upgrade-insecure-requests" always;
    }

    # Service workers — never cache
    location ~* (sw\.js|firebase-messaging-sw\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https://praesto-189923011190.s3.ap-south-1.amazonaws.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tiles.openfreemap.org https://photon.komoot.io https://api.razorpay.com https://lumberjack.razorpay.com; worker-src 'self' blob:; object-src 'none'; frame-src https://api.razorpay.com; base-uri 'self'; upgrade-insecure-requests" always;
    }

    # HTML — always revalidated, so a deploy shows up on the next load. The
    # pages are the same static shell for everyone (no tenant data: that
    # comes from /api), so they may be kept for back/forward navigation:
    # no-store would rule the page out of the back/forward cache.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https://praesto-189923011190.s3.ap-south-1.amazonaws.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tiles.openfreemap.org https://photon.komoot.io https://api.razorpay.com https://lumberjack.razorpay.com; worker-src 'self' blob:; object-src 'none'; frame-src https://api.razorpay.com; base-uri 'self'; upgrade-insecure-requests" always;
    }

    # Unversioned public images (landing screenshots, icons): a day, then
    # revalidated. Not immutable: their names don't change when their
    # content does. Scripts and JSON outside /assets (theme-init.js,
    # manifest.json) keep revalidating on every load: a stale copy could
    # disagree with a new deploy.
    location ~* ^/(images/.+|[^/]+\.(png|ico|webp|svg))$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https://praesto-189923011190.s3.ap-south-1.amazonaws.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tiles.openfreemap.org https://photon.komoot.io https://api.razorpay.com https://lumberjack.razorpay.com; worker-src 'self' blob:; object-src 'none'; frame-src https://api.razorpay.com; base-uri 'self'; upgrade-insecure-requests" always;
    }

    # SPA fallback. "/" is the prerendered landing page and /privacy-policy
    # and the other prerendered public pages have their own .html. Every
    # other route gets app.html: the same app without the landing page's
    # markup, styles and code preloads, which index.html would make every
    # deep link download first. The service worker does the same
    # (sw/sw.ts). No `$uri/`: /assets and /images are app routes as well as
    # directories, and a directory match ends in a 403.
    location = / {
        rewrite ^ /index.html last;
    }

    location / {
        try_files $uri $uri.html /app.html;
    }
}
