# Standalone monitoring stack for local development (pnpm dev).
# Services run on the host; Prometheus scrapes via host.docker.internal.
# Start automatically via: pnpm dev
# Stop with: pnpm monitoring:stop

services:
  prometheus:
    container_name: hrms-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    container_name: hrms-loki
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    container_name: hrms-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # ── Distributed Tracing (OpenTelemetry) ─────────────────────────────────────
  # Jaeger all-in-one: collects OTLP traces from api-gateway + all services.
  # UI: http://localhost:16686
  # OTLP HTTP ingest: http://localhost:4318  (used by telemetry.ts)
  jaeger:
    container_name: hrms-jaeger
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver (used by OTEL_EXPORTER_OTLP_ENDPOINT)
      - "6831:6831/udp" # Jaeger agent (legacy UDP, keep for compat)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=warn
    volumes:
      - jaeger-data:/badger
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
