<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <meta
      name="description"
      content="Praesto - Advanced HR Management Solution"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Praesto" />
    <meta
      property="og:description"
      content="Praesto offers an advanced HR management solution."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo192.png" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="//unpkg.com" />
    <link rel="dns-prefetch" href="//raw.githubusercontent.com" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://localhost:9002" />

    <!-- Preload images -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/m-bg.webp"
      fetchpriority="high"
    />

    <title>Praesto - HR Management System</title>

    <script src="/theme-init.js"></script>

    <style>
      /* (your entire CSS unchanged) */
    </style>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
      }
      html.dark-theme #initial-loader {
        background: #111b21;
      }
      #initial-loader::after {
        content: "";
        width: 40px;
        height: 40px;
        border: 4px solid rgba(25, 118, 210, 0.2);
        border-top-color: #1976d2;
        border-radius: 50%;
        animation: _spin 0.75s linear infinite;
      }
      @keyframes _spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div
        class="loading-spinner"
        id="initial-loader"
        role="status"
        aria-live="polite"
        aria-label="Application loading"
      ></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker -->
    <script src="/sw-register.js"></script>

    <!-- Network status -->
    <script src="/network-status.js"></script>
  </body>
</html>
