    <!-- Theme Script (unchanged ✅) -->
    <script>
      (function () {
        try {
          const theme = JSON.parse(localStorage.getItem("theme") || '"light"');
          if (theme === "dark") {
            document.documentElement.classList.add("dark-theme");
            document.documentElement.style.backgroundColor = "#111B21";
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <div class="loading-spinner" id="initial-loader"></div>
    </div>

    <!-- ✅ IMPORTANT: Vite entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/firebase-messaging-sw.js", { scope: "/" })
            .then((reg) => {
              // When a new SW is waiting, show an update banner and activate on confirm
              reg.addEventListener("updatefound", () => {
                const newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    // Dispatch a custom event so the React app can show a toast
                    window.dispatchEvent(new CustomEvent("sw-update-available", { detail: reg }));
                  }
                });
              });
            })
            .catch(console.error);

          // When the new SW takes control, reload once to serve fresh assets
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>

    <!-- CSP + Monitoring (NO CHANGE REQUIRED) -->
    <script>
      (function () {
        // (your CSP script unchanged)
      })();
    </script>

    <!-- Network status -->
    <script>
      window.addEventListener("load", () => {
        let offlineIndicator = null;

        function showOfflineIndicator() {
          if (!offlineIndicator) {
            offlineIndicator = document.createElement("div");
            offlineIndicator.className = "offline-indicator";
            offlineIndicator.textContent = "⚠️ No internet connection";
            document.body.appendChild(offlineIndicator);
          }
        }

        function hideOfflineIndicator() {
          if (offlineIndicator) {
            offlineIndicator.remove();
            offlineIndicator = null;
          }
        }

        window.addEventListener("online", hideOfflineIndicator);
        window.addEventListener("offline", showOfflineIndicator);

        if (!navigator.onLine) showOfflineIndicator();
      });
    </script>
  </body>
</html>
