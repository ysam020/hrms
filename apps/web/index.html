<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color follows the app's appearance (public/theme-init.js,
         src/shell/appearance.ts). The status-bar style stays "default": iOS
         reads it once, when the app is added to the Home Screen, and colours
         that opaque bar from the top of the page (src/design/tokens.css). -->
    <meta name="theme-color" content="#f2f3f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Praesto" />

    <title>Praesto</title>
    <meta
      name="description"
      content="Praesto is HR software for attendance, leave, recruitment, payroll and approvals in one workspace."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <!-- scripts/prerender.mjs adds each public page's canonical URL, social
         cards and structured data here. -->
    <!--seo-head-->

    <script src="/theme-init.js"></script>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
      }
      html.dark-theme #initial-loader {
        background: #141416;
      }
      #initial-loader::after {
        content: "";
        width: 40px;
        height: 40px;
        border: 4px solid rgba(25, 118, 210, 0.2);
        border-top-color: #1976d2;
        border-radius: 50%;
        animation: _spin 0.75s linear infinite;
      }
      @keyframes _spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div
        class="loading-spinner"
        id="initial-loader"
        role="status"
        aria-live="polite"
        aria-label="Application loading"
      ></div>
      <!--prerender-->
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- The service worker is registered by the app (src/offline/register.ts). -->
  </body>
</html>
