<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color follows the app's appearance (public/theme-init.js,
         src/shell/appearance.ts) for browsers that use it. iOS 26+ ignores
         it: the installed app's status bar takes the colour of a fixed
         element at the top of the page, else <body>'s background, so neither
         may show a colour the theme doesn't. The status-bar style stays
         "default"; iOS reads it once, at Add to Home Screen. -->
    <meta name="theme-color" content="#f2f3f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Praesto" />

    <title>Praesto</title>
    <meta
      name="description"
      content="Praesto is HR software for attendance, leave, recruitment, payroll and approvals in one workspace."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <!-- scripts/prerender.mjs adds each public page's canonical URL, social
         cards and structured data here. -->
    <!--seo-head-->

    <script src="/theme-init.js"></script>

    <style>
      /* Transparent: the page background shows through (set for Dark by
         theme-init.js, then by the app's tokens). A colour of its own would
         go stale when the app takes over from theme-init.js, and iOS
         colours its status bar from a fixed element like this one. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      /* The Praesto mark drawing itself: a static copy of ui/Spinner
         (same 56px, timing and Reduce Motion fallback), so the app's
         LoadingScreen takes over mid-loop without a jump. */
      #initial-loader .track {
        opacity: 0.18;
      }
      #initial-loader .ink path {
        stroke-dasharray: 1 1.2;
        animation: _draw 2400ms cubic-bezier(0.65, 0, 0.35, 1) infinite both;
      }
      #initial-loader .ink path:nth-child(2) {
        animation-delay: 120ms;
      }
      #initial-loader .ink path:nth-child(3) {
        animation-delay: 280ms;
      }
      @keyframes _draw {
        0%,
        6% {
          stroke-dashoffset: 1.1;
        }
        40%,
        66% {
          stroke-dashoffset: 0;
        }
        94%,
        100% {
          stroke-dashoffset: -1.1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .ink path {
          animation: none;
          stroke-dashoffset: 0;
        }
        #initial-loader svg {
          animation: _breathe 1.8s ease-in-out infinite alternate;
        }
      }
      @keyframes _breathe {
        to {
          opacity: 0.4;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div
        id="initial-loader"
        role="status"
        aria-live="polite"
        aria-label="Starting Praesto"
      >
        <svg
          viewBox="50 22 66 66"
          width="56"
          height="56"
          aria-hidden="true"
          focusable="false"
          fill="none"
          stroke-width="5.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <g class="track">
            <path d="M 63.5,81.4 L 64.5,34.7 L 72.1,44.3" stroke="#fd7624" />
            <path d="M 63.3,82.2 L 91.3,57.2" stroke="#f03933" />
            <path
              d="M 75.5,57.0 L 102.7,27.5 L 102.7,72.0 L 95.7,65.0"
              stroke="#25b37b"
            />
          </g>
          <g class="ink">
            <path
              d="M 63.5,81.4 L 64.5,34.7 L 72.1,44.3"
              pathLength="1"
              stroke="#fd7624"
            />
            <path d="M 63.3,82.2 L 91.3,57.2" pathLength="1" stroke="#f03933" />
            <path
              d="M 75.5,57.0 L 102.7,27.5 L 102.7,72.0 L 95.7,65.0"
              pathLength="1"
              stroke="#25b37b"
            />
          </g>
        </svg>
      </div>
      <!--prerender-->
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- The service worker is registered by the app (src/offline/register.ts). -->
  </body>
</html>
