<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline – Praesto</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 48px 40px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        background: #1e3a5f;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 32px;
        height: 32px;
        color: #60a5fa;
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #f1f5f9;
      }

      p {
        font-size: 15px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        padding: 10px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition: opacity 0.15s;
      }

      button:hover { opacity: 0.85; }

      .btn-primary {
        background: #3b82f6;
        color: #fff;
      }

      .btn-secondary {
        background: #334155;
        color: #e2e8f0;
      }

      .status {
        margin-top: 24px;
        font-size: 13px;
        color: #64748b;
        min-height: 20px;
      }

      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        margin-right: 6px;
        vertical-align: middle;
      }

      .dot.online { background: #22c55e; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3l18 18M8.111 8.111A5.25 5.25 0 0118.75 12a5.25 5.25 0 01-1.065 3.19M12 12v.01M12 6.75A8.25 8.25 0 0120.25 15H3.75A8.25 8.25 0 0112 6.75z" />
        </svg>
      </div>

      <h1>You're offline</h1>
      <p>
        No internet connection detected. Check your network and try again, or
        go back to the app — your last visited pages are available offline.
      </p>

      <div class="actions">
        <button class="btn-primary" onclick="tryReload()">Try again</button>
        <button class="btn-secondary" onclick="history.back()">Go back</button>
      </div>

      <p class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">No connection</span>
      </p>
    </div>

    <script>
      function updateStatus() {
        const dot = document.getElementById("dot");
        const text = document.getElementById("status-text");
        if (navigator.onLine) {
          dot.className = "dot online";
          text.textContent = "Connection restored — click Try again";
        } else {
          dot.className = "dot";
          text.textContent = "No connection";
        }
      }

      function tryReload() {
        // Try to navigate back to the app root; if still offline the SW
        // will serve the cached shell or this page again.
        window.location.href = "/";
      }

      window.addEventListener("online", updateStatus);
      window.addEventListener("offline", updateStatus);
      updateStatus();
    </script>
  </body>
</html>
