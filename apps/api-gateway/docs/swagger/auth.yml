paths:
  /api/v1/csrf-token:
    get:
      summary: Fetch CSRF token
      description: >
        Returns a CSRF token derived from the server-side secret. The token must
        be included as `X-CSRF-Token` on all state-changing requests (POST, PUT,
        DELETE). The client Axios interceptor calls this lazily on the first
        mutation and caches the result; it is invalidated on logout or 403.
        Mounted directly in server.ts (not through a route file).
      tags: [Authentication]
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string, example: "9a3f...d2" }

  /api/v1/profile:
    get:
      summary: Get authenticated user profile
      description: >
        Returns the full profile of the currently authenticated user, including
        decrypted PII fields, salary-adjacent flags, and active tenant context
        (`tenantName`, `tenantSlug`, `tenantRole`, `wfhEnabled`).
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Profile fetched" }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            {
                              type: string,
                              example: "6672a2501aa931b68b091faf",
                            }
                          email: { type: string, example: "user@example.com" }
                          username: { type: string, example: "sameer_yadav" }
                          role:
                            {
                              type: array,
                              items: { type: string },
                              example: ["admin"],
                            }
                          isSuperUser: { type: boolean, example: false }
                          permissions: { type: array, items: { type: string } }
                          employeeStatus: { type: string, example: "Active" }
                          firstName: { type: string, example: "Sameer" }
                          lastName: { type: string, example: "Yadav" }
                          fullName: { type: string, example: "Sameer Yadav" }
                          dob: { type: string, example: "1995-06-10" }
                          blood_group: { type: string, example: "O+" }
                          mobile: { type: string, nullable: true }
                          official_email: { type: string }
                          personalEmail: { type: string }
                          designation:
                            { type: string, example: "Full Stack Developer" }
                          department: { type: string, example: "Engineering" }
                          joining_date: { type: string }
                          employee_photo: { type: string }
                          bank_account_no: { type: string, nullable: true }
                          bank_name: { type: string }
                          ifsc_code: { type: string }
                          aadhar_no: { type: string, nullable: true }
                          pan_no: { type: string, nullable: true }
                          pf_no: { type: string }
                          uan_no: { type: string }
                          esic_no: { type: string }
                          fcmTokens: { type: array, items: { type: object } }
                          events: { type: array, items: { type: object } }
                          face_descriptor:
                            type: array
                            nullable: true
                            items: { type: number }
                            description: 128-dimensional vector, or null if not enrolled
                          tenantName: { type: string, nullable: true }
                          tenantSlug: { type: string, nullable: true }
                          tenantRole:
                            type: string
                            nullable: true
                            enum: [owner, admin, hr, manager, employee]
                          wfhEnabled: { type: boolean, example: true }
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /api/v1/refresh-token:
    post:
      summary: Refresh access token
      description: >
        Issues a new access token from a valid refresh token. Web clients send
        the refresh token via the `refresh_token` httpOnly cookie (AES-encrypted);
        mobile clients (no shared cookie jar) send it in the request body
        instead. On success, the response rotates the `refresh_token` cookie
        for web callers and echoes the plain refresh token back to the caller
        only when it was supplied in the body (mobile).
      tags: [Authentication]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Required for mobile clients; web clients rely on the cookie instead.
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      refreshToken:
                        type: string
                        nullable: true
                        description: Only present when the request supplied a body refreshToken (mobile).
        "401":
          description: Invalid, expired, or missing refresh token

  /api/v1/logout:
    get:
      summary: Logout current session
      description: Invalidates the current session server-side and clears the refresh_token cookie.
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Logout successful" }
        "401":
          description: Unauthorized

  /api/v1/auth/google:
    get:
      summary: Initiate Google OAuth login
      description: >
        Redirects the user to Google's OAuth 2.0 authorization page. This is a
        browser redirect, not an AJAX endpoint. Pass `platform=mobile` with a
        `redirect_uri` (must be `exp://` or `hrms://`) to have the callback hand
        tokens back via app deep link instead of a web redirect.
      tags: [Authentication]
      parameters:
        - name: platform
          in: query
          required: false
          schema: { type: string, enum: [mobile] }
        - name: redirect_uri
          in: query
          required: false
          schema: { type: string }
          description: Mobile deep-link target; only honored when platform=mobile and the scheme is exp:// or hrms://.
      responses:
        "302":
          description: Redirect to Google's OAuth authorization page

  /api/v1/webauthn-register:
    get:
      summary: Get WebAuthn registration options
      description: Returns PublicKeyCredentialCreationOptions to begin passkey registration.
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registration options returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    description: Parsed PublicKeyCredentialCreationOptions (from auth-service).
        "400":
          description: Failed to generate registration options
        "401":
          description: Unauthorized
    post:
      summary: Get WebAuthn registration options (duplicate RPC call)
      description: >
        Authenticated variant that calls the same auth-service
        `WebAuthnRegistrationOptions` RPC as the GET on this path, but returns
        the raw gRPC response spread at the top level (not nested under `data`).
        No request body is read.
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registration options returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  status: { type: integer }
                  options:
                    type: string
                    description: JSON-encoded PublicKeyCredentialCreationOptions
        "401":
          description: Unauthorized

  /api/v1/webauthn-verify-registration:
    post:
      summary: Verify WebAuthn registration
      description: Verifies the attestation response and saves the credential for the authenticated user.
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  description: RegistrationResponseJSON from the browser (may include a deviceInfo field).
      responses:
        "200":
          description: Credential registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  status: { type: integer }
                  accessToken:
                    {
                      type: string,
                      description: Unused for this flow; may be empty.,
                    }
                  refresh_token:
                    {
                      type: string,
                      description: Unused for this flow; may be empty.,
                    }
        "400":
          description: Invalid request body
        "401":
          description: Unauthorized

  /api/v1/webauthn-credentials:
    get:
      summary: Get WebAuthn credentials
      description: Returns all registered passkey credentials for the authenticated user.
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Credentials retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      credentials:
                        type: array
                        items:
                          type: object
                          properties:
                            credentialID: { type: string }
                            transports: { type: array, items: { type: string } }
                            createdAt: { type: string, format: date-time }
                            lastUsed:
                              {
                                type: string,
                                format: date-time,
                                nullable: true,
                              }
                            deviceInfo: { type: object, nullable: true }
        "401":
          description: Unauthorized

  /api/v1/webauthn-credential-check:
    post:
      summary: Check if WebAuthn credentials exist for a username
      description: Returns whether at least one passkey is enrolled for the given username. Not authenticated (used on the login screen before sign-in).
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: "sameer_yadav"
      responses:
        "200":
          description: Credential check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  hasCredentials: { type: boolean, example: true }
        "400":
          description: Missing or invalid username

  /api/v1/disable-webauthn:
    delete:
      summary: Disable WebAuthn / remove passkeys
      description: >
        Removes either one credential (by `credentialId`) or all credentials
        (`disableAll: true`) for the authenticated user. Exactly one of the two
        must be provided.
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credentialId: { type: string }
                disableAll: { type: boolean }
              description: credentialId or disableAll is required.
      responses:
        "200":
          description: WebAuthn credential(s) removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "WebAuthn credential removed" }
        "400":
          description: Neither credentialId nor disableAll provided
        "401":
          description: Unauthorized
        "404":
          description: Credential not found

  /api/v1/webauthn-login-options:
    post:
      summary: Get WebAuthn login options
      description: Returns PublicKeyCredentialRequestOptions to begin passkey login. Not authenticated.
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: "sameer_yadav"
      responses:
        "200":
          description: >
            HTTP 200 in both success and failure cases; check the `success` field
            in the body to distinguish them.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      data:
                        type: object
                        description: Parsed PublicKeyCredentialRequestOptions
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      data:
                        type: object
                        properties:
                          success: { type: boolean, example: false }
                          message: { type: string }

  /api/v1/webauthn-verify-login:
    post:
      summary: Verify WebAuthn login assertion
      description: >
        Verifies the authentication response and issues a short-lived tempToken.
        Not authenticated (this is the login step itself).
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, credential]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                credential:
                  type: object
                  description: AuthenticationResponseJSON from the browser
      responses:
        "200":
          description: >
            HTTP 200 in both success and failure cases; check the `success` field
            in the body to distinguish them.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      data:
                        type: object
                        properties:
                          tempToken: { type: string }
                          verified: { type: boolean, example: true }
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      data:
                        type: object
                        properties:
                          success: { type: boolean, example: false }
                          message: { type: string }

  /api/v1/webauthn-login:
    post:
      summary: WebAuthn login (final step)
      description: >
        Exchanges a verified tempToken (from webauthn-verify-login) for the
        user's real accessToken and profile. Not authenticated via bearerAuth
        — the tempToken itself is the credential.
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempToken]
              properties:
                tempToken:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      user:
                        type: object
                        description: Full profile object (same shape as GET /profile data.user, minus tenant fields).
        "401":
          description: Missing, invalid, or expired tempToken

  /api/v1/auth/google-calendar/connect:
    get:
      summary: Get Google Calendar connect URL
      description: >
        Returns a Google OAuth consent URL (separate from the login OAuth flow)
        for connecting the authenticated user's Google Calendar, used for
        interview scheduling. The frontend opens this URL in a popup rather
        than following a redirect.
      tags: [Google Calendar]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorize URL returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      url:
                        {
                          type: string,
                          example: "https://accounts.google.com/o/oauth2/v2/auth?...",
                        }
        "401":
          description: Unauthorized

  /api/v1/auth/google-calendar/status:
    get:
      summary: Get Google Calendar connection status
      description: >
        Polled by the frontend after the connect popup closes, to learn whether
        the connect flow actually succeeded (window.opener messaging from the
        popup is unreliable due to Google's Cross-Origin-Opener-Policy header).
      tags: [Google Calendar]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      connected: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/auth/google/callback:
    get:
      summary: Google OAuth login callback
      description: >
        Callback URL that Google redirects to after login authentication. Lives
        OUTSIDE /api/v1 (mounted directly in server.ts) so it exactly matches
        the URI registered in Google Cloud Console and never needs a version
        bump. Not part of any router. On success it sets the refresh_token
        cookie (web) or appends tokens to the mobile deep link, then redirects
        the browser; on failure it redirects to the login page (web) or the
        mobile deep link with an `error` query param.
      tags: [Authentication]
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: Authorization code from Google
        - name: state
          in: query
          schema: { type: string }
          description: Echoes "mobile:<encoded redirect_uri>" when the login was initiated with platform=mobile; otherwise empty.
        - name: error
          in: query
          schema: { type: string }
          description: Present if the user cancelled or Google rejected the request.
      responses:
        "302":
          description: >
            Redirect to the web app (`{CLIENT_URL}/?oauth_success=1&access_token=...`,
            optionally with tenant_setup/tenant_picker/tenants params) or to the
            login page with an error, or — for mobile — to the hrms://
            (or exp://) deep link with the same query params.

  /api/auth/google-calendar/callback:
    get:
      summary: Google Calendar OAuth callback
      description: >
        Callback URL that Google redirects the connect popup to. Lives OUTSIDE
        /api/v1 (mounted directly in server.ts), matching the registered
        GOOGLE_CALENDAR_CALLBACK_URL. No Authorization header or session cookie
        is available here (it's a bare popup redirect) — the connecting user's
        identity is carried in a short-lived signed `state` JWT instead. Does
        not return JSON; it responds with a small HTML page that best-effort
        posts a message to `window.opener` and shows a manual close button.
      tags: [Google Calendar]
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
          description: Short-lived JWT (10m) signed by the /auth/google-calendar/connect step, carrying the userId.
        - name: error
          in: query
          schema: { type: string }
      responses:
        "200":
          description: HTML popup-result page (not JSON)
          content:
            text/html:
              schema:
                type: string
