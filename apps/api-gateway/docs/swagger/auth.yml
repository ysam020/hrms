paths:
  /api/v1/csrf-token:
    get:
      summary: Fetch CSRF token
      description: >
        Returns a CSRF token derived from the server-side secret. The token must
        be included as `X-CSRF-Token` on all state-changing requests (POST, PUT,
        DELETE). The client Axios interceptor calls this lazily on the first
        mutation and caches the result; it is invalidated on logout or 403.
      tags: [Authentication]
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string, example: "9a3f...d2" }

  /api/v1/profile:
    get:
      summary: Get authenticated user profile
      description: >
        Returns the full profile of the currently authenticated user including
        their active tenant context (`tenantId`, `tenantRole`, `dbName`) and
        whether they are in a pending-setup flow.
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string, example: "6672a2501aa931b68b091faf" }
                      email: { type: string, example: "user@example.com" }
                      username: { type: string, example: "sameer_yadav" }
                      first_name: { type: string, example: "Sameer" }
                      last_name: { type: string, example: "Yadav" }
                      role:
                        {
                          type: array,
                          items: { type: string },
                          example: ["admin"],
                        }
                      permissions: { type: array, items: { type: string } }
                      isSuperUser: { type: boolean, example: false }
                      tenantId:
                        type: string
                        nullable: true
                        example: "6672a2501aa931b68b091faf"
                        description: Active tenant ID. Null for pendingSetup users.
                      tenantRole:
                        type: string
                        nullable: true
                        enum: [owner, admin, hr, manager, employee]
                        example: "admin"
                        description: Role within the active tenant. Null for pendingSetup users.
                      dbName:
                        type: string
                        nullable: true
                        example: "hrms-acme-corp"
                        description: Active tenant database name. Null for pendingSetup users.
                      pendingSetup:
                        type: boolean
                        example: false
                        description: >
                          True if the user authenticated but has not yet created or
                          joined an organisation. A pendingSetup user can only access
                          tenant creation and payment endpoints.
                      employeeStatus: { type: string, example: "Active" }
                      designation:
                        { type: string, example: "Full Stack Developer" }
                      department: { type: string, example: "Engineering" }
                      profile_photo: { type: string, nullable: true }
                      kycStatus:
                        type: string
                        enum: [Pending, Submitted, Approved, Rejected]
                        example: "Approved"
        "401":
          description: Unauthorized

  /api/v1/refresh-token:
    post:
      summary: Refresh access token
      description: Issue a new access token using a valid refresh token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Valid refresh token
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
        "401":
          description: Invalid or expired refresh token

  /api/v1/logout:
    get:
      summary: Logout current session
      description: Invalidates the current session and clears auth cookies
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Logout successful" }
        "401":
          description: Unauthorized

  /api/v1/auth/google:
    get:
      summary: Initiate Google OAuth login
      description: >
        Redirects the user to Google's OAuth 2.0 authorization page.
        This is a browser redirect — not an AJAX endpoint.
      tags: [Authentication]
      responses:
        "302":
          description: Redirect to Google OAuth authorization page
          headers:
            Location:
              schema:
                type: string
                example: "https://accounts.google.com/o/oauth2/auth?..."

  /api/v1/auth/google/callback:
    get:
      summary: Google OAuth callback
      description: >
        Callback URL that Google redirects to after authentication.
        On success, issues JWT tokens and redirects to the application.
      tags: [Authentication]
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: Authorization code from Google
        - name: state
          in: query
          schema: { type: string }
          description: CSRF state parameter
      responses:
        "302":
          description: Redirect to dashboard on success, or login page on failure

  /api/v1/webauthn-register:
    get:
      summary: Get WebAuthn registration options
      description: Returns PublicKeyCredentialCreationOptions to begin passkey registration
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registration options returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    {
                      type: object,
                      description: "PublicKeyCredentialCreationOptions",
                    }
        "401":
          description: Unauthorized
    post:
      summary: Store WebAuthn registration options
      description: Persists the registration challenge before verification
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: PublicKeyCredentialCreationOptions from the browser
      responses:
        "200":
          description: Registration options stored successfully
        "401":
          description: Unauthorized

  /api/v1/webauthn-verify-registration:
    post:
      summary: Verify WebAuthn registration
      description: Verifies the attestation response and saves the credential
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: RegistrationResponseJSON from the browser
      responses:
        "200":
          description: Credential registered successfully
        "400":
          description: Verification failed
        "401":
          description: Unauthorized

  /api/v1/webauthn-credentials:
    get:
      summary: Get WebAuthn credentials
      description: Returns all registered passkey credentials for the authenticated user
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Credentials retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        credentialId: { type: string }
                        deviceName: { type: string }
                        createdAt: { type: string, format: date-time }
        "401":
          description: Unauthorized

  /api/v1/webauthn-credential-check:
    post:
      summary: Check if WebAuthn credential exists for email
      description: Returns whether a passkey is enrolled for the given email address
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        "200":
          description: Credential check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      hasCredential: { type: boolean, example: true }

  /api/v1/disable-webauthn:
    delete:
      summary: Disable WebAuthn / remove passkeys
      description: Removes all WebAuthn credentials for the authenticated user
      tags: [WebAuthn]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WebAuthn disabled successfully
        "401":
          description: Unauthorized

  /api/v1/webauthn-login-options:
    post:
      summary: Get WebAuthn login options
      description: Returns PublicKeyCredentialRequestOptions to begin passkey login
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        "200":
          description: Login options returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    {
                      type: object,
                      description: "PublicKeyCredentialRequestOptions",
                    }

  /api/v1/webauthn-verify-login:
    post:
      summary: Verify WebAuthn login assertion
      description: Verifies the authentication response and issues JWT tokens
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: AuthenticationResponseJSON from the browser
      responses:
        "200":
          description: Login successful, tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      refreshToken: { type: string }
        "400":
          description: Verification failed
        "401":
          description: Invalid credential

  /api/v1/webauthn-login:
    post:
      summary: WebAuthn login (combined)
      description: Combined endpoint to perform a full WebAuthn login flow
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: AuthenticationResponseJSON from the browser
      responses:
        "200":
          description: Login successful
        "401":
          description: Authentication failed
