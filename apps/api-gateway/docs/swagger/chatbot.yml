paths:
  /api/v1/chatbot/message:
    post:
      summary: Send a message to the HRMS chatbot
      description: >
        Sends a user message (plus optional recent conversation history) to
        the Ollama-backed HRMS assistant (model `qwen2.5-coder:14b` by
        default) and streams the reply as Server-Sent Events. The assistant
        is HR-scoped: for questions about the caller's own profile, leave
        balance, leave applications, attendance, salary/payslip, or company
        policies, it calls internal tools to fetch real data (never
        fabricates values) before answering. It will not reveal another
        employee's personal data, and refuses off-topic (non-HR) questions
        with a fixed message.


        Request validation (message required, non-empty, max 1000 chars)
        happens before SSE headers are sent, so validation failures still
        return plain JSON with `400`. Once validation passes, the response
        switches to `text/event-stream` and cannot report errors via HTTP
        status — mid-stream failures (e.g. Ollama unreachable/timed out)
        are instead sent as a final `{"error": "..."}` SSE event.


        Rate-limited to 20 requests per minute per client (Redis-backed
        limiter, shared across gateway replicas) to bound LLM cost; exceeding
        it returns `429`.
      tags: [Chatbot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: The user's message (required, non-empty, max 1000 characters)
                  example: "What is my leave balance?"
                  maxLength: 1000
                history:
                  type: array
                  description: >
                    Prior turns for conversation context. Only the last 10
                    entries are used; entries missing a valid `role`
                    ("user"/"assistant") or non-empty string `content` are
                    dropped.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                        example: "user"
                      content:
                        type: string
                        example: "How many paid leaves do I have left?"
      responses:
        "200":
          description: >
            SSE stream of chatbot response tokens. Content-Type is
            `text/event-stream`. Each line is a `data: <json>` event.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Newline-delimited SSE events. Each event is one of:

                  - `data: {"token": "..."}` — next response token

                  - `data: {"done": true}` — stream complete

                  - `data: {"error": "..."}` — error during streaming (e.g.
                  Ollama unavailable or timed out)
              example: |
                data: {"token":"You"}
                data: {"token":" have"}
                data: {"token":" 9"}
                data: {"token":" paid"}
                data: {"token":" leaves"}
                data: {"token":" remaining."}
                data: {"done":true}
        "400":
          description: Validation error (message missing/empty or exceeds 1000 characters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Message is required" }
        "401":
          description: Unauthorized, or the authenticated user no longer exists
        "429":
          description: Rate limit exceeded (max 20 requests/minute)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "Too many requests, please try again later",
                    }
