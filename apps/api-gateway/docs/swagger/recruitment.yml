paths:
  # ── Public careers page (no authentication — see publicRecruitmentRouter) ──

  /api/v1/public/careers/{slug}:
    get:
      summary: List published job openings on a tenant's public careers page
      description: >-
        Unauthenticated endpoint used by the public careers page. The tenant
        is resolved from the `slug` path param (resolvePublicTenant
        middleware), not a JWT. Always returns only `Active` openings unless
        an explicit `status` query param is supplied (up to 100 results,
        page 1 only).
      tags: [Careers Page]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
          example: "acme-corp"
        - name: status
          in: query
          required: false
          schema: { type: string }
          example: "Active"
      responses:
        "200":
          description: Job openings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        jobTitle: { type: string, example: "Backend Developer" }
                        jobDescription: { type: string }
                        requiredSkills: { type: string }
                        experience: { type: string }
                        applicationDeadline: { type: string, format: date-time }
                        numberOfVacancies: { type: integer }
                        status: { type: string, example: "Active" }
        "404":
          description: Tenant not found for the given slug

  /api/v1/public/careers/{slug}/job/{id}:
    get:
      summary: Get a single published job opening
      description: >-
        Unauthenticated. Returns 404 if the job opening's status is anything
        other than `Active` (expired/deleted openings are never exposed on
        the public apply page, even via a stale/guessed link).
      tags: [Careers Page]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job opening details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      jobTitle: { type: string }
                      jobDescription: { type: string }
                      requiredSkills: { type: string }
                      experience: { type: string }
                      budget: { type: array, items: { type: number } }
                      status: { type: string }
        "404":
          description: Job opening not found, or no longer accepting applications

  /api/v1/public/careers/{slug}/resume-upload-url:
    post:
      summary: Get a pre-signed S3 URL to upload a candidate's resume
      description: >-
        Unauthenticated. Returns a short-lived (5 minute) pre-signed PUT URL
        for uploading a resume before submitting the application via
        apply-for-job. Only `application/pdf` is accepted; the returned
        `fileUrl` must be passed back as `resume` in the apply-for-job call.
      tags: [Careers Page]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, fileType]
              properties:
                fileName: { type: string, example: "resume.pdf" }
                fileType: { type: string, example: "application/pdf" }
      responses:
        "200":
          description: Pre-signed upload URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Pre-signed URL generated" }
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        description: Pre-signed PUT URL to upload the file to
                      fileUrl:
                        type: string
                        format: uri
                        description: Public S3 URL to send back as `resume`
        "400":
          description: fileName/fileType missing, or not a PDF

  /api/v1/apply-for-job/{slug}:
    post:
      summary: Submit a job application
      description: >-
        Unauthenticated candidate application submission. `resume` must be a
        URL previously obtained from resume-upload-url, scoped to this
        tenant's own job_applications/ S3 prefix — any other value is
        rejected as an invalid resume upload.
      tags: [Careers Page]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobTitleId, name, email, mobile]
              properties:
                jobTitleId: { type: string }
                jobTitle:
                  type: string
                  description: Fallback used as jobTitleId if jobTitleId is omitted
                name: { type: string, example: "John Doe" }
                email:
                  { type: string, format: email, example: "john@example.com" }
                mobile: { type: string, example: "+91 9876543210" }
                aadharNo: { type: string }
                resume:
                  type: string
                  format: uri
                  description: fileUrl returned by resume-upload-url
      responses:
        "200":
          description: Application submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      example: "Application submitted successfully",
                    }
        "400":
          description: Invalid resume upload, or invalid application data

  # ── Job openings (authenticated) ────────────────────────────────────────────

  /api/v1/view-job-openings:
    get:
      summary: List job openings
      description: >-
        Returns job openings for the tenant, paginated, with optional status
        and search filters.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
          example: "Active"
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Job openings retrieved
        "401":
          description: Unauthorized

  /api/v1/view-job-opening/{id}:
    get:
      summary: Get a specific job opening
      description: Returns details of a single job opening by id.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job opening details retrieved
        "401":
          description: Unauthorized
        "404":
          description: Job opening not found

  /api/v1/add-job-opening:
    post:
      summary: Create a job opening
      description: >-
        Owner/superuser only. Creates a new job opening; `pipelineTemplateId`
        is snapshotted onto every application submitted against this opening
        so interview-pipeline stage validation stays fixed even if the
        template is edited later.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobTitle: { type: string, example: "Backend Developer" }
                jobDescription: { type: string }
                requiredSkills: { type: string, example: "Node.js, MongoDB" }
                experience: { type: string, example: "3" }
                hiringManager: { type: string }
                applicationDeadline: { type: string, format: date-time }
                budget:
                  type: array
                  items: { type: number }
                  example: [8, 12]
                numberOfVacancies: { type: integer, example: 2 }
                jobStatus:
                  type: string
                  example: "Active"
                  description: Defaults to "Active" if omitted
                createdBy: { type: string }
                pipelineTemplateId: { type: string }
                visibility:
                  type: string
                  enum: [internal, external]
                  default: external
      responses:
        "200":
          description: Job opening created
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/superuser only

  /api/v1/edit-job-opening/{_id}:
    put:
      summary: Edit a job opening
      description: Owner or admin only. Updates an existing job opening's fields.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobTitle: { type: string }
                jobDescription: { type: string }
                requiredSkills: { type: string }
                experience: { type: string }
                hiringManager: { type: string }
                applicationDeadline: { type: string, format: date-time }
                budget: { type: array, items: { type: number } }
                numberOfVacancies: { type: integer }
                jobStatus: { type: string }
                pipelineTemplateId: { type: string }
                visibility: { type: string, enum: [internal, external] }
      responses:
        "200":
          description: Job opening updated
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only

  /api/v1/delete-job-opening/{_id}:
    delete:
      summary: Delete a job opening
      description: Owner or admin only. Removes a job opening.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job opening deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only

  /api/v1/bulk-delete-job-openings:
    put:
      summary: Bulk delete job openings
      description: >-
        Owner or admin only. Deletes multiple job openings by id; each
        deletion is attempted independently (Promise.allSettled) so one
        failure doesn't block the rest — response reports succeeded and
        failed ids separately.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 200
      responses:
        "200":
          description: Bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "3 job opening(s) deleted" }
                  data:
                    type: object
                    properties:
                      succeeded: { type: array, items: { type: string } }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            message: { type: string }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only

  /api/v1/get-job-titles:
    get:
      summary: Get all job titles
      description: >-
        Returns every job opening (no status filter, large page limit) for
        populating job-title pickers elsewhere in the app. Requires an
        authenticated tenant session (via the recruitment router's
        subscription guard) but no specific role.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job titles retrieved
        "401":
          description: Unauthorized

  # ── Applications ─────────────────────────────────────────────────────────────

  /api/v1/view-applications/{id}:
    get:
      summary: View applications for a job opening
      description: >-
        Owner/admin only. Returns candidates who applied for the given job
        opening id, paginated with a large default page size, merged with
        interviews/aadharNo/reason fields (stripped by the gRPC proto)
        fetched directly from the DB.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Job opening id
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Applications retrieved
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only

  /api/v1/resume-view-url:
    post:
      summary: Get a pre-signed URL to view an applicant's resume
      description: >-
        Owner/admin only. The S3 bucket has no public read access, so a
        stored resume URL 403s if loaded directly — this mints a 5-minute
        pre-signed GET URL instead. Authorization is tenant-based: the key
        embeds the owning tenant id, which must match the caller's own
        tenantId.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileUrl]
              properties:
                fileUrl: { type: string, format: uri }
      responses:
        "200":
          description: Pre-signed view URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "Pre-signed view URL generated" }
                  data:
                    type: object
                    properties:
                      url: { type: string, format: uri }
        "400":
          description: fileUrl missing or invalid
        "401":
          description: Unauthorized
        "403":
          description: Not this tenant's file, or path traversal attempt

  /api/v1/update-candidate-status:
    put:
      summary: Update candidate application status
      description: >-
        Owner/admin only. Moves a candidate through the recruitment pipeline
        (legacy `interviews`-array flow). Shares the UpdateStatusRequest
        proto message with the resignation RPCs.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: { type: string, description: Application id }
                status: { type: string, example: "Round 1 Cleared" }
                remarks: { type: string }
                interviewRound: { type: integer }
                feedback: { type: string }
      responses:
        "200":
          description: Status updated
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only

  /api/v1/hire-candidate:
    put:
      summary: Hire a candidate
      description: >-
        Owner/admin only. Marks the application status "Hired". On success,
        best-effort generates an offer-letter PDF and emails it to the
        candidate — a PDF/email failure is logged but never fails the hire
        response itself.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Application id }
                remarks: { type: string }
                salary: { type: string }
                joining_date: { type: string, format: date }
                reference_by: { type: string }
                components:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      amount: { type: number }
      responses:
        "200":
          description: Candidate hired
        "400":
          description: >-
            Cannot hire — e.g. no Cleared interview round, or already
            Hired/Rejected
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only

  /api/v1/reject-application:
    put:
      summary: Reject a job application
      description: Owner/admin only. Rejects a candidate's application.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Application id }
                remarks: { type: string }
                reason:
                  type: string
                  description: Accepted alias for remarks
      responses:
        "200":
          description: Application rejected
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only

  /api/v1/update-assigned-official-email:
    put:
      summary: Record the official email provisioned for a hire
      description: >-
        Owner/admin only. Lets HR/IT record the company email being
        provisioned for a hired candidate, before that person's first login,
        so join-request approval can match by exact email instead of
        guessing from name similarity. Only allowed once the application
        status is "Hired".
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Application id }
                assignedOfficialEmail: { type: string, format: email }
      responses:
        "200":
          description: Assigned official email updated
        "400":
          description: Missing id, or application isn't Hired yet
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only
        "404":
          description: Application not found

  # ── Interview scheduling ─────────────────────────────────────────────────────

  /api/v1/schedule-interview:
    put:
      summary: Schedule an interview round
      description: >-
        Owner/admin only. Upserts by roundNumber (not append-only) so
        `interviews.length` always equals the number of distinct rounds.
        Creates a real Google Calendar event with a Meet link on the
        scheduler's own connected calendar unless a manual meetLink is
        supplied; enforces the tenant's configured max interview rounds and
        that each round starts after the previous round's interview ends.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_id, interviewStartTime, interviewEndTime]
              properties:
                _id: { type: string, description: Application id }
                roundNumber: { type: integer, default: 1 }
                interviewStartTime:
                  type: string
                  description: "Format: YYYYMMDDTHHmmss"
                  example: "20260810T100000"
                interviewEndTime:
                  type: string
                  example: "20260810T110000"
                interviewer:
                  type: string
                  description: Interviewer's username
                meetLink:
                  type: string
                  format: uri
                  description: Manual meeting link; skips Google Calendar creation
      responses:
        "200":
          description: Interview scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      example: "Interview scheduled successfully",
                    }
                  data:
                    type: object
                    properties:
                      meetLink: { type: string, nullable: true }
        "400":
          description: >-
            Invalid/overlapping interview time, tenant round limit exceeded,
            candidate already Hired/Rejected, or calendar not connected
            (code CALENDAR_NOT_CONNECTED)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin only
        "404":
          description: Application not found

  /api/v1/reschedule-interview:
    put:
      summary: Reschedule an interview round
      description: >-
        Superuser/owner only. Same scheduling rules as schedule-interview;
        additionally rejects rescheduling a round already marked
        interviewConducted.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_id, roundNumber, interviewStartTime, interviewEndTime]
              properties:
                _id: { type: string, description: Application id }
                roundNumber: { type: integer }
                interviewStartTime: { type: string, example: "20260810T140000" }
                interviewEndTime: { type: string, example: "20260810T150000" }
                interviewer: { type: string }
                meetLink: { type: string, format: uri }
      responses:
        "200":
          description: Interview rescheduled
        "400":
          description: >-
            roundNumber missing, round already conducted, invalid/overlapping
            time, or tenant round limit exceeded
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/superuser only
        "404":
          description: Application not found

  /api/v1/reassign-interviewer:
    put:
      summary: Reassign the interviewer for a round
      description: >-
        Superuser/owner only. Rejects reassigning a round already marked
        interviewConducted.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_id, interviewRound, interviewer]
              properties:
                _id: { type: string, description: Application id }
                interviewRound: { type: integer }
                interviewer:
                  { type: string, description: New interviewer's username }
      responses:
        "200":
          description: Interviewer reassigned
        "400":
          description: Round already conducted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/superuser only
        "404":
          description: Application or interview round not found

  /api/v1/get-interviewer-list:
    get:
      summary: Get list of eligible interviewers
      description: >-
        Returns users who are superusers or hold the
        `JobOpenings:take_interview` permission.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Interviewer list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        username: { type: string }
                        name: { type: string }
                        email: { type: string }
        "401":
          description: Unauthorized

  /api/v1/job-openings-insights:
    get:
      summary: Job openings insights
      description: >-
        Owner/admin/HR only. Returns aggregate analytics — overview,
        applications-by-status, top-performing jobs, experience/budget
        breakdowns, deadline tracking, hiring-manager leaderboard, monthly
        posting trends, and actionable insights.
      tags: [Recruitment]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insights retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "Job opening insights fetched" }
                  data:
                    type: object
                    properties:
                      overview:
                        type: object
                        properties:
                          activeJobOpenings: { type: integer }
                          totalJobOpenings: { type: integer }
                          totalApplications: { type: integer }
                          hiringSuccessRate: { type: integer }
                          averageApplicationsPerJob: { type: integer }
                      applications: { type: object }
                      topPerformingJobs:
                        { type: array, items: { type: object } }
                      experienceRequirements: { type: object }
                      budgetAnalysis: { type: object }
                      deadlines: { type: object }
                      hiringManagers: { type: object }
                      trends: { type: object }
                      actionableInsights:
                        { type: array, items: { type: object } }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin/HR only

  # ── Resignations ─────────────────────────────────────────────────────────────

  /api/v1/add-resignation:
    post:
      summary: Submit resignation
      description: Employee submits their own resignation request.
      tags: [Resignation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resignationDate:
                  type: string
                  format: date-time
                  description: Defaults to now() if omitted
                lastDate: { type: string, format: date }
                reason: { type: string, maxLength: 2000 }
                overallJobSatisfaction:
                  oneOf:
                    - { type: string }
                    - { type: number }
                suggestions: { type: string, maxLength: 2000 }
                exitType:
                  type: string
                  enum: [voluntary, termination, absconding, mutual]
                  default: voluntary
      responses:
        "200":
          description: Resignation submitted
        "401":
          description: Unauthorized

  /api/v1/my-resignation:
    get:
      summary: Get the caller's own resignation
      description: Returns the authenticated employee's most recent resignation, if any.
      tags: [Resignation]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resignation retrieved
        "401":
          description: Unauthorized

  /api/v1/view-resignations:
    get:
      summary: View resignations
      description: >-
        Employees see only their own resignations; owner/admin/HR can pass
        `userId` to view another employee's, or omit it to see all.
      tags: [Resignation]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string }
          description: Privileged callers only
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Resignations retrieved
        "401":
          description: Unauthorized

  /api/v1/approve-resignation/{_id}:
    put:
      summary: Approve a resignation
      description: >-
        No fixed role guard — resolved by the Approval Chain (the
        requester's reporting manager by default, or an owner/admin/
        superuser override). May forward to the next approver instead of
        finalizing, depending on the tenant's approval chain configuration.
      tags: [Resignation]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comments: { type: string }
                lastWorkingDay: { type: string, format: date }
                noticePeriodWaived: { type: boolean }
                buyoutAmount: { type: number }
                relievedFromDutyOn: { type: string, format: date }
      responses:
        "200":
          description: Resignation approved (or forwarded to the next approver)
        "401":
          description: Unauthorized
        "403":
          description: No active tenant, or not authorized to act on this approval

  /api/v1/reject-resignation/{_id}:
    put:
      summary: Reject a resignation
      description: >-
        Same approval-chain resolution as approve-resignation, with
        `outcome: rejected`.
      tags: [Resignation]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comments: { type: string }
                rejectionReason: { type: string }
      responses:
        "200":
          description: Resignation rejected (or forwarded to the next approver)
        "401":
          description: Unauthorized
        "403":
          description: No active tenant, or not authorized to act on this approval

  /api/v1/bulk-approve-resignations:
    put:
      summary: Bulk approve resignations
      description: >-
        Loops actOnApprovalForEntity per id; each id succeeds/fails
        independently and both lists are returned.
      tags: [Resignation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 200
                comments: { type: string, maxLength: 2000 }
                lastWorkingDay: { type: string, format: date }
                noticePeriodWaived: { type: boolean }
                buyoutAmount: { type: number }
                relievedFromDutyOn: { type: string, format: date }
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "2 resignation(s) approved" }
                  data:
                    type: object
                    properties:
                      succeeded: { type: array, items: { type: string } }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            message: { type: string }
        "401":
          description: Unauthorized
        "403":
          description: No active tenant

  /api/v1/bulk-reject-resignations:
    put:
      summary: Bulk reject resignations
      description: >-
        Loops actOnApprovalForEntity per id with outcome rejected; each id
        succeeds/fails independently.
      tags: [Resignation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 200
                comments: { type: string, maxLength: 2000 }
                rejectionReason: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Bulk reject result
        "401":
          description: Unauthorized
        "403":
          description: No active tenant

  /api/v1/withdraw-resignation/{_id}:
    put:
      summary: Withdraw a resignation
      description: >-
        The resignation's own owner, or a superuser acting on their behalf,
        may withdraw it.
      tags: [Resignation]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resignation withdrawn
        "401":
          description: Unauthorized
        "403":
          description: Not the resignation's owner and not a superuser
        "404":
          description: Resignation not found

  /api/v1/update-resignation/{_id}:
    put:
      summary: Update resignation offboarding checkpoints
      description: >-
        Superuser/owner only. Records one of two offboarding checkpoints —
        "Assets Returned" or "FnF Done" (full-and-final settlement) — against
        a resignation.
      tags: [Resignation]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, value]
              properties:
                status:
                  type: string
                  enum: ["Assets Returned", "FnF Done"]
                value: { type: boolean }
      responses:
        "200":
          description: Resignation updated
        "400":
          description: Unrecognized status value
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/superuser only
        "404":
          description: Resignation not found

  /api/v1/add-exit-feedback:
    post:
      summary: Submit exit interview feedback
      description: >-
        Employee submits exit feedback against their own most recent Approved
        resignation. Can only be submitted once (checked via
        qualityOfCommunication already being set).
      tags: [Resignation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overall_job_satisfaction: { type: number }
                quality_of_communication: { type: string }
                support_from_manager: { type: string }
                appreciation_for_work: { type: string }
                collaboration_within_the_team: { type: string }
                overall_company_culture: { type: string }
                suggestions: { type: string }
      responses:
        "201":
          description: Exit feedback submitted
        "400":
          description: >-
            No approved resignation on file, or feedback already submitted
        "401":
          description: Unauthorized

  /api/v1/resignation-insights:
    get:
      summary: Resignation insights
      description: >-
        Owner/admin/HR only. Returns resignation counts by status, approval
        rate, and departures due in the next 30 days.
      tags: [Resignation]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insights retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      overview:
                        type: object
                        properties:
                          total: { type: integer }
                          submitted: { type: integer }
                          approved: { type: integer }
                          rejected: { type: integer }
                          withdrawn: { type: integer }
                          approvalRate: { type: integer }
                      upcomingDepartures:
                        type: array
                        items:
                          type: object
                          properties:
                            userId: { type: string }
                            lastWorkingDay: { type: string, format: date-time }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin/HR only
