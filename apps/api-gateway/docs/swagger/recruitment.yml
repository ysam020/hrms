            No approved resignation on file, or feedback already submitted
        "401":
          description: Unauthorized
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  /api/v1/resignation-insights:
    get:
      operationId: resignationInsights
      summary: Resignation insights
      description: >-
        Owner/admin/HR only. Returns resignation counts by status, approval
        rate, and departures due in the next 30 days.


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription); owner, admin, HR or superuser only (requireHrPrivileged).
      tags: [Resignation]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Insights retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      overview:
                        type: object
                        properties:
                          total: { type: integer }
                          submitted: { type: integer }
                          approved: { type: integer }
                          rejected: { type: integer }
                          withdrawn: { type: integer }
                          approvalRate: { type: integer }
                      upcomingDepartures:
                        type: array
                        items:
                          type: object
                          properties:
                            userId: { type: string }
                            lastWorkingDay: { type: string, format: date-time }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — owner/admin/HR only
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

components:
  schemas:
    JobOpeningInput:
      type: object
      description: >-
        Body for add-job-opening / edit-job-opening. The listed core fields
        are read by the handler; the rest are validated and normalised by
        validateJobOpening (services/recruitmentForms.ts). Validation failures
        return 400 with `message` and the offending `field`. JSON-valued
        fields (locations, applicationForm, screeningQuestions) may also be
        sent as JSON strings.
      properties:
        jobTitle: { type: string, example: "Backend Developer" }
        jobDescription: { type: string }
        requiredSkills: { type: string, example: "Node.js, MongoDB" }
        preferredSkills: { type: string, maxLength: 1000 }
        hiringManager: { type: string }
        recruiter: { type: string, maxLength: 120 }
        department: { type: string, maxLength: 120 }
        numberOfVacancies: { type: integer, example: 2 }
        jobStatus:
          type: string
          example: "Active"
          description: Defaults to "Active" on create if omitted.
        pipelineTemplateId: { type: string }
        employmentType:
          type: string
          enum: [full_time, part_time, contract, internship, temporary, other]
          description: Required on create.
        workplaceType:
          type: string
          enum: [onsite, hybrid, remote]
          description: Required on create.
        visibility:
          type: string
          enum: [external, internal, both]
          default: external
          description: internal-only openings never appear on the public careers page.
        locations:
          type: array
          maxItems: 10
          description: At least one (each with city and country) for onsite/hybrid.
          items:
            type: object
            properties:
              country: { type: string, maxLength: 80 }
              state: { type: string, maxLength: 80 }
              city: { type: string, maxLength: 80 }
              office: { type: string, maxLength: 200 }
        remoteScope:
          type: string
          enum: [anywhere, country, regions]
          description: Remote openings only; defaults to anywhere.
        remoteRegions:
          type: array
          maxItems: 30
          description: Exactly one for remoteScope=country, at least one for regions.
          items: { type: string, maxLength: 80 }
        experience:
          type: number
          minimum: 0
          maximum: 60
          description: Minimum years of experience (required).
          example: 3
        experienceMax:
          {
            type: number,
            minimum: 0,
            maximum: 60,
            description: Must be >= experience.,
          }
        budget:
          type: array
          description: "[min, max] in LPA; both or neither, min <= max."
          items: { type: number, minimum: 0 }
          example: [8, 12]
        budgetDisclosed:
          {
            type: boolean,
            description: Whether the budget is shown on the careers page.,
          }
        jobPostingDate:
          { type: string, format: date, description: Not in the future. }
        applicationDeadline:
          type: string
          format: date
          description: Required; not before jobPostingDate, and a new or changed deadline can't be in the past.
        minQualification: { type: string, maxLength: 200 }
        responsibilities: { type: string, maxLength: 10000 }
        qualifications: { type: string, maxLength: 10000 }
        applicationForm:
          type: object
          description: Which candidate fields the careers form shows.
          properties:
            fields:
              type: object
              description: Profile field key (see CareerApplicationData.profile) -> mode.
              additionalProperties:
                { type: string, enum: [hidden, optional, required] }
            resume:
              { type: string, enum: [optional, required], default: required }
            coverLetter:
              {
                type: string,
                enum: [hidden, optional, required],
                default: hidden,
              }
        screeningQuestions:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string, maxLength: 300 }
              type:
                {
                  type: string,
                  enum:
                    [
                      short_text,
                      long_text,
                      select,
                      multi_select,
                      yes_no,
                      number,
                      date,
                    ],
                }
              required: { type: boolean }
              options: { type: array, items: { type: string } }
              helpText: { type: string }
              order: { type: integer }
    JobOpeningValidationError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Choose an employment type." }
        field: { type: string, example: "employmentType" }
