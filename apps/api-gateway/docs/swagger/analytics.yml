paths:
  /api/v1/get-employment-type-breakdown:
    get:
      summary: Employment type breakdown
      description: Returns employee count grouped by employment type (full-time, part-time, contract, etc.)
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employment type breakdown retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, example: "full-time" }
                        count: { type: integer, example: 30 }
                        percentage: { type: number, example: 66.7 }
        "401":
          description: Unauthorized

  /api/v1/get-employee-status-distribution:
    get:
      summary: Employee status distribution
      description: Returns employee count grouped by status (active, on leave, resigned, etc.)
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status distribution retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { type: string }
                        count: { type: integer }
        "401":
          description: Unauthorized

  /api/v1/get-employee-departments:
    get:
      summary: Employee count by department
      description: Returns the number of employees in each department
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Department breakdown retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        department: { type: string, example: "Engineering" }
                        count: { type: integer, example: 15 }
        "401":
          description: Unauthorized

  /api/v1/get-employee-designations:
    get:
      summary: Employee count by designation
      description: Returns the number of employees at each designation/role
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
