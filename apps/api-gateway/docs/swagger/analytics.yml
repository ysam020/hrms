  /api/v1/get-age-distribution:
    get:
      summary: Employee age distribution
      description: Returns employee count grouped by age bands
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Age distribution retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ageBand: { type: string, example: "25-30" }
                        count: { type: integer }
        "401":
          description: Unauthorized

  /api/v1/get-joining-data:
    get:
      summary: Employee joining data over time
      description: Returns monthly/yearly employee joining counts
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [monthly, yearly], default: "monthly" }
      responses:
        "200":
          description: Joining trend data retrieved
        "401":
          description: Unauthorized

  /api/v1/get-tenure-distribution:
    get:
      summary: Employee tenure distribution
      description: Returns employee count grouped by years of service bands
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
