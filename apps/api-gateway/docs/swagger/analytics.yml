                      type: object
                      properties:
                        label: { type: string, example: "Sick Leave" }
                        value: { type: number, example: 14 }
                        date: { type: string }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: Forbidden — requires owner, admin, or hr role
        "429":
          description: Too many requests

