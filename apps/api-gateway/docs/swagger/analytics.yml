paths:
  /api/v1/analytics/dashboard:
    get:
      summary: Dashboard statistics
      description: >
        Returns aggregated top-line dashboard statistics (total employees, present today,
        on leave, pending approvals, open job positions, average attendance rate) for a
        given period/department. Proxies to the `GetDashboardStats` RPC on the
        analytics-service. Requires role owner, admin, or hr. Rate-limited to 500
        requests/minute per client (Redis-backed).
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, default: "month" }
          example: "month"
          description: Reporting period passed through to the analytics service.
        - name: department
          in: query
          required: false
          schema: { type: string }
          example: "Engineering"
      responses:
        "200":
          description: Dashboard statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "" }
                  status: { type: integer, example: 200 }
                  totalEmployees: { type: integer, example: 128 }
                  presentToday: { type: integer, example: 110 }
                  onLeave: { type: integer, example: 6 }
                  pendingApprovals: { type: integer, example: 4 }
                  openJobPositions: { type: integer, example: 9 }
                  avgAttendanceRate: { type: number, example: 91.5 }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: Forbidden — requires owner, admin, or hr role
        "429":
          description: Too many requests

  /api/v1/analytics/headcount:
    get:
      summary: Headcount metrics
      description: >
        Returns headcount metrics for a department/period. Requires role owner, admin, or
        hr. NOTE — the handler calls a `GetHeadcount` RPC on the analytics-service, but the
        current analytics.proto/analytics-service only implements GetDashboardStats,
        GetAttendanceAnalytics, GetLeaveAnalytics, GetRecruitmentAnalytics,
        GetSalaryAnalytics, and GetEmployeeGrowth — there is no GetHeadcount method. This
        endpoint is expected to fail (UNIMPLEMENTED / 500) against the current service
        until either the proto is extended or the handler is pointed at GetEmployeeGrowth.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: department
          in: query
          required: false
          schema: { type: string }
        - name: period
          in: query
          required: false
          schema: { type: string, default: "current" }
      responses:
        "200":
          description: Headcount data retrieved (see description — currently unimplemented server-side)
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: Forbidden — requires owner, admin, or hr role
        "429":
          description: Too many requests
        "501":
          description: Not Implemented — RPC method does not exist on analytics-service

  /api/v1/analytics/attendance:
    get:
      summary: Attendance analytics
      description: >
        Returns attendance metric series (label/value/date points) for a month, year, and
        optional department. Proxies to the `GetAttendanceAnalytics` RPC. Requires role
        owner, admin, or hr.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string }
        - name: year
          in: query
          required: false
          schema: { type: string }
        - name: department
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Attendance analytics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  status: { type: integer, example: 200 }
                  total: { type: number, example: 91.2 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string, example: "2026-06" }
                        value: { type: number, example: 92.3 }
                        date: { type: string, example: "2026-06-01" }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: Forbidden — requires owner, admin, or hr role
        "429":
          description: Too many requests

  /api/v1/analytics/leave:
    get:
      summary: Leave analytics
      description: >
