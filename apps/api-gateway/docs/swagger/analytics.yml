  /api/v1/get-headcount-growth:
    get:
      summary: Headcount growth over time
      description: Returns net headcount change per period
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            {
              type: string,
              enum: [monthly, quarterly, yearly],
              default: "monthly",
            }
        - name: year
          in: query
          schema: { type: integer, example: 2026 }
      responses:
        "200":
          description: Headcount growth data retrieved
        "401":
          description: Unauthorized

  /api/v1/get-leave-approval-rate:
