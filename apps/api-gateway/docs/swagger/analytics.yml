            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      approvalRate: { type: number, example: 87.5 }
                      total: { type: integer }
                      approved: { type: integer }
                      rejected: { type: integer }
        "401":
