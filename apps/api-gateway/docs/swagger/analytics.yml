          in: query
          required: false
          schema: { type: string }
        - name: year
          in: query
          required: false
          schema: { type: string }
        - name: department
          in: query
          required: false
          schema: { type: string }
        - name: leaveType
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Leave analytics retrieved
