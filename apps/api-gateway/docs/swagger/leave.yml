paths:
  /api/v1/add-leave:
    post:
      operationId: addLeave
      summary: Apply for leave
      description: >-
        Submits a leave application for the authenticated employee.
        leaveType may be omitted — leave-service defaults to Paid Leave,
        falling back to Leave Without Pay if the paid-leave balance is 0.
        unit "half_day" requires session (first_half/second_half); unit
        "short_leave" requires shortLeaveHours (0.5-7). Every application is
        instantiated against the tenant's Approval Chain for the "leave"
        module at apply time.


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription).
      tags: [Leave]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                  example: "2026-04-10"
                to:
                  type: string
                  pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                  example: "2026-04-12"
                leaveType:
                  type: string
                  example: "Paid Leave"
                  description: Omit to let leave-service auto-resolve.
                reason: { type: string, example: "Family vacation" }
                sick_leave: { type: boolean, default: false }
                medicalCertificate:
                  type: string
                  example: "https://cdn.example.com/certs/abc.pdf"
                unit:
                  type: string
                  enum: [full_day, half_day, short_leave]
                  default: full_day
                session:
                  type: string
                  enum: [first_half, second_half]
                  description: Required when unit is half_day.
                shortLeaveHours:
                  type: number
                  minimum: 0.5
                  maximum: 7
                  description: Required when unit is short_leave.
      responses:
        "200":
          description: Leave application submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "Leave applied successfully" }
                  data:
                    type: object
                    description: The created LeaveApplication
        "400":
          description: Insufficient leave balance, invalid date range, or missing session/shortLeaveHours for the chosen unit
        "401":
          description: Unauthorized
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  /api/v1/get-leave-applications:
    get:
      operationId: getLeaveApplications
      summary: Get leave applications
      description: >-
        Employees see only their own applications. Owners/admins/HR/
        superusers (privileged) may pass userId to view a specific user's
        applications, or search to look up a user by username. Each record
        is enriched with username/firstName/lastName. Paginated.


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription).
      tags: [Leave]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: userId
          in: query
          schema: { type: string }
          description: Privileged callers only.
        - name: search
          in: query
          schema: { type: string }
          description: Matches username (case-insensitive); privileged callers only.
        - name: status
          in: query
          schema: { type: string }
          example: "Pending"
        - name: futureOnly
          in: query
          schema: { type: boolean }
          description: When "true", only applications whose end date is today or later.
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Leave applications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "Leave applications fetched" }
                  total: { type: integer, example: 5 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        userId: { type: string }
                        username: { type: string }
                        firstName: { type: string }
                        lastName: { type: string }
                        leaveType: { type: string }
                        from: { type: string, format: date-time }
                        to: { type: string, format: date-time }
                        days: { type: number }
                        reason: { type: string }
                        status:
                          type: string
                          example: "Pending"
                        unit: { type: string }
                        session: { type: string }
                        shortLeaveHours: { type: number }
        "401":
          description: Unauthorized
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  /api/v1/update-leave-status:
    put:
      operationId: updateLeaveStatus
      summary: Approve, reject, or cancel a leave application
      description: >-
        approve/reject are recorded against the leave's Approval Chain
        instance (actOnApprovalForEntity) — only the resolved approver, or an
        owner/admin/superuser, may act, and a multi-step chain forwards to
        the next approver instead of finalizing immediately. cancel
        immediately withdraws a still-Pending application; an already-
        Approved one instead has cancellation requested and routed through
        the same Approval Chain. A privileged caller may cancel on another
        user's behalf by omitting the ownership check.


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription).
      tags: [Leave]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveId, action]
              properties:
                leaveId: { type: string, example: "665f1c2e8a1b2c0012a3b456" }
                action:
                  type: string
                  enum: [approve, reject, cancel]
                  example: "approve"
                reason: { type: string, example: "Approved as requested" }
      responses:
        "200":
          description: Leave application updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    example: "Leave approved."
                  data:
                    type: object
                    description: Present for approve/reject — the approval result (isFinal, finalStatus, etc.)
        "400":
          description: Missing leaveId/action, or invalid action
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not the resolved approver and not privileged
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  /api/v1/bulk-update-leave-status:
    put:
      operationId: bulkUpdateLeaveStatus
      summary: Bulk approve or reject leave applications
      description: >-
        Approves or rejects up to 200 leave applications in one call. cancel
        is intentionally excluded — cancellation stays single-item and self-
        service. Each id is resolved and acted on independently via the same
        Approval Chain mechanism as update-leave-status, so one already-
        decided application doesn't fail the whole batch; per-id failures are
        returned in the response instead of aborting.


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription).
      tags: [Leave]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveIds, action]
              properties:
                leaveIds:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 200
                  example:
                    ["665f1c2e8a1b2c0012a3b456", "665f1c2e8a1b2c0012a3b457"]
                action:
                  type: string
                  enum: [approve, reject]
                  example: "approve"
                reason: { type: string, example: "Bulk approved" }
      responses:
        "200":
          description: Bulk action completed (see data.failed for any per-id errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "2 leave application(s) approved" }
                  data:
                    type: object
                    properties:
                      succeeded:
                        type: array
                        items: { type: string }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            message: { type: string }
        "401":
          description: Unauthorized
        "403":
          description: No active tenant
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  # The route is /get-available-paid-leaves/:userId? (optional param). OpenAPI
  # path parameters are always required, so it is documented as two paths.
  /api/v1/get-available-paid-leaves:
    get:
      operationId: getMyAvailablePaidLeaves
      summary: Get my available paid leave balance
      description: >-
        Returns the caller's own leave balance summary (same handler as
        /get-available-paid-leaves/{userId} without the userId).


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription).
      tags: [Leave]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Leave balance retrieved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveBalanceResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  /api/v1/get-available-paid-leaves/{userId}:
    get:
      operationId: getAvailablePaidLeaves
      summary: Get available paid leave balance
      description: >-
        Returns the leave balance summary for a user. userId is only honored
        for superusers (isSuperUser) looking up someone else's balance —
        everyone else always gets their own. Omit the segment entirely to
        read your own (GET /get-available-paid-leaves).


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription).
      tags: [Leave]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
          example: "665f1c2e8a1b2c0012a3b456"
          description: Superuser only; ignored for non-superusers, who always get their own balance.
      responses:
        "200":
          description: Leave balance retrieved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveBalanceResponse" }
        "401":
          description: Unauthorized
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

components:
  schemas:
    LeaveBalanceResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Leave balance fetched" }
        data:
          type: object
          properties:
            id: { type: string }
            userId: { type: string }
            accumulatedPlBeforeCurrentMonth: { type: number, example: 2 }
            balances:
              type: string
              description: JSON-encoded per-leave-type summary (available/used/carried-forward days).
