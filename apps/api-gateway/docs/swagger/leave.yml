paths:
  /api/v1/add-leave:
    post:
      summary: Apply for leave
      description: Submit a leave application for the authenticated employee
      tags: [Leave Management]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveType, startDate, endDate, reason]
              properties:
                leaveType:
                  type: string
                  enum: [paid, unpaid, sick, casual, maternity, paternity]
                  example: "paid"
                startDate: { type: string, format: date, example: "2026-04-10" }
                endDate: { type: string, format: date, example: "2026-04-12" }
                reason: { type: string, example: "Family vacation" }
                isHalfDay: { type: boolean, example: false }
      responses:
        "200":
          description: Leave application submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "Leave application submitted" }
        "400":
          description: Insufficient leave balance or invalid dates
        "401":
          description: Unauthorized

  /api/v1/get-leave-applications:
    get:
      summary: Get leave applications
      description: Returns leave applications. Employees see their own; admin/HR see all.
      tags: [Leave Management]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
          description: Filter by status
        - name: username
          in: query
          schema: { type: string }
          description: Filter by username (admin/HR only)
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Leave applications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        username: { type: string }
                        leaveType: { type: string }
                        startDate: { type: string, format: date }
                        endDate: { type: string, format: date }
                        status:
                          type: string
                          enum: [pending, approved, rejected]
                        reason: { type: string }
        "401":
          description: Unauthorized

  /api/v1/update-leave-status:
    put:
      summary: Approve or reject a leave application
      description: Admin/HR action to update the status of a leave application
      tags: [Leave Management]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveId, status]
              properties:
                leaveId: { type: string, example: "6672a2501aa931b68b091faf" }
                status:
                  type: string
                  enum: [approved, rejected]
                  example: "approved"
                remarks: { type: string, example: "Approved as requested" }
      responses:
        "200":
          description: Leave status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Leave application not found

  /api/v1/get-available-paid-leaves/{username}:
    get:
      summary: Get available paid leave balance
      description: Returns the remaining paid leave balance for a user (own or specified username for admin)
      tags: [Leave Management]
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: false
          schema: { type: string }
          example: "sameer_yadav"
          description: Username to query (optional; defaults to authenticated user)
      responses:
        "200":
          description: Available paid leaves retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      username: { type: string }
                      totalPaidLeaves: { type: integer, example: 12 }
                      usedPaidLeaves: { type: integer, example: 3 }
                      availablePaidLeaves: { type: integer, example: 9 }
        "401":
          description: Unauthorized
