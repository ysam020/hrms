  /api/v1/platform/support/tickets/{ticketId}:
    get:
      operationId: getPlatformSupportTicket
      summary: Get a ticket with its full thread (staff)
      description: >-
        Includes internal notes and internal attachments. Opening a security
        ticket records a "security_viewed" internal activity (at most once per
        agent per window).


        Access: authenticated (bearer token or `access_token` cookie); Praesto support agents only — Praesto's own organisation owner/admin/superuser or PraestoSupport:handle_tickets (requireSupportAgent).
      tags: [Platform Support]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SupportTicketId"
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Support ticket" }
                  data:
                    type: object
                    properties:
                      ticket:
                        { $ref: "#/components/schemas/StaffSupportTicket" }
                      tenant:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string }
                          name: { type: string }
                          slug: { type: string }
                          planTier: { type: string, nullable: true }
                          subscriptionStatus: { type: string, nullable: true }
                          isActive: { type: boolean }
                          createdAt: { type: string, format: date-time }
                      reporter: { $ref: "#/components/schemas/SupportPerson" }
                      assignee: { $ref: "#/components/schemas/SupportPerson" }
                      participants:
                        type: array
                        items: { $ref: "#/components/schemas/SupportPerson" }
                      duplicateOf:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string }
                          ticketNo: { type: string }
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            body: { type: string }
                            visibility:
                              { type: string, enum: [public, internal] }
                            authorType: { type: string, enum: [tenant, staff] }
                            createdAt: { type: string, format: date-time }
                            author:
                              { $ref: "#/components/schemas/SupportPerson" }
                      activities:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            type: { type: string }
                            fromValue: { type: string, nullable: true }
                            toValue: { type: string, nullable: true }
                            visibility:
                              { type: string, enum: [public, internal] }
                            actorType: { type: string }
                            createdAt: { type: string, format: date-time }
                            actor:
                              { $ref: "#/components/schemas/SupportPerson" }
                      attachments:
                        type: array
                        items:
                          { $ref: "#/components/schemas/SupportAttachment" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"
    patch:
      operationId: updateTicketAsAgent
      summary: Change a ticket's status, priority or assignee
      description: >-
        Version-guarded: send the version you read. Status changes must follow
        the staff transition table (open -> in_progress, waiting_for_tenant,
        resolved, closed; closed is final). If nothing changes the response is
        200 "Nothing changed".


        Access: authenticated (bearer token or `access_token` cookie); Praesto support agents only — Praesto's own organisation owner/admin/superuser or PraestoSupport:handle_tickets (requireSupportAgent).
      tags: [Platform Support]
      parameters:
        - $ref: "#/components/parameters/SupportTicketId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                status: { $ref: "#/components/schemas/SupportStatus" }
                priority: { $ref: "#/components/schemas/SupportPriority" }
                assigneeId:
                  type: string
                  nullable: true
                  pattern: "^[a-f0-9]{24}$"
                  description: null unassigns.
                version: { type: integer, minimum: 0 }
            example:
              {
                status: in_progress,
                assigneeId: "6650c2f1a9b3c4d5e6f70812",
                version: 3,
              }
      responses:
        "200":
          description: Ticket updated (or nothing changed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      enum: ["Ticket updated", "Nothing changed"],
                    }
                  data: { $ref: "#/components/schemas/StaffSupportTicket" }
        "400":
          description: Validation error, disallowed status transition or invalid assignee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The ticket changed since `version` was read; reload and retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  /api/v1/platform/support/tickets/{ticketId}/replies:
    post:
      operationId: replyAsAgent
      summary: Reply publicly or add an internal note
      description: >-
        visibility=public notifies the organisation and may also move the
        ticket to waiting_for_tenant, in_progress or resolved; internal notes
        are never shown to the organisation. Version-guarded.


        Access: authenticated (bearer token or `access_token` cookie); Praesto support agents only — Praesto's own organisation owner/admin/superuser or PraestoSupport:handle_tickets (requireSupportAgent).
      tags: [Platform Support]
      parameters:
        - $ref: "#/components/parameters/SupportTicketId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body, visibility, version]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                visibility: { type: string, enum: [public, internal] }
                status:
                  {
                    type: string,
                    enum: [waiting_for_tenant, in_progress, resolved],
                  }
                attachmentIds:
                  type: array
                  maxItems: 5
                  default: []
                  items: { type: string, pattern: "^[a-f0-9]{24}$" }
                version: { type: integer, minimum: 0 }
            example:
              {
                body: "We've deployed a fix — please try again.",
                visibility: public,
                status: resolved,
                version: 4,
              }
      responses:
        "201":
          description: Reply sent / Internal note added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      enum: ["Reply sent", "Internal note added"],
                    }
                  data:
                    type: object
                    properties:
                      messageId: { type: string }
                      status: { $ref: "#/components/schemas/SupportStatus" }
        "400":
          description: Validation error or the ticket is closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

  /api/v1/platform/support/tickets/{ticketId}/duplicate:
    post:
      operationId: markSupportTicketDuplicate
      summary: Close a ticket as a duplicate of another
      description: >-
        Access: authenticated (bearer token or `access_token` cookie); Praesto support agents only — Praesto's own organisation owner/admin/superuser or PraestoSupport:handle_tickets (requireSupportAgent).
      tags: [Platform Support]
