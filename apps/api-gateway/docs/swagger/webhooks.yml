paths:
  /api/v1/webhooks/endpoints:
    post:
      summary: Register a webhook endpoint
      description: >
        Admin/owner-only. Registers a tenant-configurable outgoing webhook
        endpoint that will receive HMAC-SHA256-signed HTTP POSTs
        (`X-HRMS-Signature-256` header) whenever a subscribed business event
        fires (e.g. `leave.approved`, `asset.assigned`, `ticket.created`).
        The URL must be a publicly reachable HTTPS address — private/
        loopback/link-local/cloud-metadata IPs are rejected (SSRF guard), and
        it is re-validated at actual delivery time to catch DNS rebinding.
        Max 10 endpoints per tenant; duplicate URLs are rejected with 409.
        The signing secret is returned in plaintext exactly once, here at
        creation — it is never returned again (rotate via PATCH to get a new
        one).
      tags: [Webhooks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  {
                    type: string,
                    format: uri,
                    example: "https://example.com/hrms/webhook",
                  }
                events:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    enum:
                      [
                        employee.created,
                        employee.updated,
                        employee.terminated,
                        leave.applied,
                        leave.approved,
                        leave.rejected,
                        attendance.checkin,
                        attendance.absent,
                        payroll.approved,
                        payroll.disbursed,
                        resignation.submitted,
                        resignation.approved,
                        asset.assigned,
                        asset.returned,
                        asset.retired,
                        asset.issue_reported,
                        asset.issue_updated,
                        ticket.created,
                        ticket.resolved,
                      ]
                  example: ["leave.approved", "ticket.created"]
      responses:
        "201":
          description: Webhook endpoint created — store the secret now
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      example: "Webhook endpoint created. Store the secret now — it will not be shown again.",
                    }
                  data:
                    type: object
                    properties:
                      endpointId: { type: string }
                      url: { type: string }
                      events: { type: array, items: { type: string } }
                      secret:
                        {
                          type: string,
                          example: "whsec_9f2a7c1e...",
                          description: "Plaintext signing secret — shown only this once",
                        }
        "400":
          description: Webhook URL must be a valid, publicly reachable HTTPS URL / max endpoints reached
        "403":
          description: Only admin or owner can manage webhooks
        "409":
          description: A webhook endpoint with this URL already exists
        "401":
          description: Unauthorized
    get:
      summary: List webhook endpoints
      description: >
        Admin/owner-only. Lists all registered endpoints for the tenant. The
        signing secret is never included in this response.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Endpoints retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { type: object } }
        "403":
          description: Forbidden
        "401":
          description: Unauthorized

  /api/v1/webhooks/endpoints/{endpointId}:
    patch:
      summary: Update a webhook endpoint
      description: >
        Admin/owner-only. Updates the URL, subscribed events, and/or active
        flag of an endpoint. Pass `rotate: true` to issue a new signing
        secret (returned in plaintext once, in this response only) and
        invalidate the old one.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                isActive: { type: boolean }
                rotate:
                  { type: boolean, description: "Issue a new signing secret" }
      responses:
        "200":
          description: Endpoint updated (new secret issued if rotate=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    nullable: true
                    properties:
                      secret: { type: string, example: "whsec_ab12cd34..." }
        "400":
          description: Webhook URL must be a valid, publicly reachable HTTPS URL
        "403":
          description: Forbidden
        "404":
          description: Endpoint not found
        "401":
          description: Unauthorized
    delete:
      summary: Delete a webhook endpoint
      description: >
        Admin/owner-only. Removes the endpoint and cascades deletion of its
        entire delivery history.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Endpoint deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
        "403":
          description: Forbidden
        "404":
          description: Endpoint not found
        "401":
          description: Unauthorized

  /api/v1/webhooks/endpoints/{endpointId}/deliveries:
    get:
      summary: List delivery attempts for an endpoint
      description: >
        Admin/owner-only. Paginated, immutable delivery log for a single
        endpoint — status, HTTP status code, attempt count, and any error
        for each delivery attempt. The full payload is omitted from the list
        view for privacy/performance.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, success, failed] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Deliveries retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { type: object } }
                  total: { type: integer, example: 8 }
        "403":
          description: Forbidden
        "404":
          description: Endpoint not found
        "401":
          description: Unauthorized

  /api/v1/webhooks/deliveries/{deliveryId}/retry:
    post:
      summary: Retry a failed delivery
      description: >
        Admin/owner-only. Resets a failed delivery back to "pending" and
        enqueues a single-attempt retry job for the background worker to pick
        up. Fails with 400 if the delivery already succeeded.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Delivery queued for retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
        "400":
          description: Delivery already succeeded
        "403":
          description: Forbidden
        "404":
          description: Delivery not found
        "401":
          description: Unauthorized

  /api/v1/webhooks/test:
    post:
      summary: Send a test ping to an endpoint
      description: >
        Admin/owner-only. Sends a signed `ping` event payload directly to
        the endpoint's URL (outside the normal delivery queue) to let the
        tenant verify their receiver is correctly wired up and validating
        signatures. Re-validates the URL is still safe (not private/
        metadata-range) immediately before sending, and rejects HTTP
        redirects.
      tags: [Webhooks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId]
              properties:
                endpointId:
                  { type: string, example: "66f1a2b3c4d5e6f7a8b9c0d1" }
      responses:
        "200":
          description: Test ping sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      httpStatus: { type: integer, example: 200 }
                      success: { type: boolean, example: true }
                      error: { type: string, nullable: true }
        "400":
          description: Webhook URL no longer resolves to a safe address
        "403":
          description: Forbidden
        "404":
          description: Endpoint not found
        "401":
          description: Unauthorized
