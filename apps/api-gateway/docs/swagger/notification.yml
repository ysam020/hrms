paths:
  /api/get-notifications:
    get:
      summary: Get notifications
      description: Returns all notifications for the authenticated user
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        title: { type: string, example: "Leave Approved" }
                        message:
                          {
                            type: string,
                            example: "Your leave has been approved",
                          }
                        type: { type: string, example: "leave" }
                        read: { type: boolean, example: false }
                        createdAt: { type: string, format: date-time }
        "401":
          description: Unauthorized

  /api/clear-notification/{_id}:
    put:
      summary: Clear a single notification
      description: Marks a specific notification as read/cleared
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
          example: "6672a2501aa931b68b091faf"
      responses:
        "200":
          description: Notification cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized
        "404":
          description: Notification not found

  /api/clear-all-notifications:
    put:
      summary: Clear all notifications
      description: Marks all notifications for the authenticated user as read/cleared
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All notifications cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      clearedCount: { type: integer, example: 5 }
        "401":
          description: Unauthorized
