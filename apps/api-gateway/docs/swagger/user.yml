paths:
  /api/v1/get-all-users:
    get:
      summary: List all users
      description: Returns a paginated list of users with optional filters
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: Page number
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
          description: Items per page
        - name: search
          in: query
          schema: { type: string }
          description: Search term for name or email
        - name: role
          in: query
          schema: { type: string }
          description: Filter by role
        - name: department
          in: query
          schema: { type: string }
          description: Filter by department
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            email: { type: string }
                            username: { type: string }
                            role: { type: string }
                            department: { type: string }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
        "401":
          description: Unauthorized

  /api/v1/get-user-data/{username}:
    get:
      summary: Get user data by username
      description: Returns detailed information for a specific user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
          example: "sameer_yadav"
      responses:
        "200":
          description: User data retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      username: { type: string }
                      fullName: { type: string }
                      role: { type: string }
                      department: { type: string }
                      designation: { type: string }
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /api/v1/save-fcm-token:
    put:
      summary: Save FCM push notification token
      description: Registers a Firebase Cloud Messaging token for the current user's device
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken]
              properties:
                fcmToken:
                  type: string
                  description: Firebase Cloud Messaging token
                  example: "fxyz123:APA91b..."
                deviceInfo:
                  type: object
                  properties:
                    platform: { type: string, example: "web" }
                    userAgent: { type: string, example: "Mozilla/5.0..." }
      responses:
        "200":
          description: FCM token saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/v1/disable-push-notifications:
    delete:
      summary: Disable push notifications
      description: Removes the FCM token for the current user, disabling push notifications
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Push notifications disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/v1/check-face-descriptor:
    get:
      summary: Check if a face descriptor is enrolled
      description: >
        Returns whether the authenticated user has enrolled a face descriptor
        for biometric attendance check-in. The face recognition model runs in a
        Web Worker (face-api.js) on the client; only the descriptor vector is
        stored server-side.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrollment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      hasDescriptor: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/v1/save-face-descriptor:
    post:
      summary: Enroll a face descriptor
      description: >
        Stores a face descriptor vector for the authenticated user, enabling
        biometric attendance check-in via face recognition. The descriptor is
        a 128-dimensional float array produced by face-api.js running in a
        Web Worker on the client.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descriptor]
              properties:
                descriptor:
                  type: array
                  items: { type: number }
                  minItems: 128
                  maxItems: 128
                  description: 128-dimensional face descriptor vector from face-api.js
                  example: [0.12, -0.34, 0.56, "..."]
      responses:
        "200":
          description: Face descriptor saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Face descriptor enrolled" }
        "400":
          description: Invalid descriptor (not 128 dimensions)
        "401":
          description: Unauthorized
