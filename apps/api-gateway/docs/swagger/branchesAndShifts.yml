paths:
  /api/v1/branches:
    get:
      summary: List branches
      description: >
        Returns the tenant's `Branch` rows. If none exist yet and legacy
        `TenantSettings` office coordinates are set, a "Head Office" branch is
        auto-created from them on first read.
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of branches }
    post:
      summary: Add a branch
      description: Owner/admin only.
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Branch created }

  /api/v1/branches/{id}:
    put:
      summary: Update a branch
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Branch updated }
    delete:
      summary: Deactivate a branch
      description: Sets isActive=false rather than deleting, so User.branchId references never dangle.
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Branch deactivated }

  /api/v1/shifts:
    get:
      summary: List shifts
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of shifts }
    post:
      summary: Add a shift
      description: Owner/admin only.
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Shift created }

  /api/v1/shifts/{id}:
    put:
      summary: Update a shift
      description: Setting isDefault=true unsets any other default shift for the tenant.
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Shift updated }
    delete:
      summary: Deactivate a shift
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Shift deactivated }

  /api/v1/shifts/{id}/assign:
    put:
      summary: Assign a shift to employees and/or teams
      tags: [Branches & Shifts]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds: { type: array, items: { type: string } }
                teamIds: { type: array, items: { type: string } }
      responses:
        "200": { description: Shift assigned }
