paths:
  /api/get-holidays/{year}:
    get:
      summary: Get holidays for a year
      description: Returns the list of public/company holidays for the given year
      tags: [General]
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer }
          example: 2026
      responses:
        "200":
          description: Holidays retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        name: { type: string, example: "Republic Day" }
                        date:
                          { type: string, format: date, example: "2026-01-26" }
                        type: { type: string, enum: [public, company] }
        "401":
          description: Unauthorized

  /api/add-holiday:
    post:
      summary: Add a holiday
      description: Add a new holiday to the company calendar (admin only)
      tags: [General]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, date]
              properties:
                name: { type: string, example: "Founders Day" }
                date: { type: string, format: date, example: "2026-03-15" }
                type:
                  type: string
                  enum: [public, company]
                  default: "company"
      responses:
        "200":
          description: Holiday added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/delete-holiday:
    put:
      summary: Delete a holiday
      description: Remove a holiday from the company calendar
      tags: [General]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holidayId]
              properties:
                holidayId: { type: string, example: "6672a2501aa931b68b091faf" }
      responses:
        "200":
          description: Holiday deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/get-calendar-events:
    get:
      summary: Get calendar events
      description: Returns all calendar events visible to the authenticated user
      tags: [General]
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: eventType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Calendar events retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        title: { type: string }
                        date: { type: string, format: date }
                        eventType: { type: string }
                        description: { type: string }
        "401":
          description: Unauthorized

  /api/add-event:
    post:
      summary: Add a calendar event
      description: Create a new calendar event
      tags: [General]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date]
              properties:
                title: { type: string, example: "Team Building Activity" }
                date: { type: string, format: date, example: "2026-04-15" }
                eventType: { type: string, example: "company" }
                description: { type: string }
                allDay: { type: boolean, default: true }
      responses:
        "200":
          description: Event added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/edit-calendar-event/{_id}:
    put:
      summary: Edit a calendar event
      description: Update details of an existing calendar event
      tags: [General]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                date: { type: string, format: date }
                eventType: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Event updated
        "401":
          description: Unauthorized

  /api/delete-calendar-event/{_id}:
    delete:
      summary: Delete a calendar event
      description: Remove a calendar event permanently
      tags: [General]
      security:
        - bearerAuth: []
      parameters:
        - name: _id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event deleted
        "401":
          description: Unauthorized

  /api/birthdays-anniversaries:
    get:
      summary: Get birthdays and work anniversaries
      description: Returns upcoming employee birthdays and work anniversaries
      tags: [General]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Birthdays and anniversaries retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      birthdays:
                        type: array
                        items:
                          type: object
                          properties:
                            username: { type: string }
                            fullName: { type: string }
                            date: { type: string, format: date }
                      anniversaries:
                        type: array
                        items:
                          type: object
                          properties:
                            username: { type: string }
                            fullName: { type: string }
                            yearsCompleted: { type: integer }
        "401":
          description: Unauthorized

  /api/audit-logs:
    get:
      summary: Get audit logs
      description: Returns system audit logs (admin only)
      tags: [General]
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: action
          in: query
          schema: { type: string }
          description: Filter by action type
        - name: username
          in: query
          schema: { type: string }
          description: Filter by user
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        username: { type: string }
                        action: { type: string }
                        resource: { type: string }
                        ipAddress: { type: string }
                        timestamp: { type: string, format: date-time }
        "401":
          description: Unauthorized

  /api/upload/presigned-url:
    post:
      summary: Get S3 presigned upload URL
      description: Generates a pre-signed S3 URL for direct file upload from the client
      tags: [General]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, fileType]
              properties:
                fileName: { type: string, example: "resume.pdf" }
                fileType: { type: string, example: "application/pdf" }
                folder: { type: string, example: "documents/kyc" }
      responses:
        "200":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      uploadUrl:
                        {
                          type: string,
                          format: uri,
                          description: "S3 presigned URL for PUT upload",
                        }
                      fileUrl:
                        {
                          type: string,
                          format: uri,
                          description: "Public URL of the uploaded file",
                        }
                      expiresIn:
                        {
                          type: integer,
                          example: 300,
                          description: "URL expiry in seconds",
                        }
        "401":
          description: Unauthorized
