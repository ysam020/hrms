paths:
  /api/v1/tenant-settings:
    get:
      summary: Get active (and pending) tenant settings
      description: >
        Returns the currently active `TenantSettings` version — the latest
        row where `effectiveFrom <= now()` — plus any future-dated (pending)
        versions. If no row exists yet for the tenant, schema defaults are
        returned with `id`/`effectiveFrom`/`note` set to `null`. Any
        authenticated tenant member may read. Requires `requireTenant` +
        `requireActiveSubscription`.
      tags: [Tenant Settings]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active and pending settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      active:
                        $ref: "#/components/schemas/TenantSettings"
                      pending:
                        type: array
                        items:
                          $ref: "#/components/schemas/TenantSettings"
                        description: >
                          Future-dated versions not yet in effect, ordered
                          earliest first.
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: No active tenant

    put:
      summary: Write a new settings version
      description: >
        Merges the given partial `settings` patch onto the current active
        snapshot and writes it as a new immutable version. If `effectiveFrom`
        is omitted (or is now/in the past) and an active version already
        exists, that row is updated in place rather than appending a new one
        — the versioned-history mechanism is reserved for genuine
        forward-dated "schedule for later" changes. A future `effectiveFrom`
        always creates (or updates, on a double-submit) a separate pending
        row. Writing an immediately-effective change invalidates the
        attendance/leave settings cache for this tenant. Restricted to
        `owner`/`admin` roles, superusers, or callers holding
        `Organisation:edit_organisation_settings` — checked in-handler, on
        top of `requireTenant` + `requireActiveSubscription`.
      tags: [Tenant Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom:
                  type: string
                  format: date-time
                  description: When this version takes effect. Omit for immediate effect.
                  example: "2026-06-01T00:00:00.000Z"
                note:
                  type: string
                  example: "Increasing sick leave entitlement from 10 to 12 days per year"
                settings:
                  type: object
                  description: Partial patch — only fields present are validated and merged.
                  properties:
                    workWeekPattern:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [mon_fri, mon_sat, custom]
                        workingDays:
                          type: array
                          items: { type: integer, minimum: 0, maximum: 6 }
                    paidLeavesPerYear:
                      { type: integer, minimum: 0, example: 12 }
                    sickLeavesPerYear:
                      { type: integer, minimum: 0, example: 12 }
                    casualLeavesPerYear:
                      { type: integer, minimum: 0, example: 6 }
                    medicalCertRequired: { type: boolean, example: false }
                    customLeaveTypes:
                      type: array
                      items: { type: object }
                    leavePolicies:
                      type: array
                      items:
                        type: object
                        properties:
                          key: { type: string, example: "MATERNITY" }
                          name: { type: string, example: "Maternity Leave" }
                          daysPerYear: { type: integer, example: 182 }
                          isStatutory: { type: boolean, example: true }
                          requiresProof: { type: boolean, example: true }
                          onExhaustion:
                            { type: string, example: "manager_override" }
                    workStartHour:
                      type: integer
                      minimum: 0
                      maximum: 23
                      example: 9
                    workStartMinute:
                      type: integer
                      minimum: 0
                      maximum: 59
                      example: 0
                    lateGracePeriodMinutes:
                      { type: integer, minimum: 0, example: 30 }
                    fullDayMinHours: { type: number, minimum: 0.5, example: 8 }
                    halfDayMinHours: { type: number, minimum: 0.5, example: 4 }
                    regularizationBackdateWindowDays:
                      { type: integer, minimum: 0, example: 3 }
                    overtimePreApprovalRequired:
                      { type: boolean, example: false }
                    probationPeriodDays:
                      { type: integer, minimum: 0, example: 90 }
                    noticePeriodDays: { type: integer, minimum: 0, example: 30 }
                    maxInterviewRounds:
                      { type: integer, minimum: 1, example: 5 }
                    geofencingEnabled: { type: boolean, example: false }
                    officeLatitude:
                      { type: number, nullable: true, example: 19.076 }
                    officeLongitude:
                      { type: number, nullable: true, example: 72.8777 }
                    officeName:
                      {
                        type: string,
                        nullable: true,
                        example: "Head Office, Mumbai",
                      }
                    geofenceRadiusMeters:
                      { type: integer, minimum: 50, example: 200 }
                    wfhEnabled: { type: boolean, example: true }
      responses:
        "200":
          description: >
            Settings version written — `message` is "Settings applied
            immediately." for an immediate write, or
            "Settings scheduled for YYYY-MM-DD." for a forward-dated one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    { type: string, example: "Settings applied immediately." }
                  data:
                    type: object
                    properties:
                      settings:
                        $ref: "#/components/schemas/TenantSettings"
        "400":
          description: >
            Invalid field value (e.g. bad workWeekPattern, out-of-range
            workStartHour, invalid effectiveFrom)
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: >
            No active tenant, or caller is not owner/admin/superuser/
            Organisation:edit_organisation_settings holder

  /api/v1/tenant-settings/pending/{id}:
    delete:
      summary: Cancel a pending settings version
      description: >
        Deletes a future-dated (`effectiveFrom > now()`) `TenantSettings`
        row that has not yet taken effect; the currently active settings are
        unaffected. Restricted to `owner`/`admin` roles or superusers —
        note this check does **not** extend to the
        `Organisation:edit_organisation_settings` permission (unlike the PUT
        above). Requires `requireTenant` + `requireActiveSubscription`.
      tags: [Tenant Settings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID of the pending TenantSettings row to cancel
          example: "6672a2501aa931b68b091faf"
      responses:
        "200":
          description: Pending settings change cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    {
                      type: string,
                      example: "Pending settings change cancelled.",
                    }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: No active tenant, or caller is not owner/admin/superuser
        "404":
          description: Pending settings version not found (or already active/past)

components:
  schemas:
    TenantSettings:
      type: object
      nullable: true
      properties:
        id: { type: string, nullable: true }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        workWeekPattern:
          type: object
          properties:
            type:
              type: string
              enum: [mon_fri, mon_sat, custom]
            workingDays:
              type: array
              items: { type: integer }
          example: { type: "mon_fri", workingDays: [1, 2, 3, 4, 5] }
        paidLeavesPerYear: { type: integer, example: 12 }
        sickLeavesPerYear: { type: integer, example: 12 }
        casualLeavesPerYear: { type: integer, example: 6 }
        medicalCertRequired: { type: boolean, example: false }
        customLeaveTypes: { type: array, items: { type: object } }
        leavePolicies: { type: array, items: { type: object } }
        workStartHour: { type: integer, example: 9 }
        workStartMinute: { type: integer, example: 0 }
        lateGracePeriodMinutes: { type: integer, example: 30 }
        fullDayMinHours: { type: number, example: 8 }
        halfDayMinHours: { type: number, example: 4 }
        regularizationBackdateWindowDays: { type: integer, example: 3 }
        overtimePreApprovalRequired: { type: boolean, example: false }
        geofencingEnabled: { type: boolean, example: false }
        officeLatitude: { type: number, nullable: true }
        officeLongitude: { type: number, nullable: true }
        officeName: { type: string, nullable: true }
        geofenceRadiusMeters: { type: integer, example: 200 }
        wfhEnabled: { type: boolean, example: true }
        probationPeriodDays: { type: integer, example: 90 }
        noticePeriodDays: { type: integer, example: 30 }
        maxInterviewRounds: { type: integer, example: 5 }
