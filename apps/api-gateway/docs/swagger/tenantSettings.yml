paths:
  /api/v1/tenant-settings:
    get:
      summary: Get active tenant settings
      description: >
        Returns the currently active settings for the authenticated organisation.
        The active version is the latest `TenantSettings` row where `effectiveFrom ≤ now()`.

        If a future-dated (pending) version exists, it is returned in the
        `pendingSettings` field alongside the active one so the UI can display
        the scheduled change.

        Any member of the organisation may read settings. Only `owner` or
        `admin` roles may write.
      tags: [Org Settings]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active (and optionally pending) settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      active:
                        $ref: "#/components/schemas/TenantSettings"
                      pending:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/TenantSettings"
                        description: >
                          A future-dated settings version, if one is scheduled.
                          Null if no pending change exists.
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired

    put:
      summary: Create a new settings version
      description: >
        Creates an immutable versioned settings snapshot. Providing `effectiveFrom`
        in the future schedules the change — it becomes active at that date without
        any further action. Omitting `effectiveFrom` makes the change take effect
        immediately (defaults to `now()`).

        Only `owner` and `admin` roles may call this endpoint.
      tags: [Org Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom:
                  type: string
                  format: date-time
                  description: >
                    When this version becomes active. Omit for immediate effect.
                  example: "2026-06-01T00:00:00.000Z"
                note:
                  type: string
                  description: Optional changelog note explaining the change
                  example: "Increasing sick leave entitlement from 10 to 12 days per year"
                paidLeavesPerYear:
                  type: integer
                  example: 12
                sickLeavesPerYear:
                  type: integer
                  example: 12
                casualLeavesPerYear:
                  type: integer
                  example: 6
                medicalCertRequired:
                  type: boolean
                  example: false
                customLeaveTypes:
                  type: array
                  description: Extra leave types beyond the standard set
                  items:
                    type: object
                    properties:
                      name: { type: string, example: "Paternity" }
                      key: { type: string, example: "paternity" }
                      daysPerYear: { type: integer, example: 5 }
                      requiresProof: { type: boolean, example: false }
                workStartHour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  example: 9
                  description: 24-hour clock
                workStartMinute:
                  type: integer
                  minimum: 0
                  maximum: 59
                  example: 0
                lateGracePeriodMinutes:
                  type: integer
                  example: 30
                  description: Minutes after work-start before check-in is flagged as Late
                fullDayMinHours:
                  type: number
                  example: 8
                  description: Minimum working hours to count as a full day
                halfDayMinHours:
                  type: number
                  example: 4
                  description: Minimum working hours to count as a half day
                geofencingEnabled:
                  type: boolean
                  example: false
                  description: Block check-in if employee is outside the allowed radius
                officeLatitude:
                  type: number
                  example: 19.0760
                officeLongitude:
                  type: number
                  example: 72.8777
                officeName:
                  type: string
                  example: "Head Office, Mumbai"
                geofenceRadiusMeters:
                  type: integer
                  example: 200
                probationPeriodDays:
                  type: integer
                  example: 90
                noticePeriodDays:
                  type: integer
                  example: 30
      responses:
        "201":
          description: Settings version created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/TenantSettings"
        "400":
          description: Validation error (e.g. fullDayMinHours < halfDayMinHours)
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: Only owner or admin may update settings

  /api/v1/tenant-settings/pending/{id}:
    delete:
      summary: Cancel a pending settings version
      description: >
        Cancels a future-dated (scheduled) settings version that has not yet
        taken effect. The currently active settings remain unchanged.
      tags: [Org Settings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID of the pending TenantSettings row to cancel
          example: "6672a2501aa931b68b091faf"
      responses:
        "200":
          description: Pending settings cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "400":
          description: Settings version has already taken effect
        "404":
          description: Pending settings not found
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: Only owner or admin may cancel pending settings

components:
  schemas:
    TenantSettings:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        effectiveFrom: { type: string, format: date-time }
        paidLeavesPerYear: { type: integer, example: 12 }
        sickLeavesPerYear: { type: integer, example: 12 }
        casualLeavesPerYear: { type: integer, example: 6 }
        medicalCertRequired: { type: boolean, example: false }
        customLeaveTypes:
          { type: array, items: { type: object }, nullable: true }
        workStartHour: { type: integer, example: 9 }
        workStartMinute: { type: integer, example: 0 }
        lateGracePeriodMinutes: { type: integer, example: 30 }
        fullDayMinHours: { type: number, example: 8 }
        halfDayMinHours: { type: number, example: 4 }
        geofencingEnabled: { type: boolean, example: false }
        officeLatitude: { type: number, nullable: true }
        officeLongitude: { type: number, nullable: true }
        officeName: { type: string, nullable: true }
        geofenceRadiusMeters: { type: integer, example: 200 }
        probationPeriodDays: { type: integer, example: 90 }
        noticePeriodDays: { type: integer, example: 30 }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
