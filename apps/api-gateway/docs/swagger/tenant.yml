paths:
  /api/v1/tenants/invite/{token}:
    get:
      summary: Resolve invite token
      description: >
        Validates a tenant invite token and returns the invitation details.
        Used by the invite landing page before the invitee logs in — no auth required.
      tags: [Tenant Management]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          example: "abc123xyz"
      responses:
        "200":
          description: Invite is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      tenantName: { type: string, example: "Acme Corp" }
                      role: { type: string, example: "employee" }
                      invitedBy: { type: string, example: "john@acme.com" }
                      expiresAt: { type: string, format: date-time }
        "404":
          description: Token not found or expired

  /api/v1/tenants/available:
    get:
      summary: List available tenants
      description: Returns all organisations the authenticated user belongs to.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of tenants the user belongs to
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId: { type: string }
                        name: { type: string, example: "Acme Corp" }
                        slug: { type: string, example: "acme-corp" }
                        role: { type: string, example: "admin" }
        "401":
          description: Unauthorized

  /api/v1/tenants:
    post:
      summary: Create a new organisation
      description: >
        Creates a new tenant (organisation). The authenticated user must have a
        `pendingSetup` JWT (issued after first Google OAuth without an existing org).
        This creates the `Tenant` record and the `TenantMembership` for the owner.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  description: Display name of the organisation
                  example: "Acme Corp"
                slug:
                  type: string
                  description: URL-safe unique identifier (used to derive the database name)
                  example: "acme-corp"
                industry:
                  type: string
                  example: "Technology"
                companySize:
                  type: string
                  example: "50-200"
                helpEmail:
                  type: string
                  format: email
                  example: "hr@acme.com"
                helpPhone:
                  type: string
                  example: "+91 9876543210"
                website:
                  type: string
                  example: "https://acme.com"
      responses:
        "201":
          description: Organisation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      tenantId: { type: string }
                      slug: { type: string, example: "acme-corp" }
                      dbName: { type: string, example: "hrms-acme-corp" }
        "409":
          description: Slug already taken
        "401":
          description: Unauthorized

  /api/v1/tenants/complete-pending-setup:
    post:
      summary: Complete pending setup
      description: >
        Marks the pending-setup stage as complete after org creation and payment confirmation.
        Issues a full JWT replacing the pending-setup token.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Setup complete, full JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
        "401":
          description: Unauthorized

  /api/v1/tenants/select:
    post:
      summary: Switch active tenant
      description: >
        Switches the authenticated user's active organisation context.
        Issues a new JWT containing the selected tenant's `tenantId`, `dbName`, and `tenantRole`.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId:
                  type: string
                  description: ID of the tenant to switch to
                  example: "6672a2501aa931b68b091faf"
      responses:
        "200":
          description: Tenant switched, new JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
        "403":
          description: User is not a member of the target tenant
        "401":
          description: Unauthorized

  /api/v1/tenants/me:
    get:
      summary: Get current tenant
      description: Returns the details of the currently active tenant.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current tenant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string, example: "Acme Corp" }
                      slug: { type: string, example: "acme-corp" }
                      plan: { type: string, example: "pro" }
                      subscriptionStatus:
                        type: string
                        enum: [active, grace_period, cancelling, expired]
                        example: "active"
                      planExpiresAt:
                        { type: string, format: date-time, nullable: true }
                      isActive: { type: boolean, example: true }
        "401":
          description: Unauthorized
        "403":
          description: No active tenant context (pendingSetup token)

  /api/v1/tenants/complete-org-setup:
    post:
      summary: Complete org profile setup
      description: Marks the org profile setup step as complete in the onboarding wizard.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Org setup marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized

  /api/v1/tenants/members:
    get:
      summary: List tenant members
      description: Returns all members of the current organisation with their roles.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string }
                        username: { type: string }
                        email: { type: string, format: email }
                        role: { type: string, example: "admin" }
                        joinedAt: { type: string, format: date-time }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired

  /api/v1/tenants/invite:
    post:
      summary: Invite a user
      description: Sends an invitation email to a user to join the organisation.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  example: "newuser@acme.com"
                role:
                  type: string
                  enum: [admin, hr, manager, employee]
                  example: "employee"
      responses:
        "200":
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Invitation sent" }
        "409":
          description: User is already a member
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired

  /api/v1/tenants/invite/{id}:
    delete:
      summary: Revoke an invite
      description: Cancels a pending (unused) invitation.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Invite ID to revoke
      responses:
        "200":
          description: Invite revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "404":
          description: Invite not found
        "401":
          description: Unauthorized

  /api/v1/tenants/org-profile:
    get:
      summary: Get org profile
      description: Returns the organisation's public profile (name, logo, address, contact).
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Org profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      name: { type: string, example: "Acme Corp" }
                      slug: { type: string, example: "acme-corp" }
                      industry: { type: string, example: "Technology" }
                      companySize: { type: string, example: "50-200" }
                      helpEmail: { type: string, format: email }
                      helpPhone: { type: string }
                      officeAddress: { type: string }
                      website: { type: string }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
    put:
      summary: Update org profile
      description: Updates the organisation's public profile fields.
      tags: [Tenant Management]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Acme Corporation" }
                industry: { type: string, example: "Technology" }
                companySize: { type: string, example: "200-500" }
                helpEmail: { type: string, format: email }
                helpPhone: { type: string }
                officeAddress: { type: string }
                website: { type: string }
      responses:
        "200":
          description: Org profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
