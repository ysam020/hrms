  /api/v1/get-age-distribution:
    get:
      operationId: getAgeDistribution
      summary: Employee age distribution
      description: >
        Buckets employees with a known date of birth into age bands (<25, 25-34, 35-44,
        45-54, 55+) via a MongoDB `$bucket` aggregation. Requires a tenant context — fails
        with 500 if none is present. Result is cached per tenant. Requires super-user
        privileges.


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription); owner or superuser only (requireSuperUser).
      tags: [Workforce Analytics]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Age distribution retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          {
                            type: string,
                            enum: ["<25", "25-34", "35-44", "45-54", "55+"],
                          }
                        count: { type: integer }
        "401":
          description: Unauthorized
        "402":
          description: Subscription expired
        "403":
          description: Forbidden — requires super-user privileges
        "500":
          description: Internal Server Error — no tenant context on request
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/AuthCheckUnavailable"

