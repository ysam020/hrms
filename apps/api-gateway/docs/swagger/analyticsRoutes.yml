        Buckets active employees by years of service (<1, 1-2, 2-3, 3-5, 5+ years) via a
        MongoDB `$bucket` aggregation. Requires a tenant context — fails with 500 if none
        is present. Result is cached per tenant. Requires super-user privileges.


        Access: authenticated (bearer token or `access_token` cookie); organisation required (requireTenant); active subscription (requireActiveSubscription); owner or superuser only (requireSuperUser).
