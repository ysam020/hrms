syntax = "proto3";
package salary;

// ── Requests ──────────────────────────────────────────────────────────────────

message GetSalaryRequest {
  string userId = 1;
  int32 year = 2;
  int32 month = 3;
}

message ComponentAmount {
  string code = 1;
  string name = 2;
  string type = 3; // "earning" | "deduction"
  double amount = 4;
}

message CreateSalaryRequest {
  string userId = 1;
  double basicPay = 2;
  double hra = 3;
  double conveyance = 4;
  double incentive = 5;
  double pf = 6;
  double esi = 7;
  double pt = 8;
  double deductions = 9;
  int32 month = 10;
  int32 year = 11;
  repeated ComponentAmount components = 12;
}

message UpdateSalaryRequest {
  string id = 1;
  double basicPay = 2;
  double hra = 3;
  double conveyance = 4;
  double incentive = 5;
  double pf = 6;
  double esi = 7;
  double pt = 8;
  double deductions = 9;
  repeated ComponentAmount components = 10;
}

message ProcessPayrollRequest {
  string month = 1;
  string year = 2;
  repeated string userIds = 3;
}

// ── Data models ───────────────────────────────────────────────────────────────

message SalaryStructure {
  string id = 1;
  string userId = 2;
  int32 year = 3;
  int32 month = 4;
  double basicPay = 5;
  double hra = 6;
  double conveyance = 7;
  double incentive = 8;
  double pf = 9;
  double esi = 10;
  double pt = 11;
  double deductions = 12;
  double grossEarnings = 13;
  double grossSalary = 14;
  double netPayable = 15;
  repeated ComponentAmount components = 16;
}

message Employee {
  string id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string department = 6;
  string designation = 7;
}

message AttendanceSummary {
  int32 month = 1;
  int32 year = 2;
  int32 presentDays = 3;
  int32 absentDays = 4;
}

message PayslipData {
  Employee employee = 1;
  SalaryStructure salaryStructure = 2;
  AttendanceSummary attendanceSummary = 3;
}

message PayrollRecord {
  string userId = 1;
  string employeeName = 2;
  double grossSalary = 3;
  double netSalary = 4;
  double deductions = 5;
  string status = 6;
}

// ── Responses ─────────────────────────────────────────────────────────────────

message SalaryResponse {
  string message = 1;
  int32 status = 2;
  SalaryStructure data = 3;
}

message PayslipResponse {
  string message = 1;
  int32 status = 2;
  PayslipData data = 3;
}

message ProcessPayrollResponse {
  string message = 1;
  int32 status = 2;
  repeated PayrollRecord data = 3;
}

message BasicResponse {
  string message = 1;
  int32 status = 2;
}

// ── Service ───────────────────────────────────────────────────────────────────

service SalaryService {
  rpc GetSalaryStructure (GetSalaryRequest) returns (SalaryResponse);
  rpc CreateSalaryStructure (CreateSalaryRequest) returns (SalaryResponse);
  rpc UpdateSalaryStructure (UpdateSalaryRequest) returns (SalaryResponse);
  rpc ProcessPayroll (ProcessPayrollRequest) returns (ProcessPayrollResponse);
  rpc GetPayslip (GetSalaryRequest) returns (PayslipResponse);
}
