syntax = "proto3";
package attendance;

message AttendanceRecord {
  string id = 1;
  string userId = 2;
  string date = 3;
  string checkIn = 4;
  string checkOut = 5;
  string status = 6;
  double latitude = 7;
  double longitude = 8;
  string workHours = 9;
}

message MarkAttendanceRequest {
  string userId = 1;
  string type = 2;  // CHECK_IN or CHECK_OUT
  double latitude = 3;
  double longitude = 4;
  string deviceInfo = 5;
  string imageUrl = 6;
}

message AttendanceResponse {
  string message = 1;
  int32 status = 2;
  AttendanceRecord data = 3;
}

message GetAttendanceRequest {
  string userId = 1;
  string startDate = 2;
  string endDate = 3;
  int32 page = 4;
  int32 limit = 5;
}

message GetAttendanceResponse {
  string message = 1;
  int32 status = 2;
  repeated AttendanceRecord data = 3;
  int32 total = 4;
}

message AttendanceSummaryRequest {
  string userId = 1;
  string month = 2;
  string year = 3;
}

message AttendanceSummaryResponse {
  string message = 1;
  int32 status = 2;
  int32 totalDays = 3;
  int32 presentDays = 4;
  int32 absentDays = 5;
  int32 lateDays = 6;
  double totalHours = 7;
}

message CorrectAttendanceRequest {
  string userId = 1;
  string date = 2;
  string timeIn = 3;
  string timeOut = 4;
  string correctedBy = 5;
}

service AttendanceService {
  // Records a clock-in or clock-out event for an employee.
  rpc MarkAttendance (MarkAttendanceRequest) returns (AttendanceResponse);
  // Returns attendance records for an employee within a date range.
  rpc GetAttendance (GetAttendanceRequest) returns (GetAttendanceResponse);
  // Returns aggregated attendance summary for an employee.
  rpc GetAttendanceSummary (AttendanceSummaryRequest) returns (AttendanceSummaryResponse);
  // Returns today's attendance record for an employee.
  rpc GetTodayAttendance (MarkAttendanceRequest) returns (AttendanceResponse);
  // Corrects a previously recorded attendance entry.
  rpc CorrectAttendance (CorrectAttendanceRequest) returns (AttendanceResponse);
}
