syntax = "proto3";
package leave;

message LeaveApplication {
  string id = 1;
  string user_id = 2;
  string leave_type = 3;
  string from = 4;
  string to = 5;
  float days = 6;
  string reason = 7;
  string status = 8;
  string approved_by_id = 9;
  string applied_on = 10;
  bool sick_leave = 11;
  string medical_certificate = 12;
  string approved_on = 13;
  // full_day (default) | half_day | short_leave
  string unit = 14;
  // first_half | second_half — set when unit = half_day
  string session = 15;
  // set when unit = short_leave
  float short_leave_hours = 16;
}

message LeaveBalance {
  string id = 1;
  string user_id = 2;
  float accumulated_pl_before_current_month = 3;
  string balances = 4;
}

message ApplyLeaveRequest {
  string user_id = 1;
  string leave_type = 2;
  string from = 3;
  string to = 4;
  string reason = 5;
  bool sick_leave = 6;
  string medical_certificate = 7;
  // full_day (default) | half_day | short_leave
  string unit = 8;
  // first_half | second_half — required when unit = half_day
  string session = 9;
  // required when unit = short_leave
  float short_leave_hours = 10;
}

message LeaveResponse {
  string message = 1;
  int32 status = 2;
  LeaveApplication data = 3;
}

message GetLeaveRequest {
  string user_id = 1;
  string status = 2;
  int32 page = 3;
  int32 limit = 4;
  // When true, only includes leave applications whose "to" date is today or later.
  bool future_only = 6;
}

message GetLeaveResponse {
  string message = 1;
  int32 status = 2;
  repeated LeaveApplication data = 3;
  int32 total = 4;
}

message ApproveLeaveRequest {
  string id = 1;
  string approved_by_id = 2;
}

message RejectLeaveRequest {
  string id = 1;
}

message CancelLeaveRequest {
  string id = 1;
  string user_id = 2;
  string reason = 3;
}

// Finalizes a cancellation that went through approval (see approve/reject on
// module "leave", conditionField "isCancellation" in packages/approval-engine).
message FinalizeLeaveCancellationRequest {
  string id = 1;
  bool approved = 2;
}

message GetLeaveByIdRequest {
  string id = 1;
}

message GetLeaveBalanceRequest {
  string user_id = 1;
}

message GetLeaveBalanceResponse {
  string message = 1;
  int32 status = 2;
  LeaveBalance data = 3;
  string user_id = 4;
}

message BasicLeaveResponse {
  string message = 1;
  int32 status = 2;
}

service LeaveService {
  // Submits a new leave application.
  rpc ApplyLeave (ApplyLeaveRequest) returns (LeaveResponse);
  // Returns a list of leave applications with optional filters.
  rpc GetLeaves (GetLeaveRequest) returns (GetLeaveResponse);
  // Returns a single leave application by ID.
  rpc GetLeaveById (GetLeaveByIdRequest) returns (LeaveResponse);
  // Approves a pending leave application.
  rpc ApproveLeave (ApproveLeaveRequest) returns (BasicLeaveResponse);
  // Rejects a pending leave application.
  rpc RejectLeave (RejectLeaveRequest) returns (BasicLeaveResponse);
  // Cancels a pending leave application immediately, or — if it's already
  // approved — requests cancellation, routed through the Approval Chain.
  rpc CancelLeave (CancelLeaveRequest) returns (BasicLeaveResponse);
  // Applies the outcome of an approved/rejected cancellation request
  // (crediting the balance back on approval, or reverting to Approved on
  // rejection). Called by api-gateway's generic approval act-on-step handler.
  rpc FinalizeLeaveCancellation (FinalizeLeaveCancellationRequest) returns (BasicLeaveResponse);
  // Returns the leave balance for an employee.
  rpc GetLeaveBalance (GetLeaveBalanceRequest) returns (GetLeaveBalanceResponse);
  // Updates the leave balance for an employee.
  rpc UpdateLeaveBalance (GetLeaveBalanceRequest) returns (BasicLeaveResponse);
}
