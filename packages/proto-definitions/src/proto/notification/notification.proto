syntax = "proto3";
package notification;

message Notification {
  string id = 1;
  string userId = 2;
  string title = 3;
  string body = 4;
  string type = 5;
  bool isRead = 6;
  string createdAt = 7;
  string data = 8;  // JSON-encoded extra data
}

message SendNotificationRequest {
  string userId = 1;
  string title = 2;
  string body = 3;
  string type = 4;
  string data = 5;  // JSON-encoded
}

message SendBulkNotificationRequest {
  repeated string userIds = 1;
  string title = 2;
  string body = 3;
  string type = 4;
  string data = 5;
}

message NotificationResponse {
  string message = 1;
  int32 status = 2;
  Notification data = 3;
}

message GetNotificationsRequest {
  string userId = 1;
  bool unreadOnly = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetNotificationsResponse {
  string message = 1;
  int32 status = 2;
  repeated Notification data = 3;
  int32 total = 4;
  int32 unreadCount = 5;
}

message MarkReadRequest {
  string userId = 1;
  repeated string notificationIds = 2;
}

message BasicResponse {
  string message = 1;
  int32 status = 2;
}

service NotificationService {
  rpc SendNotification (SendNotificationRequest) returns (NotificationResponse);
  rpc SendBulkNotification (SendBulkNotificationRequest) returns (BasicResponse);
  rpc GetNotifications (GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc MarkAsRead (MarkReadRequest) returns (BasicResponse);
  rpc MarkAllAsRead (MarkReadRequest) returns (BasicResponse);
  rpc DeleteNotification (MarkReadRequest) returns (BasicResponse);
}
