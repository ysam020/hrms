syntax = "proto3";
package auth;


message GoogleOAuthCallbackRequest {
  string code = 1;
  // base64-encoded JSON: { inviteToken?: string }
  string state = 2;
}

message TenantSummary {
  string id = 1;
  string name = 2;
  string slug = 3;
  string role = 4;
}

message AuthTokenResponse {
  string accessToken = 1;
  string message = 2;
  int32 status = 3;
  UserPayload data = 4;
  string refresh_token = 5;
  // true when the authenticated user has no tenant yet
  bool needsTenantSetup = 6;
  // populated when the user belongs to multiple tenants (picker flow)
  repeated TenantSummary tenants = 7;
}

message UserPayload {
  string id = 1;
  string email = 2;
  string username = 3;
  string role = 4;
  string firstName = 5;
  string lastName = 6;
  string tenantId = 7;
  string tenantRole = 8;
}

message RefreshTokenRequest {
  string refreshToken = 1;
}

message RefreshTokenResponse {
  string accessToken = 1;
  string message = 2;
  int32 status = 3;
}

message LogoutRequest {
  string userId = 1;
}

message LogoutResponse {
  string message = 1;
  int32 status = 2;
}

message GetProfileRequest {
  string userId = 1;
}

message GetProfileResponse {
  string message = 1;
  int32 status = 2;
  UserPayload data = 3;
}

message WebAuthnRegistrationOptionsRequest {
  string userId = 1;
  string email = 2;
}

message WebAuthnOptionsResponse {
  string message = 1;
  int32 status = 2;
  string options = 3;  // JSON-encoded options
}

message WebAuthnRegistrationVerifyRequest {
  string userId = 1;
  string credential = 2;  // JSON-encoded credential
}

message WebAuthnAuthenticationOptionsRequest {
  string username = 1;
}

message WebAuthnAuthenticationVerifyRequest {
  string userId = 1;
  string credential = 2;
  string username = 3;
}

message WebAuthnVerifyResponse {
  string message = 1;
  int32 status = 2;
  string accessToken = 3;
  string refresh_token = 4;
}


service AuthService {
  // Issues a new access token using a valid refresh token.
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  // Invalidates the current session and clears auth tokens.
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  // Returns the authenticated user's profile.
  rpc GetProfile (GetProfileRequest) returns (GetProfileResponse);
  // Generates WebAuthn registration options for a new credential.
  rpc WebAuthnRegistrationOptions (WebAuthnRegistrationOptionsRequest) returns (WebAuthnOptionsResponse);
  // Verifies and stores a completed WebAuthn registration.
  rpc WebAuthnRegistrationVerify (WebAuthnRegistrationVerifyRequest) returns (WebAuthnVerifyResponse);
  // Generates WebAuthn authentication options for login.
  rpc WebAuthnAuthenticationOptions (WebAuthnAuthenticationOptionsRequest) returns (WebAuthnOptionsResponse);
  // Verifies a WebAuthn authentication assertion and issues tokens.
  rpc WebAuthnAuthenticationVerify (WebAuthnAuthenticationVerifyRequest) returns (WebAuthnVerifyResponse);
  // Handles the Google OAuth2 callback and issues tokens.
  rpc GoogleOAuthCallback (GoogleOAuthCallbackRequest) returns (AuthTokenResponse);
}
