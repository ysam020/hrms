syntax = "proto3";
package employee;


message Employee {
  string id = 1;
  string userId = 2;
  string employeeId = 3;
  string firstName = 4;
  string lastName = 5;
  string email = 6;
  string phone = 7;
  string department = 8;
  string designation = 9;
  string dateOfJoining = 10;
  string status = 12;
  string managerId = 13;
  string profileImage = 14;
}

message GetEmployeeRequest {
  string employeeId = 1;
}

message GetEmployeeResponse {
  string message = 1;
  int32 status = 2;
  Employee data = 3;
}

message UpdateEmployeeRequest {
  string employeeId = 1;
  string firstName = 2;
  string lastName = 3;
  string phone = 4;
  string department = 5;
  string designation = 6;
  string status = 8;
  string managerId = 9;
}

message ListEmployeesRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
  string department = 4;
  string status = 5;
}

message ListEmployeesResponse {
  string message = 1;
  int32 status = 2;
  repeated Employee data = 3;
  int32 total = 4;
}

message DeleteEmployeeRequest {
  string employeeId = 1;
}

message BasicResponse {
  string message = 1;
  int32 status = 2;
}

message KycRequest {
  string userId = 1;
  string username = 2;
  string employeePhoto = 3;
  string dob = 4;
  string bloodGroup = 5;
  string qualification = 6;
  string mobile = 7;
  string email = 8;
  string officialEmail = 9;
  string permanentAddressLine1 = 10;
  string permanentAddressLine2 = 11;
  string permanentAddressCity = 12;
  string permanentAddressState = 13;
  string permanentAddressPincode = 14;
  string communicationAddressLine1 = 15;
  string communicationAddressLine2 = 16;
  string communicationAddressCity = 17;
  string communicationAddressState = 18;
  string communicationAddressPincode = 19;
  string aadharNo = 20;
  string aadharPhotoFront = 21;
  string aadharPhotoBack = 22;
  string panNo = 23;
  string panPhoto = 24;
  repeated string educationCertificates = 25;
  string experienceCertificate = 26;
  string electricityBill = 27;
  string bankAccountNo = 28;
  string bankName = 29;
  string ifscCode = 30;
}

message KycResponse {
  string message = 1;
  int32 status = 2;
  string kycStatus = 3;
}

message RequestKycRevisionRequest {
  string employeeId = 1;
  // JSON-encoded { [fieldName]: issueDescription } — same flexible-blob
  // pattern as e.g. leave-service's LeaveBalance.balances, avoiding a
  // protobuf map type this codebase hasn't otherwise needed.
  string fieldIssuesJson = 2;
}

message RequestKycEditAccessRequest {
  string userId = 1;
  string reason = 2;
}

message AllowKycEditRequest {
  string employeeId = 1;
  // Who clicked "Allow Editing" — needed so the other eligible approvers
  // (there can be several: superusers, permission holders, owner/admin/hr)
  // can be excluded from the "already resolved" notification sent to
  // whoever didn't get to it first.
  string actorUserId = 2;
}

service EmployeeService {
  // Retrieves a single employee by ID.
  rpc GetEmployee (GetEmployeeRequest) returns (GetEmployeeResponse);
  // Updates an existing employee record.
  rpc UpdateEmployee (UpdateEmployeeRequest) returns (GetEmployeeResponse);
  // Deletes an employee record by ID.
  rpc DeleteEmployee (DeleteEmployeeRequest) returns (BasicResponse);
  // Returns a paginated list of employees with optional filters.
  rpc ListEmployees (ListEmployeesRequest) returns (ListEmployeesResponse);
  // Submits KYC documents for an employee.
  rpc SubmitKyc (KycRequest) returns (KycResponse);
  // Returns the KYC verification status for an employee.
  rpc GetKycStatus (GetEmployeeRequest) returns (KycResponse);
  // Approves the KYC submission for an employee.
  rpc ApproveKyc (GetEmployeeRequest) returns (KycResponse);
  // Flags specific fields on an employee's KYC submission as needing
  // correction, with a per-field note explaining the issue.
  rpc RequestKycRevision (RequestKycRevisionRequest) returns (KycResponse);
  // Employee-initiated: asks to reopen an already-Approved KYC for editing
  // (e.g. bank account or address changed since approval).
  rpc RequestKycEditAccess (RequestKycEditAccessRequest) returns (KycResponse);
  // HR-side: grants a pending edit-access request, reopening the record for
  // editing (back to Pending).
  rpc AllowKycEdit (AllowKycEditRequest) returns (KycResponse);
}
