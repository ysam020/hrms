  notification-service:
    container_name: notification-service
    image: ysam090/hrms-notification-service:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=notification-service
        - PROJECT=notification-service
        - PORT=50060
    environment:
      - METRICS_PORT=9110
      - LOKI_URL=http://loki:3100
    ports:
      - "50060:50060"
      - "9110:9110"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  scheduler-service:
    container_name: scheduler-service
    image: ysam090/hrms-scheduler-service:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=scheduler-service
        - PROJECT=scheduler-service
    environment:
      - METRICS_PORT=9111
      - LOKI_URL=http://loki:3100
    ports:
      - "9111:9111"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  web:
    container_name: web
    image: ysam090/hrms-web:latest
    build:
      context: .
      dockerfile: ./docker/web.Dockerfile
      secrets:
        - aws_credentials
        - aws_config
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./packages/certificates:/app/packages/certificates:ro
    restart: on-failure

  mongodb:
    container_name: hrms-mongodb
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hrms
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    container_name: hrms-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    container_name: hrms-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  loki:
    container_name: hrms-loki
    image: grafana/loki:latest
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  grafana:
    container_name: hrms-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local

secrets:
  aws_credentials:
    file: ${USERPROFILE:-${HOME}}/.aws/credentials
  aws_config:
    file: ${USERPROFILE:-${HOME}}/.aws/config
