# gRPC TLS — set GRPC_TLS_ENABLED=true in .env after running:
#   bash scripts/gen-grpc-certs.sh
# The generated certs are mounted read-only into every service container.
x-grpc-certs: &grpc-certs
  volumes:
    - ./packages/certificates/grpc:/app/packages/certificates/grpc:ro

# Default resource envelope for Node.js services (dev values — tighten for prod).
x-service-resources: &service-resources
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 512M
      reservations:
        cpus: "0.10"
        memory: 128M

services:
  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=api-gateway
        - PROJECT=api-gateway
        - PORT=9002
    environment:
      - AUTH_SERVICE_HOST=auth-service
      - USER_SERVICE_HOST=user-service
      - EMPLOYEE_SERVICE_HOST=employee-service
      - ATTENDANCE_SERVICE_HOST=attendance-service
      - LEAVE_SERVICE_HOST=leave-service
      - RECRUITMENT_SERVICE_HOST=recruitment-service
      - HRM_SERVICE_HOST=hrm-service
      - SALARY_SERVICE_HOST=salary-service
      - ANALYTICS_SERVICE_HOST=analytics-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      # gRPC TLS — paths match the volume mount above
      - GRPC_CA_CERT=/app/packages/certificates/grpc/ca.crt
      - GRPC_CLIENT_CERT=/app/packages/certificates/grpc/client.crt
      - GRPC_CLIENT_KEY=/app/packages/certificates/grpc/client.key
    ports:
      - "9002:9002"
    env_file: .env
    <<: [*grpc-certs, *service-resources]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  auth-service:
    container_name: auth-service
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=auth-service
        - PROJECT=auth-service
        - PORT=50051
    # No host port mapping — only reachable within the Docker network by the api-gateway
    env_file: .env
    environment:
      - GRPC_SERVER_CERT=/app/packages/certificates/grpc/server.crt
      - GRPC_SERVER_KEY=/app/packages/certificates/grpc/server.key
      - GRPC_CA_CERT=/app/packages/certificates/grpc/ca.crt
    <<: [*grpc-certs, *service-resources]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').createConnection(50051,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  user-service:
