# Shared config applied to every backend service:
#   • AWS credentials (read-only) so bootstrap.js can call Secrets Manager
#   • TLS certificates (read-only) generated on the host by `pnpm certs:generate`
#
# ${USERPROFILE:-${HOME}} resolves to the correct home directory on every OS:
#   Windows  → %USERPROFILE%  (e.g. C:\Users\sam)
#   macOS    → $HOME          (e.g. /Users/sam)
#   Linux    → $HOME          (e.g. /home/sam)
x-backend-service: &backend-service
  env_file:
    - ./docker/backend.env
  volumes:
    - ${USERPROFILE:-${HOME}}/.aws:/app/.aws:ro
    - ./packages/certificates:/app/packages/certificates:ro
  restart: on-failure

services:
  api-gateway:
    container_name: api-gateway
    image: ysam090/hrms-api-gateway:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=api-gateway
        - PROJECT=api-gateway-service
        - PORT=9002
    environment:
      - AUTH_SERVICE_HOST=auth-service
      - USER_SERVICE_HOST=user-service
      - EMPLOYEE_SERVICE_HOST=employee-service
      - ATTENDANCE_SERVICE_HOST=attendance-service
      - LEAVE_SERVICE_HOST=leave-service
      - RECRUITMENT_SERVICE_HOST=recruitment-service
      - HRM_SERVICE_HOST=hrm-service
      - SALARY_SERVICE_HOST=salary-service
      - ANALYTICS_SERVICE_HOST=analytics-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      - GRPC_SKIP_HOSTNAME_VERIFICATION=true
      - METRICS_PORT=9003
      - LOKI_URL=http://loki:3100
      - OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "9002:9002"
      - "9003:9003"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  auth-service:
    container_name: auth-service
    image: ysam090/hrms-auth-service:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=auth-service
        - PROJECT=auth-service
        - PORT=50051
    environment:
      - METRICS_PORT=9101
      - LOKI_URL=http://loki:3100
    ports:
      - "50051:50051"
      - "9101:9101"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  user-service:
    container_name: user-service
    image: ysam090/hrms-user-service:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=user-service
        - PROJECT=user-service
        - PORT=50052
    environment:
      - METRICS_PORT=9102
      - LOKI_URL=http://loki:3100
    ports:
      - "50052:50052"
      - "9102:9102"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  employee-service:
