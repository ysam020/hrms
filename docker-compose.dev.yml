  hrm-service:
    container_name: hrm-service
    image: ysam090/hrms-hrm-service:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=hrm-service
        - PROJECT=hrm-service
        - PORT=50057
    environment:
      - METRICS_PORT=9107
      - LOKI_URL=http://loki:3100
    ports:
      - "50057:50057"
      - "9107:9107"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  salary-service:
    container_name: salary-service
    image: ysam090/hrms-salary-service:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=salary-service
        - PROJECT=salary-service
        - PORT=50058
    environment:
      - METRICS_PORT=9108
      - LOKI_URL=http://loki:3100
    ports:
      - "50058:50058"
      - "9108:9108"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  analytics-service:
    container_name: analytics-service
    image: ysam090/hrms-analytics-service:latest
    build:
      context: .
      dockerfile: ./docker/base.Dockerfile
      args:
        - APP_DIR=analytics-service
        - PROJECT=analytics-service
        - PORT=50059
    environment:
      - METRICS_PORT=9109
      - LOKI_URL=http://loki:3100
    ports:
      - "50059:50059"
      - "9109:9109"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
