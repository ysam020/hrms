      - LOKI_URL=http://loki:3100
    ports:
      - "50053:50053"
      - "9103:9103"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *backend-service

  attendance-service:
